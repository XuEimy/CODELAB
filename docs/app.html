.studio-window__meter-rail::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--fill,50%);background:var(--green);border-radius:999px}
.studio-window__meter b{font-size:10px;text-align:right;color:var(--text);font-family:var(--font-code)}
.studio-window__skill,.studio-window__preset,.studio-window__empty{padding:8px 10px}
.studio-window__skill{display:grid;gap:8px}
.studio-window__skill-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.studio-window__tags span,.studio-window__schema-list span{background:var(--bg);font-size:8px}

[data-theme="light"] .studio-window__graph-root{border-color:rgba(8,145,178,.22);background:rgba(8,145,178,.08)}
.studio-window__hero--rich strong{font-size:12px}
.studio-window__hero--rich span{font-size:9px;line-height:1.6}

/* ═══ MOCKUP VIEWER ═══ */
.mockup-container{display:flex;flex-direction:column;height:100%;overflow:hidden}
.mockup-toolbar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0;flex-wrap:wrap}
.mockup-btn{padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--textd);font-size:10px;font-family:var(--font-code);cursor:pointer;transition:all .15s var(--ease);display:flex;align-items:center;gap:4px}
.mockup-btn:hover{border-color:var(--gold);color:var(--gold)}
.mockup-btn.active{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.mockup-viewport{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;background:var(--bg)}
.mockup-frame{position:relative;transition:all .3s var(--ease);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mockup-frame iframe{border:none;display:block;background:#000}
.frame-modern{border:3px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.frame-modern .mockup-stand{display:none}
.frame-crt{border:14px solid #2a2a2a;border-radius:22px;box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 8px 32px rgba(0,0,0,.5);background:#1a1a1a;padding:4px}
.frame-crt::after{content:'';position:absolute;inset:14px;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;border-radius:10px;z-index:2}
.frame-crt::before{content:'';position:absolute;inset:14px;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.3) 100%);pointer-events:none;z-index:3;border-radius:10px}
.frame-arcade{border:16px solid #333;border-radius:12px 12px 6px 6px;box-shadow:0 8px 24px rgba(0,0,0,.6);background:linear-gradient(180deg,#444,#222);padding:6px}
.frame-arcade::before{content:'ARCADE';position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--font-head);font-size:8px;color:var(--gold);letter-spacing:3px}
.frame-handheld{max-width:260px;border:18px solid #555;border-top-width:28px;border-bottom-width:36px;border-radius:18px;background:#444;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.frame-handheld::after{content:'';position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;border:3px solid #666;background:#333}
.frame-handheld::before{content:'GAME';position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:var(--font-head);font-size:7px;color:#888;letter-spacing:2px}

/* ═══ COLLAB STATUS ═══ */
.collab-list{padding:8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;height:100%}

.collab-time{font-size:9px;color:var(--textd);font-family:var(--font-code);flex-shrink:0}

/* ═══ WISDOM TREE WINDOW (plan_tree mirror) ═══ */

.brief-win{display:flex;flex-direction:column;height:100%}

.brief-section{margin-bottom:14px}
.brief-section-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--accent2);text-transform:uppercase;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ═══ AGENT TASK LIST WINDOW ═══ */

/* ═══ WINDOW PANEL ═══ */
#win-panel{position:fixed;top:calc(var(--hdr1) + var(--hdr2));right:0;width:200px;height:calc(100vh - var(--hdr1) - var(--hdr2));background:var(--bg2);border-left:1px solid var(--border);z-index:300;display:none;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.4)}
#win-panel.open{display:flex}
.wp-hdr{height:32px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0}
.wp-title{font-family:var(--font-code);font-size:9px;letter-spacing:2px;color:var(--textm);flex:1}
.wp-close{background:none;border:none;color:var(--textd);cursor:pointer;font-size:12px;padding:2px}.wp-close:hover{color:var(--pink)}
/* ═══ WORKSPACE ONBOARDING GUIDE ═══ */
#ws-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}

.wsg-inner{pointer-events:auto;max-width:680px;width:90%;padding:32px}

.wsg-item:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.wsg-item span{font-family:var(--font-ui);font-size:11px;color:var(--textm)}
.wsg-item:hover span{color:var(--accent)}
.wp-body{flex:1;overflow-y:auto;padding:6px}
.wp-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);margin-bottom:4px;cursor:pointer;transition:all .2s var(--ease);user-select:none}

.wp-item.on{border-color:var(--accent2)}

.wp-item .wp-name{font-family:var(--font-code);font-size:10px;color:var(--textm);flex:1}

/* ═══ REMOTE CURSORS ═══ */
.remote-cursor{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity;transition:transform .08s linear,opacity .18s var(--ease)}
.remote-cursor.has-bubble .rc-label{opacity:0;transform:translateY(6px) scale(.96)}
.remote-cursor.is-local .rc-arrow,.remote-cursor.is-local .rc-label{display:none}
.rc-arrow{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid;transform:rotate(-30deg);transform-origin:top left}
.rc-label{position:absolute;left:12px;top:8px;padding:2px 6px;border-radius:3px;font-family:var(--font-code);font-size:9px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:opacity .18s var(--ease),transform .18s var(--ease)}
.rc-bubble{position:absolute;left:12px;top:8px;display:flex;align-items:center;min-height:42px;max-width:260px;padding:0 18px;border-radius:999px;background:linear-gradient(180deg,#ff34b3 0%,#f215a5 100%);color:#fff;font-family:var(--font-ui);font-size:13px;font-weight:500;letter-spacing:.01em;white-space:nowrap;box-shadow:0 14px 28px rgba(242,21,165,.28),inset 0 -2px 0 rgba(0,0,0,.12);transform:translateY(6px) scale(.97);opacity:0;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.remote-cursor.has-bubble .rc-bubble{transform:translateY(0) scale(1)}
.remote-cursor.is-fading .rc-bubble{filter:saturate(.92)}
.rc-bubble.is-placeholder{color:rgba(255,255,255,.78)}

/* ═══ TYPING INDICATOR (header) ═══ */
.typing-indicator{display:inline-flex;gap:2px;margin-left:2px;vertical-align:middle}
.typing-indicator span{width:3px;height:3px;border-radius:50%;animation:dotB .9s infinite}
.typing-indicator span:nth-child(2){animation-delay:.15s}
.typing-indicator span:nth-child(3){animation-delay:.3s}

.settings-hdr{height:44px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px}
.settings-hdr-title{font-family:var(--font-code);font-size:11px;letter-spacing:2px;color:var(--textm);flex:1}

.settings-group{display:flex;flex-direction:column;gap:5px}

.settings-desc{font-size:10px;color:var(--textd);line-height:1.5;font-family:var(--font-code)}
.settings-input{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-code);font-size:12px;outline:none;transition:all .2s var(--ease)}.settings-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

.theme-btn{flex:1;padding:8px 6px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--textm);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;transition:all .15s var(--ease);text-align:center}
.theme-btn:hover{border-color:var(--accent2);color:var(--text)}
.theme-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.shortcuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.shortcut-item{display:flex;align-items:center;gap:6px;font-family:var(--font-code);font-size:9px;color:var(--textd)}
.shortcut-key{padding:2px 5px;background:var(--bg4);border:1px solid var(--border);border-radius:3px;font-size:8px;color:var(--textm)}
/* AI PRESET BUTTONS */
.ai-preset-btn{padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;transition:all .15s var(--ease);white-space:nowrap;flex-shrink:0}
.ai-preset-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.ai-preset-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
/* COLOR SWATCH */
.color-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s var(--ease)}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
/* EMOJI PICK */
.emoji-pick{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;transition:all .15s var(--ease)}
.emoji-pick svg{width:100%;height:100%;border-radius:50%}
.emoji-pick:hover{border-color:var(--accent2);transform:scale(1.1)}
.emoji-pick.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
/* CURSOR STYLE */
.cursor-style-btn{flex:1;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;text-align:center;transition:all .15s var(--ease)}
.cursor-style-btn:hover{border-color:var(--accent2);color:var(--accent)}
.cursor-style-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}

/* ═══ WELCOME ═══ */
#welcome{position:fixed;inset:0;background:rgba(5,9,18,.97);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(14px)}
.wc{width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow-xl)}
.wc-logo{font-family:var(--font-head);font-size:22px;font-weight:900;letter-spacing:6px;color:var(--accent);text-align:center}.wc-logo em{color:var(--green);font-style:normal}
.wc-tag{text-align:center;font-size:12px;color:var(--textm);line-height:1.75}.wc-tag strong{color:var(--text)}
.f-lbl{font-size:9px;color:var(--textd);text-transform:uppercase;letter-spacing:2px;font-family:var(--font-code);margin-bottom:5px}
.f-inp{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-code);font-size:13px;outline:none;transition:all .2s var(--ease)}.f-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.wc-create{flex:1;padding:11px;background:var(--green);color:#020a06;border:none;border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s var(--ease)}.wc-create:hover{filter:brightness(1.08);box-shadow:var(--shadow-md)}
.wc-div{display:flex;align-items:center;gap:10px;color:var(--textd);font-size:9px;letter-spacing:2px}.wc-div::before,.wc-div::after{content:'';flex:1;height:1px;background:var(--border)}
.jr{display:flex;gap:8px}
.wc-join{padding:10px 16px;background:transparent;color:var(--accent);border:1px solid var(--accent2);border-radius:5px;font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s var(--ease)}.wc-join:hover{background:var(--accent-bg)}

/* ═══ TOAST (improved) ═══ */
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:8px 18px 8px 14px;border-radius:8px;font-size:11px;font-family:var(--font-code);opacity:0;transition:all .25s var(--ease);z-index:600;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;border-left:3px solid var(--accent)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.toast-success{border-left-color:var(--green)}
#toast.toast-error{border-left-color:var(--pink)}
#toast.toast-warn{border-left-color:var(--gold)}
/* ═══ WISDOM TREE (design-graph) ═══ */
.wt-toolbar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.wt-view-switch{display:flex;gap:2px;background:var(--bg3);border-radius:999px;padding:2px}
.wt-view-btn{padding:4px 12px;border-radius:999px;border:none;background:transparent;color:var(--textd);font-family:var(--font-code);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
.wt-view-btn:hover{color:var(--textm)}
.wt-view-btn.active{background:var(--accent);color:#fff}
.wt-ai-btn{padding:4px 12px;border-radius:999px;border:1px solid var(--purple);background:var(--purple-bg);color:var(--purple);font-family:var(--font-code);font-size:10px;font-weight:700;cursor:pointer;transition:all .15s var(--ease)}
.wt-ai-btn:hover{background:var(--purple);color:#fff}
.wt-ai-btn:disabled{opacity:.4;cursor:not-allowed}
.wt-summary{padding:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);flex-shrink:0;max-height:40%;overflow-y:auto}
.wt-summary:empty{display:none}
.wt-summary-card{padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--border)}
.wt-summary-label{font-family:var(--font-code);font-size:9px;letter-spacing:1px;color:var(--textd);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.wt-summary-value{font-family:var(--font-ui);font-size:11px;color:var(--text);line-height:1.6}
.wt-summary-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.wt-summary-list li{font-size:11px;color:var(--textm);padding-left:12px;position:relative}
.wt-summary-list li::before{content:'';position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%}
.wt-summary-list.sl-green li::before{background:var(--green)}
.wt-summary-list.sl-accent li::before{background:var(--accent)}
.wt-summary-list.sl-purple li::before{background:var(--purple)}
.wt-summary-list.sl-pink li::before{background:var(--pink)}
.wt-issue-card{padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px}
.wt-issue-card-title{font-size:11px;color:var(--text);display:flex;align-items:center;gap:4px}
.wt-loading{display:flex;align-items:center;gap:8px;padding:10px;font-size:10px;color:var(--textd)}
.wt-loading .wt-spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:wt-spin .6s linear infinite}
@keyframes wt-spin{to{transform:rotate(360deg)}}
.wt-graph-area{flex:1;overflow:hidden;min-height:0}
.ai-suggest{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden}
.ai-suggest-label{font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:1px;flex-shrink:0}
.ai-suggest-pills{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch}
.ai-suggest-pills::-webkit-scrollbar{display:none}
.ai-suggest-pill{border-radius:999px;padding:4px 12px;border:1px solid var(--border);background:var(--bg3);color:var(--textm);font-size:10px;font-family:var(--font-code);cursor:pointer;transition:all .15s var(--ease);white-space:nowrap;flex-shrink:0}
.ai-suggest-pill:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.dv-agent{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg)}
.dv-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.dv-msg{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:flex-start;animation:msgIn .3s var(--ease-out)}
.dv-msg-av{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--textm)}
.dv-msg-av-ai{background:linear-gradient(135deg,#ec4899,#f43f5e);border-color:transparent;color:#fff;font-size:12px}
.dv-msg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dv-msg-name{font-size:9px;color:var(--textd);padding:0 4px;font-family:var(--font-code);display:flex;align-items:center;gap:6px}
.dv-msg-name-ai{color:var(--pink)}
.dv-msg-time{font-size:9px;color:var(--textd);font-weight:400}
.dv-msg-bub{display:inline-block;max-width:100%;padding:10px 12px;font-size:11px;line-height:1.65;word-break:break-word;white-space:pre-wrap;font-family:var(--font-ui);border-radius:12px}
.dv-msg-bub-user{background:var(--bg2);border:1px solid var(--border);color:var(--text)}
.dv-msg-bub-ai{background:var(--pink-bg);border:1px solid rgba(251,113,133,.15);color:var(--text)}
.dv-skills{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.dv-skill{border-radius:999px;padding:4px 12px;border:1px solid var(--pink);background:var(--pink-bg);color:var(--pink);font-size:10px;font-family:var(--font-code);font-weight:700;cursor:pointer;transition:all .15s var(--ease);white-space:nowrap;flex-shrink:0}
.dv-skill:hover{background:var(--pink);color:#fff}
.dv-input-area{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end;flex-shrink:0;background:var(--bg)}
.dv-input{flex:1;padding:7px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-ui);font-size:11px;outline:none;resize:none;line-height:1.4;max-height:80px;min-height:32px;transition:border-color .2s var(--ease)}
.dv-input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-bg)}
.dv-send{height:32px;padding:0 14px;background:var(--pink);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:11px;font-weight:700;font-family:var(--font-ui);transition:all .15s var(--ease);flex-shrink:0}
.dv-send:hover{filter:brightness(1.1)}
</style>

function getCategoryPresetWins(catLabel,catId){
  const CORE=['personal-ws','task-info','chat','preview','prompt-editor']
  const id=(catId||'').toLowerCase()
  const label=catLabel||''
  if(/concept|structure|core/.test(id)||/概念|结构|核心/.test(label))
    return[...CORE,'design-graph','ai']
  if(/mechanic|gameplay|play/.test(id)||/玩法|机制/.test(label))
    return[...CORE,'editor','codemap']
  if(/growth|progress|system/.test(id)||/成长|系统|进阶/.test(label))
    return[...CORE,'editor','design-tree']
  if(/experience|ux|ui|design|visual/.test(id)||/体验|设计|界面|视觉/.test(label))
    return[...CORE,'web-design','design-vibe']
  if(/decision|strategy|key|trade/.test(id)||/决策|策略|关键/.test(label))
    return[...CORE,'ai','design-graph']
  return[...CORE,'ai','design-graph']
}

function getPresetLayout(mode,ww,wh){
  const g=4,L={}
  if(mode.startsWith('pw-')){
    // Dynamic layout based on actual active windows
    const modeWins=MODE_WINS[mode]||[]
    const find=t=>modeWins.find(id=>parseWinInstanceId(id).type===t)||t
    const has=t=>modeWins.some(id=>parseWinInstanceId(id).type===t)
    // IDs (may be instanceIds like task-info@user123)
    const pwId=find('personal-ws'),chatId=find('chat'),pvId=find('preview')
    const peId=find('prompt-editor'),tiId=find('task-info')
    // Detect which category-specific windows are present
    const hasEditor=has('editor'),hasCodemap=has('codemap'),hasDesignGraph=has('design-graph')
    const hasAI=has('ai'),hasWebDesign=has('web-design'),hasDesignVibe=has('design-vibe')
    const hasDesignTree=has('design-tree')
    const edId=find('editor'),cmId=find('codemap'),dgId=find('design-graph')
    const aiId=find('ai'),wdId=find('web-design'),dvId=find('design-vibe'),dtId=find('design-tree')

    // Layout: 4 columns — [col1: dashboard+chat] [col2: task-info+prompt-editor] [col3: main content] [col4: preview]
    // col3 content varies by category
    const c1=Math.max(Math.floor(ww*.16),180)
    const c4=Math.max(Math.floor(ww*.22),200)
    const c2=Math.max(Math.floor(ww*.20),190)
    const c3=ww-c1-c2-c4-g*5
    const c1x=g, c2x=c1+g*2, c3x=c1+c2+g*3, c4x=c1+c2+c3+g*4
    const fullH=wh-g*2
    const splitY=Math.floor(wh*.52), topH=splitY-g, botH=wh-splitY-g*2

    // Col 1: personal-ws (top) + chat (bottom)
    L[pwId]={x:c1x,y:g,w:c1-g,h:topH}
    L[chatId]={x:c1x,y:splitY+g,w:c1-g,h:botH}
    // Col 2: task-info (top) + prompt-editor (bottom)
    L[tiId]={x:c2x,y:g,w:c2-g,h:topH}
    L[peId]={x:c2x,y:splitY+g,w:c2-g,h:botH}
    // Col 4: preview (full height)
    L[pvId]={x:c4x,y:g,w:c4-g,h:fullH}

    // Col 3: category-specific — split based on what's present
    if(hasEditor&&hasCodemap){
      // mechanics: editor (top 65%) + codemap (bottom 35%)
      const splitC3=Math.floor(wh*.65)
      L[edId]={x:c3x,y:g,w:c3-g,h:splitC3-g}
      L[cmId]={x:c3x,y:splitC3+g,w:c3-g,h:wh-splitC3-g*2}
    }else if(hasEditor&&hasDesignTree){
      // growth: editor (top 60%) + design-tree (bottom 40%)
      const splitC3=Math.floor(wh*.60)
      L[edId]={x:c3x,y:g,w:c3-g,h:splitC3-g}
      L[dtId]={x:c3x,y:splitC3+g,w:c3-g,h:wh-splitC3-g*2}
    }else if(hasWebDesign&&hasDesignVibe){
      // experience: web-design (top 55%) + design-vibe (bottom 45%)
      const splitC3=Math.floor(wh*.55)
      L[wdId]={x:c3x,y:g,w:c3-g,h:splitC3-g}
      L[dvId]={x:c3x,y:splitC3+g,w:c3-g,h:wh-splitC3-g*2}
    }else if(hasDesignGraph&&hasAI){
      // concept/decision/default: design-graph (top 58%) + AI (bottom 42%)
      const splitC3=Math.floor(wh*.58)
      L[dgId]={x:c3x,y:g,w:c3-g,h:splitC3-g}
      L[aiId]={x:c3x,y:splitC3+g,w:c3-g,h:wh-splitC3-g*2}
    }else if(hasEditor){
      L[edId]={x:c3x,y:g,w:c3-g,h:fullH}
    }else if(hasDesignGraph){
      L[dgId]={x:c3x,y:g,w:c3-g,h:fullH}
    }else if(hasAI){
      L[aiId]={x:c3x,y:g,w:c3-g,h:fullH}
    }
    // Bare-type aliases for fallback lookup
    L['personal-ws']=L[pwId];L.chat=L[chatId];L.preview=L[pvId]
    L['prompt-editor']=L[peId];L['task-info']=L[tiId]
    if(L[edId])L.editor=L[edId];if(L[cmId])L.codemap=L[cmId]
    if(L[dgId])L['design-graph']=L[dgId];if(L[aiId])L.ai=L[aiId]
    if(L[wdId])L['web-design']=L[wdId];if(L[dvId])L['design-vibe']=L[dvId]
    if(L[dtId])L['design-tree']=L[dtId]
  } else if(mode==='dev'){
    const edW=Math.floor(ww*.48),peW=Math.floor(ww*.22),pvW=ww-edW-peW-g*4
    const topH=Math.floor(wh*.55),botH=wh-topH-g*3
    L.editor={x:g,y:g,w:edW-g,h:wh-g*2}
    L.codemap={x:edW+g*2,y:g,w:peW-g,h:topH-g}
    L['prompt-editor']={x:edW+g*2,y:topH+g*2,w:peW-g,h:botH}
    L.preview={x:edW+peW+g*3,y:g,w:pvW-g,h:wh-g*2}
  } else if(mode==='design'){
    const leftW=ww*.24,centerW=ww*.46,rightW=ww-leftW-centerW-g*4
    const sideTopH=wh*.56,bottomH=wh-sideTopH-g*3
    const leftX=g,centerX=leftW+g*2,rightX=leftW+centerW+g*3
    L['design-tree']={x:leftX,y:g,w:leftW-g,h:sideTopH-g}
    L.preview={x:leftX,y:sideTopH+g*2,w:leftW-g,h:bottomH}
    L['design-graph']={x:centerX,y:g,w:centerW,h:wh-g*2}
    L['design-vibe']={x:rightX,y:g,w:rightW-g,h:sideTopH-g}
    L['web-design']={x:rightX,y:sideTopH+g*2,w:rightW-g,h:bottomH}
  } else if(mode==='chat'){
    const c1W=Math.max(Math.floor(ww*.22),220)
    const c2W=Math.max(Math.floor(ww*.24),220)
    const c3W=ww-c1W-c2W-g*4
    const topH=Math.floor(wh*.52),botH=wh-topH-g*3
    L['personal-ws']={x:g,y:g,w:c1W-g,h:topH-g}
    L.chat={x:g,y:topH+g*2,w:c1W-g,h:botH}
    L['task-info']={x:c1W+g*2,y:g,w:c2W-g,h:topH-g}
    L.ai={x:c1W+g*2,y:topH+g*2,w:c2W-g,h:botH}
    L.preview={x:c1W+c2W+g*3,y:g,w:c3W-g,h:wh-g*2}
  } else if(mode==='game'){
    const leftW=ww*.52,rightW=ww-leftW-g*3
    L['web-design']={x:g,y:g,w:leftW-g,h:wh-g*2}
    L.preview={x:leftW+g*2,y:g,w:rightW-g,h:wh-g*2}
  } else if(mode==='task'){
    const treeW=Math.floor(ww*.34),tiW=Math.floor(ww*.18),peW=Math.floor(ww*.24),pvW=ww-treeW-tiW-peW-g*5
    L['design-graph']={x:g,y:g,w:treeW-g,h:wh-g*2}
    L['task-info']={x:treeW+g*2,y:g,w:tiW-g,h:wh-g*2}
    L['prompt-editor']={x:treeW+tiW+g*3,y:g,w:peW-g,h:wh-g*2}
    L.preview={x:treeW+tiW+peW+g*4,y:g,w:pvW-g,h:wh-g*2}
  }
  return L
}

const MODE_WINS_DEFAULT={
  dev:    ['editor','preview','codemap','prompt-editor'],
  design: ['design-tree','design-graph','design-vibe','web-design','preview'],
  chat:   ['personal-ws','chat','task-info','ai','preview'],
  game:   ['web-design','preview'],
  task:   ['design-graph','task-info','prompt-editor','preview'],
}

function layoutMode(mode){
  console.log('[DBG] layoutMode called with:', mode, 'wins keys:', Object.keys(wins))
  const active=MODE_WINS[mode]||MODE_WINS_DEFAULT[mode]||['preview']
  console.log('[DBG] active windows:', active)
  MODE_WINS[mode]=[...active]
  // Show onboarding guide for empty personal workspaces
  const isMyPW=mode.startsWith('pw-')&&(mode.slice(3)===myId||mode.slice(3).startsWith(myId+'-ws'))
  const isEmpty=active.length===0
  const guide=I('ws-guide')
  if(guide){
    if(isMyPW&&isEmpty){guide.classList.remove('hidden');renderWSGuide(mode)}
    else{guide.classList.add('hidden')}
  }
  Object.keys(wins).forEach(id=>{
    wins[id].visible=false;wins[id].minimized=false
    wins[id].el.classList.add('hidden');wins[id].el.classList.remove('minimized')
    wins[id].el.classList.remove('read-only') // clear read-only
    wins[id].readOnly=false
  })
  const ws=I('workspace')
  const ww=Math.max(ws.offsetWidth||900,400)
  const wh=Math.max(ws.offsetHeight||500,300)
  const preset=getPresetLayout(mode,ww,wh)
  // Determine if viewing another user's workspace
  const uid=mode.startsWith('pw-')?mode.slice(3):null
  const viewingOther=uid&&uid!==myId&&!uid.startsWith(myId+'-ws')
  active.forEach(id=>{
    const w=wins[id];if(!w){console.log('[DBG] MISSING win:', id);return}
    console.log('[DBG] showing win:', id, 'el:', w.el)
    const saved=getSavedLayout(mode,id)
    // For instanceIds, try lookup by bare type in preset
    const{type}=parseWinInstanceId(id)
    if(saved){w.x=saved.x;w.y=saved.y;w.w=saved.w;w.h=saved.h}
    else{const p=preset[id]||preset[type];if(p){w.x=p.x;w.y=p.y;w.w=p.w;w.h=p.h}else{w.x=20+Math.random()*100;w.y=20+Math.random()*60;w.w=w.def.w;w.h=w.def.h}}
    w.visible=true;w.el.classList.remove('hidden')
    // Apply read-only overlay when viewing another user's workspace
    if(viewingOther&&!hasEditPermission(id)){
      w.readOnly=true
      w.el.classList.add('read-only')
    }
    applyWinPos(id)
  })
  renderWinPanel()
  // update codemap if visible
  if(active.includes('codemap'))setTimeout(()=>updateCodemap(),100)
  // Load read-only content for other user's windows
  if(viewingOther)loadReadOnlyContent(mode.slice(3))
}

function renderWSGuide(mode){
  const guide=I('ws-guide')
  if(!guide)return
  const cats=[
    {label:'协作',color:'var(--accent2)',items:['personal-ws','chat','activity','stats']},
    {label:'任务',color:'var(--gold)',   items:['task-info','design-graph','prompt-editor']},
    {label:'设计',color:'var(--pink)',   items:['design-tree','design-vibe','web-design']},
    {label:'开发',color:'var(--purple)', items:['editor','codemap','preview','ai']},
  ]
  const catsHtml=cats.map(cat=>{
    const items=cat.items.map(id=>{
      const d=WIN_DEFS.find(x=>x.id===id);if(!d)return''
      return`<div class="wsg-item" onclick="wsGuideAddWin('${id}')"><span class="ico ico-sm" style="color:${d.color}"><svg><use href="#${d.icon}"/></svg></span><span>${esc(d.name)}</span></div>`
    }).join('')
    return`<div class="wsg-cat"><div class="wsg-cat-label" style="color:${cat.color}">${cat.label}</div><div class="wsg-items">${items}</div></div>`
  }).join('')
  guide.innerHTML=`<div class="wsg-inner"><div class="wsg-title">选择一个窗口开始</div><div class="wsg-cats">${catsHtml}</div></div>`
}
window.wsGuideAddWin=(id)=>{
  if(!wins[id])createWinInstance(id)
  if(!MODE_WINS[currentMode])MODE_WINS[currentMode]=[]
  if(!MODE_WINS[currentMode].includes(id))MODE_WINS[currentMode].push(id)
  const w=wins[id]
  if(w){w.visible=true;w.x=40+Math.random()*200;w.y=40+Math.random()*120;w.w=w.def.w;w.h=w.def.h;w.el.classList.remove('hidden');applyWinPos(id);bringToFront(id)}
  I('ws-guide').classList.add('hidden')
  renderWinPanel()
  saveLayout()
}
window.resetLayout=()=>{
  localStorage.removeItem('codelab_layout_'+currentMode)
  layoutMode(currentMode)
  toast('已恢复预设布局')
}

// ── TASK STEP AUTO-ADVANCE ──
let taskStepState = 'understand' // understand | code | preview | submit

function advanceTaskStep(step){
  const steps = ['understand','code','preview','submit']
  const current = steps.indexOf(taskStepState)
  const target = steps.indexOf(step)
  if(target <= current) return
  taskStepState = step
  renderTaskSteps()
}

function renderTaskSteps(){
  const stepsEl = document.querySelector('.ti-steps')
  if(!stepsEl) return
  const steps = ['understand','code','preview','submit']
  const currentIdx = steps.indexOf(taskStepState)
  stepsEl.querySelectorAll('.ti-step').forEach((el,i)=>{
    el.classList.remove('active','done')
    if(i < currentIdx) el.classList.add('done')
    if(i === currentIdx) el.classList.add('active')
  })
}

function submitTaskDelivery(iid){
  advanceTaskStep('submit')
  if(typeof toast === 'function') toast('任务已提交验收！')
}

function buildRuntimePreviewCode(code){
  const bridge=`<script>(function(){if(window.__codelabConsolePatched)return;window.__codelabConsolePatched=true;['log','warn','error'].forEach(function(level){var original=console[level];console[level]=function(){try{parent.postMessage({type:'codelab-console',level:level,args:Array.from(arguments).map(function(item){try{return typeof item==='string'?item:JSON.stringify(item)}catch(e){return String(item)}}),ts:Date.now()},'*')}catch(e){};if(original)return original.apply(console,arguments)};});window.addEventListener('error',function(event){try{parent.postMessage({type:'codelab-console',level:'error',args:[String(event.message||'Unknown error')+' at '+String(event.filename||'index.html')+':'+String(event.lineno||0)+':'+String(event.colno||0)],ts:Date.now()},'*')}catch(e){}});}());<\/script>`
  const fitScript=`<script>(function(){function __codelabFit(){var body=document.body;if(!body)return;var vw=window.innerWidth,vh=window.innerHeight;// Find the primary game container: first canvas, or a fixed-size div/container
var target=document.querySelector('canvas')||document.querySelector('#game,#app,#root,[id*="game"],[class*="game"],[id*="container"],[class*="container"]');if(!target){// fallback: if body has explicit pixel size, scale that
var bs=window.getComputedStyle(body);var bw=parseFloat(bs.width),bh=parseFloat(bs.height);if(bw>0&&bh>0&&(bw>vw*1.05||bh>vh*1.05)){var s=Math.min(vw/bw,vh/bh);body.style.transformOrigin='top left';body.style.transform='scale('+s+')';body.style.width=(bw)+'px';body.style.height=(bh)+'px';document.documentElement.style.overflow='hidden';}return;}var natW=target.width||target.offsetWidth||target.scrollWidth;var natH=target.height||target.offsetHeight||target.scrollHeight;if(!natW||!natH)return;var scale=Math.min(vw/natW,vh/natH,1.5);if(scale>0.95&&scale<1.05)return;// already fits well
body.style.display='flex';body.style.alignItems='center';body.style.justifyContent='center';body.style.minHeight='100vh';body.style.margin='0';body.style.overflow='hidden';body.style.boxSizing='border-box';target.style.transformOrigin='center center';target.style.transform='scale('+scale+')';}window.addEventListener('load',function(){setTimeout(__codelabFit,50);});window.addEventListener('resize',__codelabFit);}());<\/script>`
  const withBridge=/<head[^>]*>/i.test(code)?code.replace(/<head([^>]*)>/i,`<head$1>${bridge}`):(`${bridge}${code}`)
  if(/<\/body>/i.test(withBridge))return withBridge.replace(/<\/body>/i,`${fitScript}</body>`)
  return withBridge+fitScript
}

function focusEditorLocation(path,line,column=1){
  if(path&&typeof setActiveFile==='function')setActiveFile(path)
  requestAnimationFrame(()=>{
    const ta=I('ed-ta')
    if(!ta)return
    const lines=(ta.value||'').split('\n')
    const safeLine=Math.max(1,Math.min(Number(line)||1,lines.length||1))
    const safeCol=Math.max(1,Number(column)||1)
    let offset=0
    for(let i=0;i<safeLine-1;i+=1)offset+=lines[i].length+1
    offset+=Math.min(safeCol-1,(lines[safeLine-1]||'').length)
    ta.focus()
    ta.selectionStart=offset
    ta.selectionEnd=offset
    ta.scrollTop=Math.max(0,(safeLine-3)*20)
    updateEdPos()
    updateCurrentLineHighlight()
  })
}

// ── WISDOM TREE CONTEXT MENU ──
let _wtCtxEl=null
function showWisdomTreeCtxMenu(x,y,nodeId){
  removeWisdomTreeCtxMenu()
  const menu=document.createElement('div')
  menu.className='wt-ctx'
  menu.id='wt-ctx-menu'
  menu.style.left=x+'px';menu.style.top=y+'px'
  // Check if this is an agent task node (has entry in yAgentTasks)
  const isTask=yAgentTasks&&yAgentTasks.get(nodeId)
  const raw=isTask?yAgentTasks.get(nodeId):null
  let taskTitle=''
  if(raw)try{taskTitle=(typeof raw==='string'?JSON.parse(raw):raw).title||nodeId}catch{taskTitle=nodeId}
  menu.innerHTML=`
    <div class="wt-ctx-item" onclick="window._wtCtxSelectNode('${nodeId}')">&#128065; 查看详情</div>
    ${isTask?`<div class="wt-ctx-item wt-ctx-item--danger" onclick="window._wtCtxDeleteNode('${nodeId}')">&#128465; 删除节点</div>`:''}
  `
  document.body.appendChild(menu)
  _wtCtxEl=menu
  // Ensure menu stays within viewport
  const rect=menu.getBoundingClientRect()
  if(rect.right>window.innerWidth)menu.style.left=(x-rect.width)+'px'
  if(rect.bottom>window.innerHeight)menu.style.top=(y-rect.height)+'px'
  setTimeout(()=>document.addEventListener('mousedown',removeWisdomTreeCtxMenu,{once:true}),0)
}
function removeWisdomTreeCtxMenu(){
  if(_wtCtxEl){_wtCtxEl.remove();_wtCtxEl=null}
}
window._wtCtxSelectNode=(nodeId)=>{
  removeWisdomTreeCtxMenu()
  if(yAgentTasks&&yAgentTasks.get(nodeId))selectTask(nodeId)
}
window._wtCtxDeleteNode=(nodeId)=>{
  removeWisdomTreeCtxMenu()
  if(!yAgentTasks)return
  const raw=yAgentTasks.get(nodeId)
  if(!raw)return
  let title=nodeId
  try{title=(typeof raw==='string'?JSON.parse(raw):raw).title||nodeId}catch{}
  if(!confirm('确认删除「'+title+'」？'))return
  yAgentTasks.delete(nodeId)
  if(currentTaskId===nodeId){
    currentTaskId=null
    restorePromptEditorToStructuredPrompt()
  }
  renderDesignStudioWindows()
  toast('节点已删除')
}
function renderDesignStudioWindows(){
  const baseState=ensureDesignStudioState()
  designStudioState=reduceDesignStudioState(baseState,{type:'set-runtime',runtime:buildDesignStudioRuntime(baseState)})
  const state=designStudioState

window.onWTNodeClick=function(nodeId){
  // Try to find matching agent task
  if(yAgentTasks){
    const raw=yAgentTasks.get(nodeId)
    if(raw){selectTask(nodeId);return}
  }
  // Fallback: find in plan_tree nodes and auto-create as agent task
  const yTree=ydoc?.getMap?.('plan_tree')
  if(!yTree)return
  try{
    const nodes=JSON.parse(yTree.get('nodes')||'[]')
    const cats=JSON.parse(yTree.get('categories')||'[]')
    const node=nodes.find(n=>n.id===nodeId||n.label===nodeId)
    if(node&&yAgentTasks){
      const taskId=node.id||nodeId
      // Build prompt from structured prompt + node info
      const sp=yAgentState?.get('lastStructuredPrompt')||''
      let prompt=''
      if(sp&&node.label){
        const titleEscaped=node.label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')
        const secMatch=sp.match(new RegExp('【'+titleEscaped+'】\\n([\\s\\S]*?)(?=\\n【|$)'))
        if(secMatch)prompt=secMatch[1].trim()
        if(!prompt){
          const sectionRe=/【([^】]+)】\n([\s\S]*?)(?=\n【|$)/g
          let m2
          while((m2=sectionRe.exec(sp))!==null){
            if(m2[1].includes(node.label)||node.label.includes(m2[1])){prompt=m2[2].trim();break}
          }
        }
      }
      if(!prompt){
        let parts=[]
        if(node.label)parts.push('【任务】'+node.label)
        if(node.desc)parts.push('【描述】'+node.desc)
        if(node.category){
          const cat=cats.find(c=>c.id===node.category)
          if(cat)parts.push('【分类】'+cat.label)
        }
        if(node.priority)parts.push('【优先级】'+node.priority)
        if(sp)parts.push('\n【完整项目提示词】\n'+sp)
        prompt=parts.join('\n')
      }
      yAgentTasks.set(taskId,JSON.stringify({
        id:taskId,
        title:node.label||taskId,
        status:node.status||'open',
        priority:node.priority||'medium',
        description:node.desc||'',
        category:node.category||'',
        prompt:prompt,
        order:Date.now()
      }))
      selectTask(taskId)
      toast('已进入任务「'+node.label+'」')
    }
  }catch{}
}

请严格返回 JSON：
{

            let m2
            while((m2=sectionRe.exec(sp))!==null){
              if(m2[1].includes(n.label)||n.label.includes(m2[1])){prompt=m2[2].trim();break}

          if(n.category){

          if(sp)parts.push('\n【完整项目提示词】\n'+sp)
          prompt=parts.join('\n')
        }
        yAgentTasks.set(taskId,JSON.stringify({
          id:taskId,
          title:n.label||taskId,
          status:n.status||'open',
          priority:n.priority||'medium',
          description:n.desc||'',
          category:n.category||'',
          prompt:prompt,
          order:Date.now()
        }))
      })

  }

const CODENAV_FILE_ICONS={'index.html':'◇','styles/game.css':'◆','scripts/game.js':'▸'}

function parseCodeSections(content,lang){
  const sections=[]
  const lines=content.split('\n')
  if(lang==='javascript'||lang==='js'){
    lines.forEach((line,i)=>{
      const fn=line.match(/^\s*(?:export\s+)?(?:async\s+)?function\s+(\w+)/)
      const cls=line.match(/^\s*(?:export\s+)?class\s+(\w+)/)
      const arrow=line.match(/^\s*(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s+)?\(/)
      const method=line.match(/^\s+(\w+)\s*\(/)
      if(cls)sections.push({label:cls[1],line:i+1,kind:'class'})
      else if(fn)sections.push({label:fn[1]+'()',line:i+1,kind:'fn'})
      else if(arrow)sections.push({label:arrow[1]+'()',line:i+1,kind:'fn'})
      else if(method&&sections.length&&sections[sections.length-1].kind==='class')sections.push({label:'.'+method[1]+'()',line:i+1,kind:'method'})
    })
  }else if(lang==='css'){
    lines.forEach((line,i)=>{
      const sel=line.match(/^([.#@][\w-][^{]{0,40})\s*\{/)
      if(sel)sections.push({label:sel[1].trim(),line:i+1,kind:'selector'})
    })
  }else{
    // HTML — pick key elements
    lines.forEach((line,i)=>{
      const tag=line.match(/<(div|canvas|section|main|header|footer|nav)\s[^>]*(?:id|class)="([^"]+)"/)
      const comment=line.match(/<!--\s*(.+?)\s*-->/)
      if(tag)sections.push({label:`<${tag[1]}> ${tag[2].split(' ')[0]}`,line:i+1,kind:'el'})
      else if(comment)sections.push({label:comment[1].slice(0,30),line:i+1,kind:'comment'})
    })
  }
  return sections.slice(0,20) // cap to avoid flooding
}

  const collabMap={}

      if(u.activeFile)collabMap[u.activeFile]=(collabMap[u.activeFile]||[]).push(u)

  let totalLines=0
  let html=''
  files.forEach(file=>{
    const color=CODENAV_FILE_COLORS[file.path]||'var(--textm)'
    const icon=CODENAV_FILE_ICONS[file.path]||'·'
    const lines=(file.content||'').split('\n').length
    totalLines+=lines
    const sections=parseCodeSections(file.content||'',file.language)
    const isActive=file.path===activeFilePath
    html+=`<div class="codenav-file">
      <div class="codenav-file-hdr" onclick="setActiveFile('${file.path}');renderCodeNav()">
        <span class="codenav-file-dot" style="background:${color}"></span>
        <span class="codenav-file-name">${esc(file.name)}</span>
        <span class="codenav-file-lines">${lines}行</span>
      </div>`
    if(isActive&&sections.length){
      html+=`<div class="codenav-sections">`
      sections.forEach(sec=>{
        const kindIcon=sec.kind==='class'?'C':sec.kind==='fn'?'ƒ':sec.kind==='method'?'m':sec.kind==='selector'?'#':'◦'
        html+=`<div class="codenav-sec" onclick="codenavJump('${file.path}',${sec.line})">
          <span class="codenav-sec-icon">${kindIcon}</span>
          <span class="codenav-sec-label">${esc(sec.label)}</span>
          <span class="codenav-sec-line">:${sec.line}</span>
        </div>`
      })
      html+=`</div>`
    }
    html+=`</div>`
  })
  body.innerHTML=html
  // Footer
  const footer=I('codenav-footer')
  if(footer){
    const counts=files.map(f=>`${f.name.split('.').pop().toUpperCase()}:${(f.content||'').split('\n').length}`)
    footer.textContent=counts.join(' · ')+` · 共${totalLines}行`
  }
}

window.codenavAISearch=async function(){
  const input=I('codenav-input')
  if(!input)return
  const query=input.value.trim()
  if(!query)return
  const lk=localStorage.getItem('codelab_api_key')||API_KEY||''
  const lb=localStorage.getItem('codelab_api_base')||API_BASE||DEFAULT_API_BASE
  const lm=localStorage.getItem('codelab_api_model')||API_MODEL||'kimi-k2.5'
  if(!lk){toast('请先在设置中配置 API 密钥','warn');return}

  const btn=document.querySelector('.codenav-go')
  if(btn){btn.disabled=true;btn.textContent='搜索中'}

  const files=getWorkspaceFiles()
  const fileContext=files.map(f=>{
    const lines=(f.content||'').split('\n')
    return`--- ${f.path} (${lines.length}行) ---\n${lines.map((l,i)=>`${i+1}: ${l}`).join('\n').slice(0,3000)}`
  }).join('\n\n')

  const sysPrompt=`你是代码导航助手。用户会问关于代码的问题，你需要返回相关代码位置。
请严格返回 JSON 数组：
[{"file":"文件路径","line":行号,"label":"简短描述"}]
- 只返回 JSON，不要解释
- 最多返回 5 个结果
- line 必须是准确的行号
- label 用简短中文描述`

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiBase:lb,model:lm,apiKey:lk,temperature:1,max_tokens:512,stream:false,messages:[{role:'system',content:sysPrompt},{role:'user',content:`在以下代码中，${query}\n\n${fileContext}`}]})})
    if(!res.ok)throw new Error(await res.text())
    const data=await res.json()
    let text='';if(data.choices?.[0])text=data.choices[0].message?.content||''
    const m=text.match(/\[[\s\S]*\]/)
    if(!m)throw new Error('未找到结果')
    const results=JSON.parse(m[0])
    if(!Array.isArray(results)||!results.length)throw new Error('无匹配结果')
    // Show results
    const body=I('codenav-body')
    if(body){
      let rhtml=`<div class="codenav-result"><div class="codenav-result-title">搜索结果 · ${esc(query)}</div>`
      results.forEach(r=>{
        const color=CODENAV_FILE_COLORS[r.file]||'var(--textm)'
        rhtml+=`<div class="codenav-result-item" onclick="codenavJump('${esc(r.file)}',${r.line||1})">
          <span class="codenav-file-dot" style="background:${color};width:6px;height:6px"></span>
          <span class="codenav-sec-label">${esc(r.label||r.file)}</span>
          <span class="codenav-sec-line">${esc(r.file)}:${r.line||'?'}</span>
        </div>`
      })
      rhtml+=`</div>`
      body.insertAdjacentHTML('afterbegin',rhtml)
    }
    // Auto-jump to first result
    if(results[0])codenavJump(results[0].file,results[0].line||1)
  }catch(e){
    toast(`代码搜索：${e.message||'失败'}`,'warn')
  }finally{
    if(btn){btn.disabled=false;btn.textContent='定位'}
  }
}

// ── DRAG with AERO SNAP ──
function setupDrag(){
  let dragging=null,offX=0,offY=0,snapZone=null,rafId=null,pendingE=null
  let wsRect=null  // cached workspace rect, read once on mousedown
  const EDGE=20,CORNER=40

  function stopDrag(){
    if(!dragging)return
    const w=wins[dragging],did=dragging
    w.el.classList.remove('dragging')
    snapPreviewEl.classList.remove('show')
    document.querySelectorAll('iframe').forEach(f=>f.style.pointerEvents='')
    if(rafId){cancelAnimationFrame(rafId);rafId=null}
    pendingE=null
    if(snapZone&&wsRect){
      const r=getSnapRect(snapZone,wsRect.width,wsRect.height)
      w.x=r.x;w.y=r.y;w.w=r.w;w.h=r.h
      applyWinPos(did)
    } else {
      autoFillGap(did)
    }
    dragging=null;snapZone=null;wsRect=null;saveLayout()
  }

  document.addEventListener('mousedown',e=>{
    const bar=e.target.closest('.fw-bar')
    if(!bar||e.target.closest('.fw-btn'))return
    const id=bar.dataset.wid,w=wins[id];if(!w)return
    dragging=id;offX=e.clientX-w.x;offY=e.clientY-w.y
    wsRect=I('workspace').getBoundingClientRect()  // read once
    w.preSnapState={x:w.x,y:w.y,w:w.w,h:w.h}
    w.el.classList.add('dragging');bringToFront(id);e.preventDefault()
    document.querySelectorAll('iframe').forEach(f=>f.style.pointerEvents='none')
  })

  document.addEventListener('mousemove',e=>{
    if(!dragging)return
    if(!(e.buttons&1)){stopDrag();return}
    pendingE=e
    if(rafId)return
    rafId=requestAnimationFrame(()=>{
      rafId=null
      const ev=pendingE;if(!ev||!dragging||!wsRect)return;pendingE=null
      const w=wins[dragging]
      const mx=ev.clientX-wsRect.left,my=ev.clientY-wsRect.top
      const ww=wsRect.width,wh=wsRect.height

      w.x=ev.clientX-offX;w.y=ev.clientY-offY
      w.x=Math.max(-w.w+60,Math.min(w.x,ww-60))
      w.y=Math.max(0,Math.min(w.y,wh-30))

      let zone=null
      if(my<EDGE) zone='top'
      else if(mx<EDGE&&my<CORNER) zone='tl'
      else if(mx>ww-EDGE&&my<CORNER) zone='tr'
      else if(mx<EDGE&&my>wh-CORNER) zone='bl'
      else if(mx>ww-EDGE&&my>wh-CORNER) zone='br'
      else if(mx<EDGE) zone='left'
      else if(mx>ww-EDGE) zone='right'

      if(!zone){
        const GAP=6
        Object.entries(wins).forEach(([oid,ow])=>{
          if(oid===dragging||!ow.visible)return
          if(Math.abs((w.x+w.w+GAP)-ow.x)<SNAP_DIST) w.x=ow.x-w.w-GAP
          if(Math.abs(w.x-(ow.x+ow.w+GAP))<SNAP_DIST) w.x=ow.x+ow.w+GAP
          if(Math.abs((w.y+w.h+GAP)-ow.y)<SNAP_DIST) w.y=ow.y-w.h-GAP
          if(Math.abs(w.y-(ow.y+ow.h+GAP))<SNAP_DIST) w.y=ow.y+ow.h+GAP
          if(Math.abs(w.y-ow.y)<SNAP_DIST) w.y=ow.y
          if(Math.abs((w.y+w.h)-(ow.y+ow.h))<SNAP_DIST) w.y=ow.y+ow.h-w.h
          if(Math.abs(w.x-ow.x)<SNAP_DIST) w.x=ow.x
          if(Math.abs((w.x+w.w)-(ow.x+ow.w))<SNAP_DIST) w.x=ow.x+ow.w-w.w
        })
      }

      if(zone!==snapZone){
        snapZone=zone
        if(zone){
          const r=getSnapRect(zone,ww,wh)
          snapPreviewEl.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`
          snapPreviewEl.classList.add('show')
        } else {
          snapPreviewEl.classList.remove('show')
        }
      }

      w.el.style.transform=`translate(${Math.round(w.x)}px,${Math.round(w.y)}px)`
    })
  })

  document.addEventListener('mouseup',stopDrag)
  window.addEventListener('blur',stopDrag)

  /* ── AUTO-FILL: when a window is dropped near a workspace edge, expand it
       to fill the empty strip not occupied by other visible windows ── */
  function autoFillGap(id){
    const ws=I('workspace')
    const ww=ws.offsetWidth,wh=ws.offsetHeight,G=6,T=30
    const w=wins[id]
    const others=Object.entries(wins).filter(([oid,ow])=>oid!==id&&ow.visible).map(([,ow])=>ow)

    // detect which edges the window is near
    const nearL=w.x<T, nearR=(w.x+w.w)>ww-T, nearT=w.y<T, nearB=(w.y+w.h)>wh-T
    if(!nearL&&!nearR&&!nearT&&!nearB) return

    // find bounding obstacles for each direction
    let expandL=G, expandR=ww-G, expandT=G, expandB=wh-G

    others.forEach(ow=>{
      const ovY=ow.y<w.y+w.h+G&&ow.y+ow.h>w.y-G
      const ovX=ow.x<w.x+w.w+G&&ow.x+ow.w>w.x-G
      // obstacle to the left
      if(ovY&&ow.x+ow.w<=w.x+G) expandL=Math.max(expandL,ow.x+ow.w+G)
      // obstacle to the right
      if(ovY&&ow.x>=w.x+w.w-G) expandR=Math.min(expandR,ow.x-G)
      // obstacle above
      if(ovX&&ow.y+ow.h<=w.y+G) expandT=Math.max(expandT,ow.y+ow.h+G)
      // obstacle below
      if(ovX&&ow.y>=w.y+w.h-G) expandB=Math.min(expandB,ow.y-G)
    })

    let changed=false
    if(nearL){w.w=w.w+(w.x-expandL);w.x=expandL;changed=true}
    if(nearR){w.w=expandR-w.x;changed=true}
    if(nearT){w.h=w.h+(w.y-expandT);w.y=expandT;changed=true}
    if(nearB){w.h=expandB-w.y;changed=true}

    if(changed) applyWinPos(id)
  }

  function getSnapRect(zone,ww,wh){
    const G=6,h2=wh/2
    switch(zone){
      case'top':return{x:G,y:G,w:ww-G*2,h:wh-G*2}
      case'left':return{x:G,y:G,w:ww/2-G*1.5,h:wh-G*2}
      case'right':return{x:ww/2+G*.5,y:G,w:ww/2-G*1.5,h:wh-G*2}
      case'tl':return{x:G,y:G,w:ww/2-G*1.5,h:h2-G*1.5}
      case'tr':return{x:ww/2+G*.5,y:G,w:ww/2-G*1.5,h:h2-G*1.5}
      case'bl':return{x:G,y:h2+G*.5,w:ww/2-G*1.5,h:h2-G*1.5}
      case'br':return{x:ww/2+G*.5,y:h2+G*.5,w:ww/2-G*1.5,h:h2-G*1.5}
      default:return{x:G,y:G,w:ww-G*2,h:wh-G*2}
    }
  }
}

// ── 8-DIR RESIZE ──
function setupResize(){
  let rid=null,rdir='',sx=0,sy=0,orig=null,colNb=[],rowNb=[]
  const GAP=6,MIN_W=60,MIN_H=36,SNAP=16

  document.addEventListener('mousedown',e=>{
    const rh=e.target.closest('.rh');if(!rh)return
    const fw=rh.closest('.fw');if(!fw)return
    const id=fw.id.replace('fw-','');const w=wins[id];if(!w||!w.visible)return
    rid=id;rdir=rh.dataset.dir;sx=e.clientX;sy=e.clientY
    orig={x:w.x,y:w.y,w:w.w,h:w.h}
    colNb=[];rowNb=[];const T=GAP+6
    Object.entries(wins).forEach(([oid,ow])=>{
      if(oid===rid||!ow.visible)return
      const ovY=ow.y<w.y+w.h&&ow.y+ow.h>w.y, ovX=ow.x<w.x+w.w&&ow.x+ow.w>w.x
      if(rdir.includes('e')&&Math.abs(ow.x-(w.x+w.w+GAP))<T&&ovY) colNb.push({id:oid,s:'left',ox:ow.x,ow:ow.w})
      if(rdir.includes('w')&&Math.abs((ow.x+ow.w+GAP)-w.x)<T&&ovY) colNb.push({id:oid,s:'right',ox:ow.x,ow:ow.w})
      if(rdir.includes('s')&&Math.abs(ow.y-(w.y+w.h+GAP))<T&&ovX) rowNb.push({id:oid,s:'top',oy:ow.y,oh:ow.h})
      if(rdir.includes('n')&&Math.abs((ow.y+ow.h+GAP)-w.y)<T&&ovX) rowNb.push({id:oid,s:'bottom',oy:ow.y,oh:ow.h})
      if(rdir==='e'&&Math.abs((ow.x+ow.w)-(w.x+w.w))<T&&oid!==rid) colNb.push({id:oid,s:'se',ox:ow.x,ow:ow.w})
      if(rdir==='w'&&Math.abs(ow.x-w.x)<T&&oid!==rid) colNb.push({id:oid,s:'sw',ox:ow.x,ow:ow.w})
    })
    e.preventDefault();e.stopPropagation()
  })

  document.addEventListener('mousemove',e=>{
    if(!rid)return
    const w=wins[rid],dx=e.clientX-sx,dy=e.clientY-sy,d=rdir
    if(w.minimized){w.minimized=false;w.el.classList.remove('minimized')}
    let nx=orig.x,ny=orig.y,nw=orig.w,nh=orig.h

    if(d.includes('e')) nw=Math.max(MIN_W,orig.w+dx)
    if(d.includes('w')){const cd=Math.min(dx,orig.w-MIN_W);nx=orig.x+cd;nw=orig.w-cd}
    if(d.includes('s')) nh=Math.max(MIN_H,orig.h+dy)
    if(d.includes('n')){const cd=Math.min(dy,orig.h-MIN_H);ny=orig.y+cd;nh=orig.h-cd}

    const nR=nx+nw,nB=ny+nh
    Object.entries(wins).forEach(([oid,ow])=>{
      if(oid===rid||!ow.visible)return
      if(d.includes('e')){if(Math.abs(nR-ow.x)<SNAP)nw=ow.x-nx;if(Math.abs(nR-(ow.x+ow.w))<SNAP)nw=ow.x+ow.w-nx}
      if(d.includes('s')){if(Math.abs(nB-ow.y)<SNAP)nh=ow.y-ny;if(Math.abs(nB-(ow.y+ow.h))<SNAP)nh=ow.y+ow.h-ny}
      if(d.includes('w')){if(Math.abs(nx-ow.x)<SNAP){const dd=nx-ow.x;nx=ow.x;nw+=dd}if(Math.abs(nx-(ow.x+ow.w))<SNAP){const dd=nx-(ow.x+ow.w);nx=ow.x+ow.w;nw+=dd}}
      if(d.includes('n')){if(Math.abs(ny-ow.y)<SNAP){const dd=ny-ow.y;ny=ow.y;nh+=dd}if(Math.abs(ny-(ow.y+ow.h))<SNAP){const dd=ny-(ow.y+ow.h);ny=ow.y+ow.h;nh+=dd}}
    })

    w.x=nx;w.y=ny;w.w=Math.max(MIN_W,nw);w.h=Math.max(MIN_H,nh)
    applyWinPos(rid)

    colNb.forEach(nb=>{const ow=wins[nb.id];if(!ow)return
      if(nb.s==='left'){const nX=w.x+w.w+GAP;ow.x=nX;ow.w=Math.max(MIN_W,nb.ow-(nX-nb.ox))}
      else if(nb.s==='right'){ow.w=Math.max(MIN_W,w.x-GAP-nb.ox)}
      else if(nb.s==='se'){ow.w=Math.max(MIN_W,nb.ow+dx)}
      else if(nb.s==='sw'){const cd=w.x-orig.x;ow.x=nb.ox+cd;ow.w=Math.max(MIN_W,nb.ow-cd)}
      applyWinPos(nb.id)
    })
    rowNb.forEach(nb=>{const ow=wins[nb.id];if(!ow)return
      if(nb.s==='top'){const nY=w.y+w.h+GAP;ow.y=nY;ow.h=Math.max(MIN_H,nb.oh-(nY-nb.oy))}
      else if(nb.s==='bottom'){ow.h=Math.max(MIN_H,w.y-GAP-nb.oy)}
      applyWinPos(nb.id)
    })
  })

  document.addEventListener('mouseup',()=>{if(!rid)return;rid=null;colNb=[];rowNb=[];saveLayout()})
}

// ── WINDOW PANEL ──
window.toggleWinPanel=()=>{I('win-panel').classList.toggle('open');renderWinPanel();renderRemoteCursors()}
function renderWinPanel(){
  const active=MODE_WINS[currentMode]||[]
  const isPW=currentMode.startsWith('pw-')&&currentMode.slice(3)===myId
  let html=''
  // Section 1: Currently active windows (including instances)
  html+='<div style="padding:4px 8px;font-size:9px;color:var(--textd);letter-spacing:1px;font-family:var(--font-code)">当前窗口</div>'
  const shown=new Set()
  active.forEach(id=>{
    const w=wins[id]
    if(!w)return
    shown.add(id)
    const def=w.def||getWinDef(id)
    if(!def)return
    const on=w.visible
    const{type,owner}=parseWinInstanceId(id)
    const label=owner?`${def.name} (${owner===myId?'我的':owner.slice(0,4)})`:`${def.name}`
    html+=`<div class="wp-item${on?' on':''}" onclick="${on?'hideWin':'showWin'}('${id}')"><div class="wp-dot"></div><span class="ico ico-sm" style="color:${def.color}"><svg><use href="#${def.icon}"/></svg></span><span class="wp-name">${esc(label)}</span></div>`
  })
  // Section 2: Add new window (only in own workspace)
  if(isPW){
    html+='<div style="padding:8px 8px 4px;font-size:9px;color:var(--textd);letter-spacing:1px;font-family:var(--font-code);border-top:1px solid var(--border);margin-top:4px">新建窗口</div>'
    WIN_DEFS.filter(d=>!isSharedType(d.id)).forEach(d=>{
      html+=`<div class="wp-item" onclick="createNewInstance('${d.id}')"><div class="wp-dot" style="background:var(--green)"></div><span class="ico ico-sm" style="color:${d.color}"><svg><use href="#${d.icon}"/></svg></span><span class="wp-name">+ ${d.name}</span></div>`
    })
  }else{
    // Non-personal modes: show all window types
    html+='<div style="padding:8px 8px 4px;font-size:9px;color:var(--textd);letter-spacing:1px;font-family:var(--font-code);border-top:1px solid var(--border);margin-top:4px">所有窗口</div>'
    WIN_DEFS.forEach(d=>{
      if(shown.has(d.id))return
      html+=`<div class="wp-item" onclick="showWin('${d.id}')"><div class="wp-dot"></div><span class="ico ico-sm" style="color:${d.color}"><svg><use href="#${d.icon}"/></svg></span><span class="wp-name">${d.name}</span></div>`
    })
  }
  I('wp-body').innerHTML=html
}

// ── MODES ──
window.switchMode=(mode)=>{
  // Save current layout before switching
  saveLayout()
  currentMode=mode
  // Update active state across both left group (personal tabs) and right group (category tabs)
  document.querySelectorAll('#mode-tabs-left .mode-tab, #mode-tabs .mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode))
  // For personal workspace modes (pw-*), build per-user window lists
  if(mode.startsWith('pw-')){
    const uid=mode.slice(3)
    // Destroy per-user windows from other pw-* modes to avoid duplicate bare IDs in the DOM
    Object.keys(wins).forEach(wid=>{
      const p=parseWinInstanceId(wid)
      if(p.owner&&p.owner!==uid&&!isSharedType(p.type))destroyWinInstance(wid)
    })
    const entry=getPersonalWSEntry(uid)
    // Sub-workspaces owned by me, or my main workspace
    const isMine=uid===myId||uid.startsWith(myId+'-ws')||(entry?.isSubWS&&entry?.ownerId===myId)
    if(isMine){
      // My workspace: show existing window instances, auto-init if empty
      let myInstances=getUserWindowInstances(uid)
      if(myInstances.length===0){
        const catLabel=entry?.catLabel||''
        myInstances=initWindowsForUser(uid,catLabel,entry?.catId)
      }
      myInstances.forEach(inst=>{if(!wins[inst.instanceId])createWinInstance(inst.instanceId)})
      const catLabel=entry?.catLabel||''
      const presetTypes=getCategoryPresetWins(catLabel,entry?.catId)
      const sharedWins=presetTypes.filter(t=>isSharedType(t))
      MODE_WINS[mode]=[...sharedWins,...myInstances.filter(i=>i.visible!==false).map(i=>i.instanceId)]
    }else if(entry){
      // Viewing another user's workspace: lazy-create their instances as read-only
      const theirWindows=getUserWindowInstances(uid)
      if(theirWindows.length>0){
        theirWindows.forEach(inst=>{if(!wins[inst.instanceId])createWinInstance(inst.instanceId)})
        const presetTypes=getCategoryPresetWins(entry.catLabel,entry.catId)
        const sharedWins=presetTypes.filter(t=>isSharedType(t))
        MODE_WINS[mode]=[...sharedWins,...theirWindows.filter(i=>i.visible!==false).map(i=>i.instanceId)]
      }else{
        MODE_WINS[mode]=getCategoryPresetWins(entry.catLabel,entry.catId)
      }
    }
    setTimeout(()=>{renderTaskInfoPanel();renderMyDashboard();renderBrief();syncTaskPromptEditor();mountDesignStudio();renderWisdomTreeWindow()},50)
  }
  layoutMode(mode)
  syncEditorToYjs()
  if(yAware){const st=yAware.getLocalState()?.user;if(st)yAware.setLocalStateField('user',{...st,mode})}
  renderMyDashboard()
  renderRemoteCursors()
  // sync mockup if switching to design/game
  if((mode==='design'||mode==='game')&&gameRunning)setTimeout(syncMockupIframe,200)
}

// ── SAFE STORAGE HELPERS ──
function safeGet(key,fallback=''){try{const v=localStorage.getItem(key);return v==null?fallback:v}catch(e){return fallback}}
function safeSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}
function safeRemove(key){try{localStorage.removeItem(key)}catch(e){}}
function safeParse(key,fallback){
  try{
    const raw=safeGet(key,'')
    if(!raw) return fallback
    const parsed=JSON.parse(raw)
    return parsed==null?fallback:parsed
  }catch(e){
    safeRemove(key)
    return fallback
  }
}

function getWorkspaceFiles(){
  const files=[]
  for(const path of WORKSPACE_ORDER){
    const content=yFiles?.get(path)
    if(typeof content==='string'){
      files.push({
        id:path,
        path,
        name:path.split('/').pop(),
        group:path.includes('/')?path.split('/')[0]:'app',
        language:getLanguageFromPath(path),
        content,
      })
    }
  }
  return files
}

function getFileByPath(path){
  return getWorkspaceFiles().find(file=>file.path===path) || null
}

function getActiveFile(){
  return getFileByPath(activeFilePath) || getWorkspaceFiles()[0] || null
}

function ensureWorkspaceFromHtml(source){
  if(!yFiles)return
  const workspace=createWorkspaceFromHtml(source)
  ydoc.transact(()=>{
    workspace.files.forEach(file=>yFiles.set(file.path,file.content))
  })
}

function rebuildBundleFromWorkspace(){
  const bundled=bundleWorkspaceFiles(getWorkspaceFiles())
  lastCode=bundled
  if(yText){
    ydoc.transact(()=>{
      yText.delete(0,yText.length)
      yText.insert(0,bundled)
    })
  }
  return bundled
}

function setActiveFile(path){
  if(!WORKSPACE_ORDER.includes(path)) return
  activeFilePath=path
  if(!openEditorTabs.includes(path))openEditorTabs=[...openEditorTabs,path]
  syncEditor()
}

window.closeEditorTab=(path)=>{
  const idx=openEditorTabs.indexOf(path)
  if(idx<0)return
  openEditorTabs.splice(idx,1)
  if(openEditorTabs.length===0){openEditorTabs=[WORKSPACE_ORDER[0]]}
  if(activeFilePath===path){activeFilePath=openEditorTabs[Math.min(idx,openEditorTabs.length-1)]}
  syncEditor()
}

function applyBundledHtmlToWorkspace(html){
  if(!yFiles)return
  const workspace=createWorkspaceFromHtml(html)
  ydoc.transact(()=>{
    workspace.files.forEach(file=>yFiles.set(file.path,file.content))
    yText.delete(0,yText.length)
    yText.insert(0,bundleWorkspaceFiles(workspace.files))
  })
  lastCode=yText.toString()
  syncEditor()
}

function renderEditorTree(){
  const tree=I('ed-tree')
  const count=I('ed-file-count')
  if(!tree)return
  const files=getWorkspaceFiles()
  if(count)count.textContent=`${files.length} FILES`
  const groups=new Map()
  files.forEach(file=>{
    if(!groups.has(file.group))groups.set(file.group,[])
    groups.get(file.group).push(file)
  })
  tree.innerHTML=[...groups.entries()].map(([group,groupFiles])=>`<div class="ed-group"><div class="ed-group-title">${esc(group)}</div>${groupFiles.map(file=>`<div class="ed-file${file.path===activeFilePath?' active':''}" data-path="${file.path}"><div class="ed-file-bullet"></div><span>${esc(file.name)}</span></div>`).join('')}</div>`).join('')
  tree.querySelectorAll('.ed-file').forEach(el=>el.onclick=()=>setActiveFile(el.dataset.path))
}

  const files=getWorkspaceFiles()

    return `<button class="ed-tab${path===activeFilePath?' active':''}" data-path="${file.path}">${esc(file.name)}<span class="ed-tab-close" data-close-path="${file.path}" title="关闭">✕</span></button>`
  }).join('')
  tabs.querySelectorAll('.ed-tab').forEach(el=>el.onclick=(e)=>{if(e.target.classList.contains('ed-tab-close'))return;setActiveFile(el.dataset.path)})

async function refreshNetworkInfo(){
  try{
    const res=await fetch('/api/network',{cache:'no-store'})
    if(!res.ok) return null
    const data=await res.json()

// ── Phase B: Selection → Send Collaboration Card ──
let collabCards=[]
let collabSelectionText=''
let collabSelectionWinId=null

// Show floating toolbar when text is selected in workspace windows
document.addEventListener('mouseup',(e)=>{
  const toolbar=I('collab-toolbar')
  if(!toolbar)return
  const sel=window.getSelection()
  if(!sel||sel.isCollapsed||!sel.toString().trim()){toolbar.classList.remove('show');return}
  // Check if selection is within a workspace window
  const fwBody=e.target.closest('.fw-body')
  if(!fwBody){toolbar.classList.remove('show');return}
  const winEl=fwBody.closest('.fw')
  collabSelectionWinId=winEl?winEl.id.replace('fw-',''):null
  collabSelectionText=sel.toString().trim()
  if(!collabSelectionText){toolbar.classList.remove('show');return}
  const rect=sel.getRangeAt(0).getBoundingClientRect()
  toolbar.style.left=Math.max(8,rect.left+rect.width/2-toolbar.offsetWidth/2)+'px'
  toolbar.style.top=Math.max(8,rect.top-36)+'px'
  toolbar.classList.add('show')
})
document.addEventListener('mousedown',(e)=>{
  if(!e.target.closest('.collab-toolbar'))I('collab-toolbar')?.classList.remove('show')
})

// Send selection as collab card to a collaborator
window.collabSendSelection=()=>{
  if(!collabSelectionText){toast('请先选中内容');return}
  I('collab-toolbar').classList.remove('show')
  // Show user picker
  const users=getOnlineUsers().filter(u=>u.id!==myId)
  if(users.length===0){toast('暂无在线协作者');return}
  if(users.length===1){
    sendCollabCard(users[0].id,users[0].name,collabSelectionText,collabSelectionWinId)
    return
  }
  // Multiple users — show quick picker
  const picked=prompt('发送给谁？\n'+users.map((u,i)=>`${i+1}. ${u.name}`).join('\n')+'\n\n输入序号：')
  if(!picked)return
  const idx=parseInt(picked)-1
  if(idx>=0&&idx<users.length){
    sendCollabCard(users[idx].id,users[idx].name,collabSelectionText,collabSelectionWinId)
  }
}

function getOnlineUsers(){
  const users=[]
  if(!yAware)return users
  yAware.getStates().forEach((st,clientId)=>{
    if(st.user)users.push({id:st.user.id,name:st.user.name,color:st.user.color||0,clientId})
  })
  // Add self
  if(!users.find(u=>u.id===myId))users.push({id:myId,name:myName,color:myColor})
  return users
}

function sendCollabCard(targetUserId,targetName,text,fromWinId){
  if(!yChat)return
  // Use yChat to broadcast collab card (all clients see it, but UI filters by targetUserId)
  const cardMsg={
    type:'collab-card',
    id:'cc-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
    from:{id:myId,name:myName,color:myColor},
    to:{id:targetUserId,name:targetName},
    text:text.slice(0,2000),
    fromWin:fromWinId,
    ts:Date.now(),
    msg:''
  }
  // Store in a Yjs map for collab cards
  const yCollabCards=ydoc.getMap('collab_cards')
  yCollabCards.set(cardMsg.id,JSON.stringify(cardMsg))
  toast(`已发送给 ${targetName}`)
}

// Listen for incoming collab cards
function initCollabCardListener(){
  const yCollabCards=ydoc.getMap('collab_cards')
  yCollabCards.observe((ev)=>{
    ev.changes.keys.forEach((change,key)=>{
      if(change.action==='add'){
        try{
          const card=JSON.parse(yCollabCards.get(key))
          if(card.to.id===myId)renderCollabCard(card)
        }catch{}
      }
    })
  })
  // Render any existing cards for me
  yCollabCards.forEach((val,key)=>{
    try{
      const card=JSON.parse(val)
      if(card.to.id===myId&&Date.now()-card.ts<300000)renderCollabCard(card)
    }catch{}
  })
}

function renderCollabCard(card){
  const inbox=I('collab-card-inbox')
  if(!inbox)return
  if(inbox.querySelector(`[data-card-id="${card.id}"]`))return
  const ci=(card.from.color||0)%6
  const color=COLORS[ci],bgColor=COLORBG[ci]
  const el=document.createElement('div')
  el.className='collab-card'
  el.dataset.cardId=card.id
  el.innerHTML=`<div class="collab-card-hdr"><div class="collab-card-av" style="background:${bgColor};color:${color}">${(card.from.name||'?')[0].toUpperCase()}</div><div class="collab-card-from">${esc(card.from.name)} 发来内容</div><span class="collab-card-time">${new Date(card.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span><button class="collab-card-close" onclick="dismissCollabCard('${card.id}')">&#10005;</button></div><div class="collab-card-body">${esc(card.text)}</div>${card.msg?`<div class="collab-card-msg">${esc(card.msg)}</div>`:''}<div class="collab-card-actions"><button class="collab-card-act" onclick="replyCollabCard('${card.id}')">回复</button><button class="collab-card-act primary" onclick="openCollabCardWindow('${card.id}','${card.from.id}')">打开共享窗口</button></div>`
  inbox.appendChild(el)
  // Auto-dismiss after 5 min
  setTimeout(()=>dismissCollabCard(card.id),300000)
}

window.dismissCollabCard=(cardId)=>{
  const el=document.querySelector(`[data-card-id="${cardId}"]`)
  if(el){el.style.opacity='0';setTimeout(()=>el.remove(),200)}
}

window.replyCollabCard=(cardId)=>{
  const yCollabCards=ydoc.getMap('collab_cards')
  const raw=yCollabCards.get(cardId)
  if(!raw)return
  const card=JSON.parse(raw)
  const reply=prompt(`回复给 ${card.from.name}：`)
  if(!reply||!reply.trim())return
  // Send a reply card back
  const replyCard={
    type:'collab-card',
    id:'cc-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
    from:{id:myId,name:myName,color:myColor},
    to:{id:card.from.id,name:card.from.name},
    text:card.text.slice(0,500),
    fromWin:card.fromWin,
    ts:Date.now(),
    msg:reply.trim().slice(0,500)
  }
  yCollabCards.set(replyCard.id,JSON.stringify(replyCard))
  dismissCollabCard(cardId)
  toast('已回复')
}

window.toggleSharedInviteUser=(uid)=>{

window.confirmSharedInvite=()=>{

  const {winId,selectedUsers}=pendingSharedInvite
  const{type}=parseWinInstanceId(winId)

  const session={
    id:sessionId,
    winId,
    winType:type,
    sourceInstanceId:winId,
    owner:{id:myId,name:myName},

function addSharedBadge(instanceId,session){

  const badge=document.createElement('span')
  badge.className='shared-win-badge'
  badge.textContent=`LIVE · ${session.participants.length}人`
  badge.dataset.sessionId=session.id
  badge.onclick=(e)=>{e.stopPropagation();showSharedParticipants(session.id,badge)}
  titleEl.appendChild(badge)

function showSharedParticipants(sessionId,anchorEl){
  // Remove any existing popover
  document.querySelectorAll('.shared-pop.open').forEach(el=>el.remove())
  const ySharedWins=ydoc?.getMap('shared_windows')
  if(!ySharedWins)return
  const raw=ySharedWins.get(sessionId)
  if(!raw)return
  const session=JSON.parse(raw)
  const pop=document.createElement('div')
  pop.className='shared-pop open'
  const onlineIds=new Set([myId])
  if(yAware)yAware.getStates().forEach(st=>{if(st.user)onlineIds.add(st.user.id)})
  pop.innerHTML=session.participants.map(uid=>{
    const entry=getPersonalWSEntry(uid)
    const name=entry?.userName||uid.slice(0,6)
    const online=onlineIds.has(uid)
    return`<div class="shared-pop-item"><div class="shared-pop-dot" style="background:${online?'var(--green)':'var(--textd)'}"></div>${esc(name)}${uid===myId?' (我)':''}</div>`
  }).join('')
  anchorEl.parentElement.style.position='relative'
  anchorEl.parentElement.appendChild(pop)
  // Auto-close on outside click
  setTimeout(()=>{
    const close=()=>{pop.remove();document.removeEventListener('click',close)}
    document.addEventListener('click',close)
  },10)
}

function openSharedSession(sessionId){
  const ySharedWins=ydoc?.getMap?.('shared_windows')
  if(!ySharedWins)return false
  const raw=ySharedWins.get(sessionId)
  if(!raw)return false

  try{
    const session=typeof raw==='string'?JSON.parse(raw):raw
    if(!session)return false
    if(!session.participants?.includes(myId)){
      session.participants=[...(session.participants||[]),myId]
      if(!session.editPermissions)session.editPermissions={}
      session.editPermissions[myId]=session.editPermissions[myId]!==false
      ySharedWins.set(sessionId,JSON.stringify(session))
    }
    const instanceId=session.sourceInstanceId||session.winId
    if(!instanceId)return false
    if(!wins[instanceId])createWinInstance(instanceId)
    if(wins[instanceId]){
      const canEdit=!session.editPermissions||session.editPermissions[myId]!==false
      wins[instanceId].visible=true
      wins[instanceId].el.classList.remove('hidden')
      wins[instanceId].el.classList.toggle('read-only',!canEdit)
      wins[instanceId].readOnly=!canEdit
      if(!canEdit){
        renderWinContentFromYjs(instanceId)
      }
      bringToFront(instanceId)
      addSharedBadge(instanceId,session)
      const def=getWinDef(instanceId)
      toast(`已打开「${def?.name||instanceId}」共享窗口`)
      return true
    }
  }catch{}
  return false
}

window.openTeamDashboardSession=(sessionId)=>{
  if(!sessionId)return
  if(!openSharedSession(sessionId))toast('共享窗口不存在或无法打开','warn')
}

window.openCollabCardWindow=(cardId,fromUserId)=>{
  // Open the source window and add the sender as participant
  const yCollabCards=ydoc.getMap('collab_cards')
  const raw=yCollabCards.get(cardId)
  if(!raw)return
  const card=JSON.parse(raw)
  if(card.sharedSession){
    if(openSharedSession(card.sharedSession)){
      dismissCollabCard(cardId)
      return
    }
  }
  // No shared session — create one on the fly
  const instanceId=card.fromWin
  if(instanceId){
    if(!wins[instanceId])createWinInstance(instanceId)
    if(wins[instanceId]){
      const sessionId='sw-'+Date.now()
      const session={id:sessionId,winId:instanceId,winType:parseWinInstanceId(instanceId).type,sourceInstanceId:instanceId,owner:{id:fromUserId,name:card.from.name},participants:[myId,fromUserId],editPermissions:{[myId]:true},created:Date.now()}
      const ySharedWins=ydoc.getMap('shared_windows')
      ySharedWins.set(sessionId,JSON.stringify(session))
      wins[instanceId].visible=true
      wins[instanceId].el.classList.remove('hidden')
      wins[instanceId].el.classList.remove('read-only')
      wins[instanceId].readOnly=false
      bringToFront(instanceId)
      addSharedBadge(instanceId,session)
      dismissCollabCard(cardId)
      toast(`已打开共享窗口`)
    }
  }
}

// Listen for shared window updates
function initSharedWindowListener(){
  const ySharedWins=ydoc.getMap('shared_windows')
  ySharedWins.observe((ev)=>{
    ev.changes.keys.forEach((change,key)=>{
      if(change.action==='add'||change.action==='update'){
        try{
          const session=JSON.parse(ySharedWins.get(key))
          if(session.participants.includes(myId)){
            const instanceId=session.sourceInstanceId||session.winId
            addSharedBadge(instanceId,session)
            // Update badge count
            const badge=document.querySelector(`[data-session-id="${session.id}"]`)
            if(badge)badge.textContent=`LIVE · ${session.participants.length}人`
          }
        }catch{}
      }
    })
    renderMyDashboard()
  })
}

// Initialize collaboration listeners after Yjs connection
function initCollabSystem(){
  if(!ydoc)return
  initCollabCardListener()
  initSharedWindowListener()
  initWinContentListener()
}

// ── READ-ONLY CONTENT SYNC ──
function initWinContentListener(){
  if(!yWinContent)return
  yWinContent.observe((ev)=>{
    ev.changes.keys.forEach((change,key)=>{
      if(change.action==='add'||change.action==='update'){
        // If we're viewing this instance as read-only, update its content
        if(wins[key]&&wins[key].visible&&wins[key].readOnly){
          renderWinContentFromYjs(key)
        }
      }
    })
  })
}

function loadReadOnlyContent(uid){
  if(!yWinContent)return
  const theirWindows=getUserWindowInstances(uid)
  theirWindows.forEach(inst=>{
    if(wins[inst.instanceId]&&wins[inst.instanceId].visible){
      renderWinContentFromYjs(inst.instanceId)
    }
  })
}

function renderWinContentFromYjs(instanceId){
  if(!yWinContent)return
  const raw=yWinContent.get(instanceId)
  if(!raw)return
  try{
    const data=JSON.parse(raw)
    const{type}=parseWinInstanceId(instanceId)
    if(type==='ai'&&data.messages){
      // Re-render AI messages
      const msgsEl=document.getElementById('ai-msgs-'+instanceId)||I('ai-msgs')
      if(!msgsEl)return
      msgsEl.innerHTML=''
      data.messages.slice(-30).forEach(m=>{
        addMsg(instanceId,m.role==='user'?'me':'ai',m.name||(m.role==='user'?'用户':'AI'),m.content)
      })
    }else if(type==='preview'&&data.previewHtml){
      const frame=document.getElementById('game-frame-'+instanceId)||I('game-frame')
      if(frame){
        const blob=new Blob([data.previewHtml],{type:'text/html'})
        frame.src=URL.createObjectURL(blob)
      }
    }
  }catch{}
}

window.handleAvatarUpload=function(input){
  const file=input.files&&input.files[0]
  if(!file)return
  const reader=new FileReader()
  reader.onload=function(ev){
    const img=new Image()
    img.onload=function(){
      const canvas=document.createElement('canvas')
      canvas.width=80;canvas.height=80
      const ctx=canvas.getContext('2d')
      const size=Math.min(img.width,img.height)
      const sx=(img.width-size)/2,sy=(img.height-size)/2
      ctx.drawImage(img,sx,sy,size,size,0,0,80,80)
      myAvatarUrl=canvas.toDataURL('image/png')
      safeSet('codelab_avatar_url',myAvatarUrl)
      if(yAware)yAware.setLocalStateField('user',{name:myName,color:myColor,id:myId,typing:false,mode:currentMode,emoji:myEmoji,cursorStyle:myCursorStyle,avatarUrl:myAvatarUrl})
      initSettingsPanels()
      renderHdrUsers()
    }
    img.src=ev.target.result
  }
  reader.readAsDataURL(file)
}

function getUsers(){
  const m=new Map()
  const localActivity=yAware?.getLocalState?.()?.activity||null
  m.set(myId,{name:myName,color:myColor,id:myId,mode:currentMode,typing:false,viewing:gameRunning,activity:localActivity,emoji:myEmoji,cursorStyle:myCursorStyle,avatarUrl:myAvatarUrl})
  yAware?.getStates().forEach(st=>{
    if(st.user&&st.user.id!==myId){
      m.set(st.user.id,{...st.user,activity:st.activity||null})
      if(!userJoinTimes.has(st.user.id))userJoinTimes.set(st.user.id,Date.now())
    }
  })
  // Dedup by name: if same name appears multiple times (e.g. same user has both
  // app.html and plan.html tabs open with different random IDs), keep the entry
  // that has a mode set (workbench entry), otherwise keep first seen.
  const byName=new Map()
  for(const u of m.values()){
    const key=(u.name||'').toLowerCase()
    const existing=byName.get(key)
    if(!existing||(u.mode&&!existing.mode)){byName.set(key,u)}
  }
  return[...byName.values()]
}

// Check if current user has edit permission on an instance
function hasEditPermission(instanceId){
  const parsed=parseWinInstanceId(instanceId)
  if(isSharedType(parsed.type))return true
  if(parsed.owner===myId)return true
  // Check shared window sessions
  const ySharedWins=ydoc?.getMap('shared_windows')
  if(!ySharedWins)return false
  let hasPerms=false
  ySharedWins.forEach((val)=>{
    try{
      const session=JSON.parse(val)
      if(session.sourceInstanceId===instanceId&&session.participants?.includes(myId)){
        if(!session.editPermissions||session.editPermissions[myId])hasPerms=true
      }
    }catch{}
  })
  return hasPerms
}

// Create a personal mode tab in hdr2 for a user
function createPersonalModeTab(entry){
  const modeId='pw-'+entry.userId
  if(document.querySelector(`.mode-tab[data-mode="${modeId}"]`))return
  const leftGroup=I('mode-tabs-left')
  if(!leftGroup)return
  const isMe=entry.userId===myId
  const isSubWS=entry.isSubWS&&entry.ownerId===myId
  const catColor=entry.catColor||'var(--accent)'
  const btn=document.createElement('button')
  btn.className='mode-tab'
  btn.dataset.mode=modeId
  btn.onclick=()=>switchMode(modeId)
  const label=isSubWS?esc(entry.wsName||entry.userName):esc(entry.userName)+(isMe?' (我)':'')
  const deleteBtn=isSubWS?`<span class="tab-x" onclick="event.stopPropagation();removeSubWS('${entry.userId}')">&#10005;</span>`:''
  btn.innerHTML=`<span style="background:${catColor};width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0"></span>${label}${deleteBtn}`
  if(isSubWS){
    // Sub-workspace: append after my main tab
    const myTab=leftGroup.querySelector(`[data-mode="pw-${myId}"]`)
    if(myTab&&myTab.nextSibling)leftGroup.insertBefore(btn,myTab.nextSibling)
    else leftGroup.appendChild(btn)
  }else if(isMe){
    leftGroup.prepend(btn)
  }else{
    leftGroup.appendChild(btn)
  }
  if(!MODE_WINS[modeId])MODE_WINS[modeId]=getCategoryPresetWins(entry.catLabel,entry.catId)
}
