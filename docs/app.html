<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODELAB X1 — 多人协作游戏共创平台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ FONT SYSTEM ═══ */
:root{
  --font-head:'Space Grotesk','Noto Sans SC',system-ui,sans-serif;
  --font-ui:'Inter','Noto Sans SC',system-ui,sans-serif;
  --font-code:'JetBrains Mono','SF Mono','Fira Code',monospace;
  --font-size-xs:9px;--font-size-sm:11px;--font-size-base:13px;--font-size-lg:16px;--font-size-xl:22px;
  --hdr1:48px;--hdr2:36px;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(0,0,.2,1);
  --radius-xs:4px;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
  --radius-full:999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.03);
  --shadow-xl:0 16px 48px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
  --tok-tag:#7ce8ff;--tok-attr:#ffd87b;--tok-string:#99f2a6;
  --tok-selector:#8fd6ff;--tok-prop:#ff9fc1;--tok-value:#ffe08a;
  --tok-comment:#60738c;--tok-keyword:#ff8aad;--tok-fn:#81e9ff;
  --tok-number:#c8a6ff;--tok-op:#94a9c0;--tok-bracket:#78899d;
  --tok-doctype:#7ea8c4;--tok-entity:#78e0a8;--tok-text:#c0d4f0;
  --tok-plain:#c0d4f0;
}

/* ═══ DARK THEME (default) ═══ */
[data-theme="dark"]{
  --bg:#0f1117;
  --bg2:#161920;
  --bg3:#1c2029;
  --bg4:#252932;
  --text:#e2e8f0;
  --textd:#64748b;
  --textm:#94a3b8;
  --accent:#60a5fa;
  --accent2:#818cf8;
  --green:#4ade80;
  --pink:#fb7185;
  --gold:#fbbf24;
  --orange:#fb923c;
  --purple:#a78bfa;
  --accent-bg:rgba(96,165,250,.08);
  --green-bg:rgba(74,222,128,.08);
  --pink-bg:rgba(251,113,133,.08);
  --gold-bg:rgba(251,191,36,.08);
  --purple-bg:rgba(167,139,250,.08);
  --border:rgba(255,255,255,.08);
  --border-h:rgba(255,255,255,.14);
  --shadow:0 1px 3px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.15);
  --shadow-lg:0 8px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.15);
  --nav-bg:rgba(15,17,23,.82);
  --scrollbar:rgba(255,255,255,.1);
  --editor-shell:#0a0f18;
  --editor-panel-top:#0c1220;
  --editor-panel-bottom:#0e1626;
  --editor-ln:#0e1626;
  --editor-ln-fade:#0c1220;
  --editor-tab-active:#141e30;
  --editor-tab-hover:#111a28;
  --scanline:transparent;
  --editor-bg:rgba(0,0,0,.15);
  --editor-chrome:rgba(255,255,255,.02);--editor-hover:rgba(255,255,255,.03);
  --editor-active-a:rgba(96,165,250,.12);--editor-active-b:rgba(96,165,250,.04);--editor-active-ring:rgba(96,165,250,.16);
  --editor-line-a:rgba(96,165,250,.09);--editor-line-b:rgba(167,139,250,.06);--editor-line-edge:rgba(255,255,255,.03);
  --editor-ln-glow:rgba(96,165,250,.2);
  --tok-tag:#7ce8ff;--tok-attr:#ffd87b;--tok-string:#99f2a6;--tok-selector:#8fd6ff;--tok-prop:#ff9fc1;--tok-value:#ffe08a;--tok-comment:#60738c;--tok-keyword:#ff8aad;--tok-fn:#81e9ff;--tok-number:#c8a6ff;
  color-scheme:dark;
}

/* ═══ LIGHT THEME (clean, professional) ═══ */
[data-theme="light"]{
  --bg:#f8fafb;
  --bg2:#ffffff;
  --bg3:#f1f3f7;
  --bg4:#e8ebf0;
  --text:#1a1d24;
  --textd:#9ca5b4;
  --textm:#5f6b7a;
  --accent:#2563eb;
  --accent2:#6366f1;
  --green:#16a34a;
  --pink:#e11d48;
  --gold:#d97706;
  --orange:#ea580c;
  --purple:#7c3aed;
  --accent-bg:rgba(37,99,235,.06);
  --green-bg:rgba(22,163,74,.06);
  --pink-bg:rgba(225,29,72,.06);
  --gold-bg:rgba(217,119,6,.06);
  --purple-bg:rgba(124,58,237,.06);
  --border:#e5e8ed;
  --border-h:#d0d5dd;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.03);
  --nav-bg:rgba(255,255,255,.82);
  --scrollbar:#d1d5db;
  --editor-shell:#f1f3f7;
  --editor-panel-top:#edf0f4;
  --editor-panel-bottom:#e8ebf0;
  --editor-ln:#edf0f4;
  --editor-ln-fade:#f1f3f7;
  --editor-tab-active:#ffffff;
  --editor-tab-hover:#f5f7fa;
  --scanline:transparent;
  --editor-bg:#fafbfc;
  --editor-chrome:rgba(15,23,42,.03);--editor-hover:rgba(37,99,235,.06);
  --editor-active-a:rgba(37,99,235,.10);--editor-active-b:rgba(37,99,235,.03);--editor-active-ring:rgba(37,99,235,.18);
  --editor-line-a:rgba(37,99,235,.08);--editor-line-b:rgba(124,58,237,.04);--editor-line-edge:rgba(15,23,42,.04);
  --editor-ln-glow:rgba(37,99,235,.14);
  --tok-tag:#0e7490;--tok-attr:#b45309;--tok-string:#15803d;--tok-selector:#0369a1;--tok-prop:#be185d;--tok-value:#92400e;--tok-comment:#94a3b8;--tok-keyword:#c026d3;--tok-fn:#2563eb;--tok-number:#7c3aed;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scanline) 2px,var(--scanline) 4px);pointer-events:none;z-index:9998}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.ico{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle}.ico svg{width:100%;height:100%}.ico-sm{width:11px;height:11px}.ico-lg{width:18px;height:18px}

/* ═══ HEADER ROW 1 ═══ */
#hdr1{height:var(--hdr1);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:200;flex-shrink:0}
.logo{font-family:var(--font-head);font-size:14px;font-weight:900;letter-spacing:4px;color:var(--accent);white-space:nowrap;flex-shrink:0;cursor:pointer}.logo em{color:var(--green);font-style:normal}
.vsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.room-chip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0}.room-chip:hover{border-color:var(--accent2);background:var(--accent-bg)}
.room-lbl{font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:2px}.room-val{font-family:var(--font-code);font-size:12px;color:var(--accent);font-weight:700;letter-spacing:3px}
.conn-pill{display:flex;align-items:center;gap:5px;font-family:var(--font-code);font-size:10px;color:var(--textd);flex-shrink:0}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--textd);flex-shrink:0}.conn-dot.on{background:var(--green);animation:pulse 2.5s infinite}.conn-dot.wait{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hdr-sp{flex:1}
/* TASK CHIP in hdr1 */
.hdr-task-chip{display:none;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--bg3);font-family:var(--font-code);font-size:10px;color:var(--textm);flex-shrink:0;max-width:220px;transition:all .2s var(--ease)}
.hdr-task-chip.visible{display:flex}
.hdr-task-chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.hdr-task-chip-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-task-chip-status{font-size:8px;padding:1px 5px;border-radius:999px;flex-shrink:0}
.hdr-users-group{display:flex;align-items:center;gap:2px;flex-shrink:0;padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);cursor:default;transition:all .2s var(--ease)}.hdr-users-group:hover{border-color:var(--accent2)}
.hdr-users{display:flex;align-items:center}.hdr-users>div{margin-left:-5px}.hdr-users>div:first-child{margin-left:0}
.hdr-users-count{font-family:var(--font-code);font-size:10px;color:var(--accent);font-weight:700;margin-left:6px}
/* PLAYER BALL */
.hdr-players-ball{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s var(--ease);position:relative;overflow:hidden}
.hdr-players-ball:hover{filter:brightness(1.15);box-shadow:0 0 0 3px var(--accent-bg)}
.hdr-players-ball.has-avatar{background:none;overflow:visible}
.hdr-players-ball.has-avatar svg{width:28px;height:28px;border-radius:50%}
.ball-count{position:absolute;bottom:-3px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px;font-family:var(--font-code)}
/* AVATAR STACK */
.hdr-players-stack{display:flex;align-items:center;cursor:pointer;flex-shrink:0;padding:2px 4px;border-radius:var(--radius-full);transition:all .2s var(--ease)}
.hdr-players-stack:hover{background:var(--accent-bg)}
.av-bubble{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-family:var(--font-code);font-size:10px;font-weight:700}
.av-bubble:not(:first-child){margin-left:-8px}
.av-bubble svg{width:100%;height:100%;display:block;border-radius:50%}
.av-bubble-more{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg2);background:var(--bg4);color:var(--textm);display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-size:9px;font-weight:700;margin-left:-8px;flex-shrink:0}
.av-bubble-letter{background:var(--bg4);color:var(--textm)}
.av-bubble-custom img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-upload-area{display:flex;align-items:center;gap:8px;margin-top:6px}
.avatar-upload-btn{padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;transition:all .15s var(--ease)}
.avatar-upload-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.avatar-preview{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid var(--accent)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
/* PLAYERS POPOVER */
.players-popover{display:none;position:absolute;top:calc(var(--hdr1) - 2px);right:120px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xl);padding:10px;min-width:200px;z-index:300;animation:popIn .15s var(--ease-out)}
.players-popover.open{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.pp-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-sm);transition:background .15s}
.pp-item:hover{background:var(--bg3)}
.pp-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-code);flex-shrink:0;overflow:hidden}
.pp-av svg{width:100%;height:100%;border-radius:50%}
.pp-name{font-family:var(--font-ui);font-size:12px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-mode{font-family:var(--font-code);font-size:9px;padding:1px 6px;border-radius:var(--radius-full);border:1px solid var(--border);color:var(--textd)}
/* NAV PILL */
.nav-pill{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-full);padding:2px;gap:2px;flex-shrink:0}
.nav-pill-item{padding:4px 14px;border-radius:var(--radius-full);font-family:var(--font-code);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--textd);cursor:pointer;transition:all .2s var(--ease);text-decoration:none;white-space:nowrap}
.nav-pill-item:hover{color:var(--textm)}
.nav-pill-item.active{background:var(--accent);color:#fff}
.hdr-btn{height:30px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s var(--ease);flex-shrink:0;font-family:var(--font-code);font-size:10px;letter-spacing:.5px}
.hdr-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.run-btn{height:30px;padding:0 16px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#020a06;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.5px;transition:all .15s var(--ease);flex-shrink:0;white-space:nowrap;position:relative}
.run-btn:hover{filter:brightness(1.08);box-shadow:var(--shadow-md)}
.run-btn.stop{background:var(--pink);color:#fff}
.run-btn.stop:hover{box-shadow:var(--shadow-md)}
.run-btn.running::after{content:'';position:absolute;inset:-3px;border-radius:var(--radius-sm);border:2px solid var(--green);animation:run-pulse 1.5s ease-in-out infinite;pointer-events:none;opacity:.4}
@keyframes run-pulse{0%,100%{opacity:0;transform:scale(1)}50%{opacity:.6;transform:scale(1.04)}}

/* ═══ HEADER ROW 2 ═══ */
#hdr2{height:var(--hdr2);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:6px;z-index:199;flex-shrink:0}
.mode-tabs{display:flex;gap:2px;align-items:center;flex-shrink:0}
.mode-tabs-left{gap:4px}
.mode-tabs-left .mode-tab{font-weight:700;font-size:11.5px}
.mode-tabs-left .mode-tab.active{background:transparent;border:none;border-bottom:2px solid var(--accent);color:var(--accent)}
.hdr2-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 4px}
.mode-tab{display:flex;align-items:center;gap:5px;padding:4px 12px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--textd);font-family:var(--font-ui);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;letter-spacing:.3px}
.mode-tab:hover{color:var(--textm);background:rgba(255,255,255,.03)}
.mode-tab.active{color:#fff;background:var(--bg4);box-shadow:var(--shadow-sm)}
.mode-tab.active[data-mode="dev"]{color:var(--purple);border-bottom:2px solid var(--purple)}
.mode-tab.active[data-mode="design"]{color:var(--pink);border-bottom:2px solid var(--pink)}
.mode-tab.active[data-mode="chat"]{color:var(--gold);border-bottom:2px solid var(--gold)}
.mode-tab.active[data-mode="game"]{color:var(--green);border-bottom:2px solid var(--green)}
.mode-tab.active[data-mode="task"]{color:var(--purple);border-bottom:2px solid var(--purple)}
.mode-tab[data-mode^="pw-"].active{color:var(--accent2);border-bottom:2px solid var(--accent2)}
.mode-tab-add{color:var(--textd);font-size:14px;font-weight:700;padding:4px 8px;font-family:var(--font-code);min-width:0}
.mode-tab-add:hover{color:var(--accent);background:var(--accent-bg)}
.mode-tab .tab-x{display:none;margin-left:3px;font-size:9px;color:var(--textd);cursor:pointer;line-height:1}
.mode-tab:hover .tab-x{display:inline}.mode-tab .tab-x:hover{color:var(--pink)}
.hdr2-sp{flex:1}
.win-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;transition:all .2s var(--ease);letter-spacing:.5px}
.win-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}

/* ═══ WORKSPACE ═══ */
#workspace{position:relative;flex:1;overflow:hidden;background:var(--bg);display:flex}
#presence-layer{position:absolute;inset:0;pointer-events:none;z-index:250;overflow:hidden}
#presence-slash-input{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;resize:none}
body{display:flex;flex-direction:column;height:100vh}

/* ═══ FLOATING WINDOWS ═══ */
.fw{position:absolute;left:0;top:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:visible;min-width:60px;min-height:40px;transition:box-shadow .2s var(--ease);z-index:10}
.fw.dragging{box-shadow:var(--shadow-xl);z-index:100;opacity:.92}
.fw.hidden{display:none}
.fw-bar{height:34px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;cursor:grab;flex-shrink:0;user-select:none;min-height:34px;overflow:hidden;border-radius:var(--radius-md) var(--radius-md) 0 0}
.fw-bar:active{cursor:grabbing}
.fw-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.fw-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw-btns{display:flex;gap:2px}
.fw-btn{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--textd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s var(--ease);font-family:var(--font-code)}
.fw-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.fw-btn.close:hover{background:rgba(225,29,72,.1);color:var(--pink)}
.fw-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fw-body{flex:1;overflow:hidden;position:relative;min-height:0;border-radius:0 0 var(--radius-md) var(--radius-md)}
/* 8-direction resize handles */
.rh{position:absolute;z-index:10}
.rh-n{top:-6px;left:12px;right:12px;height:16px;cursor:ns-resize}
.rh-s{bottom:-6px;left:12px;right:12px;height:16px;cursor:ns-resize}
.rh-w{left:-6px;top:12px;bottom:12px;width:16px;cursor:ew-resize}
.rh-e{right:-6px;top:12px;bottom:12px;width:16px;cursor:ew-resize}
.rh-nw{top:-6px;left:-6px;width:22px;height:22px;cursor:nwse-resize}
.rh-ne{top:-6px;right:-6px;width:22px;height:22px;cursor:nesw-resize}
.rh-sw{bottom:-6px;left:-6px;width:22px;height:22px;cursor:nesw-resize}
.rh-se{bottom:-6px;right:-6px;width:22px;height:22px;cursor:nwse-resize}

/* SNAP PREVIEW */
#snap-preview{position:absolute;background:var(--accent-bg);border:2px solid var(--accent);border-radius:var(--radius-md);z-index:9990;pointer-events:none;display:none;transition:all .15s var(--ease)}
#snap-preview.show{display:block}

/* MINIMIZED */
.fw.minimized{height:34px!important;min-height:34px!important;overflow:hidden;border-radius:8px}
.fw.minimized .fw-body{display:none}

/* WINDOW TRANSITIONS */
.fw{transition:transform .2s var(--ease),width .2s var(--ease),height .2s var(--ease),box-shadow .2s,opacity .15s}
.fw.dragging{transition:box-shadow .2s,opacity .15s;will-change:transform}

/* ═══ PERSONAL WORKSPACE PANEL ═══ */
.pw-panel{display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden}
.pw-header{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.pw-title{font-family:var(--font-code);font-size:10px;letter-spacing:1.5px;color:var(--textm)}
.pw-count{font-family:var(--font-code);font-size:10px;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:var(--radius-full)}
.pw-cat-banner{padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);font-family:var(--font-ui);font-size:11px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-weight:600}
.pw-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pw-user-list{flex:1;overflow-y:auto;padding:6px}
.pw-user{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:default;transition:all .2s var(--ease);border:1px solid transparent;margin-bottom:2px}
.pw-user:hover{background:var(--bg3);border-color:var(--border)}
.pw-user.pw-me{background:var(--accent-bg);border-color:rgba(96,165,250,.15)}
.pw-user.online .pw-user-av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}
.pw-user-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:var(--font-code);transition:all .3s var(--ease)}
.pw-user-info{flex:1;min-width:0}
.pw-user-name{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-user-task{font-family:var(--font-code);font-size:9px;color:var(--textd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pw-user-status{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pw-user.pw-viewing{background:var(--accent-bg);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pw-my-notes{flex-shrink:0;padding:8px;border-top:1px solid var(--border)}
.pw-notes-input{width:100%;height:60px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-ui);font-size:11px;padding:8px;resize:none;outline:none;transition:border-color .2s var(--ease)}
.pw-notes-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-bg)}
.pw-notes-input::placeholder{color:var(--textd)}
.pw-profile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-bottom:1px solid var(--border)}
.pw-avatar-wrap{position:relative}
.pw-avatar-circle{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-size:16px;font-weight:800;border:2px solid var(--accent)}
.pw-profile-name{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text)}
.pw-profile-sub{font-family:var(--font-code);font-size:10px;color:var(--textd)}
.pw-my-section{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.pw-section-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textd);text-transform:uppercase}
.pw-my-tasks{display:flex;flex-direction:column;gap:4px}
.pw-task-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:all .15s var(--ease)}
.pw-task-row:hover{background:var(--bg3);border-color:var(--border-h)}
.pw-task-row.pw-task-current{background:var(--accent-bg);border-left:3px solid var(--accent)}
.pw-task-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pw-task-name{flex:1;font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-task-status{font-family:var(--font-code);font-size:8px;padding:1px 6px;border-radius:999px;letter-spacing:.3px}
.pw-empty-tasks{text-align:center;padding:16px;font-size:11px;color:var(--textd);line-height:1.8}
.pw-contrib{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--border)}
.pw-contrib-item{font-family:var(--font-code);font-size:10px;color:var(--textm)}
.pw-contrib-item strong{color:var(--accent);font-weight:700}
.pw-contrib-dot{color:var(--textd);font-size:8px}

/* ═══ TEAM DASHBOARD WINDOW ═══ */
.team-dashboard{display:flex;flex-direction:column;gap:10px;height:100%;padding:10px 12px;background:var(--bg2);overflow:auto}
.team-dashboard__header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.team-dashboard__eyebrow{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textd);text-transform:uppercase}
.team-dashboard__title{margin-top:4px;font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--text)}
.team-dashboard__summary{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.team-dashboard__summary span{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);font-family:var(--font-code);font-size:8px;font-weight:700;color:var(--textd)}
.team-dashboard__section{display:flex;flex-direction:column;gap:8px}
.team-dashboard__section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.team-dashboard__section-head strong{font-size:11px;font-weight:700;color:var(--text)}
.team-dashboard__section-head span{font-family:var(--font-code);font-size:8px;letter-spacing:.4px;color:var(--textd)}
.team-dashboard__member-grid,.team-dashboard__session-list{display:flex;flex-direction:column;gap:8px}
.team-dashboard__member-card,.team-dashboard__session-card{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--bg3);padding:10px;text-align:left;cursor:pointer;transition:all .15s var(--ease)}
.team-dashboard__member-card:hover,.team-dashboard__session-card:hover{border-color:var(--border-h);transform:translateY(-1px)}
.team-dashboard__member-card.is-active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.team-dashboard__member-head,.team-dashboard__session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.team-dashboard__member-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-bg);color:var(--accent);font-family:var(--font-code);font-size:12px;font-weight:700;background-size:cover;background-position:center}
.team-dashboard__member-copy{flex:1;min-width:0}
.team-dashboard__member-name,.team-dashboard__session-title{font-size:11px;font-weight:700;color:var(--text);line-height:1.3}
.team-dashboard__member-me{font-size:9px;color:var(--accent)}
.team-dashboard__member-meta,.team-dashboard__session-meta,.team-dashboard__session-participants,.team-dashboard__member-focus{margin-top:2px;font-size:9px;line-height:1.5;color:var(--textd)}
.team-dashboard__status-dot{width:8px;height:8px;border-radius:50%;background:var(--textd);flex-shrink:0;margin-top:3px}
.team-dashboard__status-dot.is-online{background:var(--green)}
.team-dashboard__member-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.team-dashboard__member-stats span,.team-dashboard__session-count,.team-dashboard__session-action,.team-dashboard__window-pill{display:inline-flex;align-items:center;min-height:20px;padding:0 7px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);font-family:var(--font-code);font-size:8px;font-weight:700;color:var(--textm)}
.team-dashboard__member-window-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.team-dashboard__session-count{color:var(--green);border-color:rgba(74,222,128,.35)}
.team-dashboard__session-action{margin-top:8px;color:var(--accent);border-color:rgba(96,165,250,.35)}
.team-dashboard__empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:92px;padding:16px;border:1px dashed var(--border);border-radius:12px;background:var(--bg3);text-align:center}
.team-dashboard__empty-title{font-size:10px;font-weight:700;color:var(--textm)}
.team-dashboard__empty-copy{margin-top:4px;font-size:9px;line-height:1.6;color:var(--textd);max-width:200px}

/* ═══ STRUCTURED PROMPT PANEL (replaces personal-ws dashboard) ═══ */
.pw-sp-panel{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg2)}
.pw-sp-shell{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;padding:10px 12px}
.pw-sp-shell--empty{justify-content:center}
.pw-sp-eyebrow{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textd);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pw-sp-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pw-sp-title{font-family:var(--font-ui);font-size:13px;font-weight:700;line-height:1.2;color:var(--text)}
.pw-sp-badge{flex-shrink:0;font-family:var(--font-code);font-size:9px;font-weight:600;letter-spacing:.5px;color:var(--textd)}
.pw-sp-copy{font-size:11px;color:var(--textm);line-height:1.7}
.pw-sp-meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:2px;border-top:1px solid var(--border)}
.pw-sp-meta{font-family:var(--font-code);font-size:9px;letter-spacing:.4px;color:var(--textd)}
.pw-sp-guide{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border)}
.pw-sp-guide-line{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.pw-sp-guide-line:first-child{border-top:none;padding-top:0}
.pw-sp-guide-index{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-code);font-size:10px;font-weight:700;background:transparent;color:var(--textd);border:1px solid var(--border)}
.pw-sp-guide-line.is-active .pw-sp-guide-index{background:transparent;color:var(--accent);border-color:var(--accent)}
.pw-sp-guide-text{font-size:11px;line-height:1.8;color:var(--text)}
.pw-sp-guide-note{display:block;font-size:10px;color:var(--textd)}
.pw-sp-prompt{flex:1;min-height:0;overflow:auto;padding-top:10px;border-top:1px solid var(--border)}
.pw-sp-pre{margin:0;padding:0;white-space:pre-wrap;word-break:break-word;font-family:var(--font-code);font-size:10px;line-height:1.85;color:var(--text);background:none}

/* ═══ NEW WORKSPACE DIALOG ═══ */
.nws-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.nws-overlay.open{opacity:1;pointer-events:auto}
.nws-dialog{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);width:340px;padding:20px;box-shadow:var(--shadow-xl)}
.nws-title{font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px}
.nws-field{margin-bottom:14px}
.nws-label{font-family:var(--font-code);font-size:10px;color:var(--textd);letter-spacing:1px;margin-bottom:5px;display:block}
.nws-input{width:100%;height:32px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-ui);font-size:12px;padding:0 10px;outline:none;box-sizing:border-box}
.nws-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-bg)}
.nws-toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.nws-toggle-track{width:36px;height:20px;border-radius:10px;background:var(--bg4);position:relative;transition:background .2s var(--ease);flex-shrink:0}
.nws-toggle-track.on{background:var(--green)}
.nws-toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s var(--ease);box-shadow:var(--shadow-sm)}
.nws-toggle-track.on .nws-toggle-knob{left:18px}
.nws-toggle-label{font-family:var(--font-ui);font-size:11px;color:var(--textm)}
.nws-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.nws-btn{height:30px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textm);font-family:var(--font-ui);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s var(--ease)}
.nws-btn:hover{border-color:var(--accent2);color:var(--accent)}
.nws-btn-ok{background:var(--accent);color:#020a06;border-color:transparent}
.nws-btn-ok:hover{filter:brightness(1.1);box-shadow:var(--shadow-md)}

/* ═══ COLLABORATION CARD SYSTEM (Phase B) ═══ */
.collab-toolbar{position:fixed;z-index:9998;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xl);padding:4px;display:none;gap:2px}
.collab-toolbar.show{display:flex}
.collab-toolbar-btn{height:26px;padding:0 10px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--textm);font-family:var(--font-ui);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s var(--ease);white-space:nowrap}
.collab-toolbar-btn:hover{background:var(--accent-bg);color:var(--accent)}
.collab-toolbar-btn .ico{width:12px;height:12px}
.collab-card-inbox{position:fixed;bottom:16px;right:16px;z-index:9997;display:flex;flex-direction:column-reverse;gap:8px;max-height:60vh;overflow-y:auto;pointer-events:none}
.collab-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xl);padding:12px;width:320px;pointer-events:auto;animation:collab-card-in .3s var(--ease);transition:opacity .2s var(--ease)}
@keyframes collab-card-in{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.collab-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.collab-card-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;font-family:var(--font-code)}
.collab-card-from{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text);flex:1}
.collab-card-time{font-family:var(--font-code);font-size:9px;color:var(--textd)}
.collab-card-close{width:18px;height:18px;border-radius:4px;border:none;background:transparent;color:var(--textd);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.collab-card-close:hover{background:rgba(225,29,72,.1);color:var(--pink)}
.collab-card-body{font-family:var(--font-code);font-size:10px;color:var(--textm);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.collab-card-msg{font-family:var(--font-ui);font-size:11px;color:var(--text);margin-top:8px;padding:6px 8px;background:var(--accent-bg);border-radius:var(--radius-sm);border-left:3px solid var(--accent)}
.collab-card-actions{display:flex;gap:6px;margin-top:8px}
.collab-card-act{height:24px;padding:0 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textm);font-family:var(--font-ui);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s var(--ease)}
.collab-card-act:hover{border-color:var(--accent2);color:var(--accent)}
.collab-card-act.primary{background:var(--accent);color:#020a06;border-color:transparent}

/* ═══ SHARED WINDOW (Phase C) ═══ */
.shared-win-badge{display:inline-flex;align-items:center;gap:3px;font-size:8px;padding:1px 6px;border-radius:var(--radius-full);background:rgba(16,185,129,.1);color:var(--green);font-family:var(--font-code);letter-spacing:.5px;margin-left:4px;cursor:pointer}
.shared-win-badge:hover{background:rgba(16,185,129,.2)}
.shared-win-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);animation:shared-pulse 2s ease-in-out infinite}
@keyframes shared-pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ═══ READ-ONLY OVERLAY ═══ */
.fw.read-only{position:relative}
.fw.read-only::after{content:'只读';position:absolute;inset:34px 0 0 0;background:rgba(0,0,0,.15);z-index:50;pointer-events:all;display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.3);border-radius:0 0 var(--radius-md) var(--radius-md);cursor:not-allowed}
.ro-badge{font-size:8px;padding:1px 6px;border-radius:var(--radius-full);background:rgba(100,116,139,.12);color:var(--textd);font-family:var(--font-code);letter-spacing:.5px;margin-left:4px}
/* shared participants popover */
.shared-pop{position:absolute;top:36px;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xl);padding:8px;z-index:200;min-width:160px;display:none}
.shared-pop.open{display:block}
.shared-pop-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--radius-sm);font-size:10px;font-family:var(--font-ui);color:var(--textm)}
.shared-pop-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* window instance + button */
.fw-btn-plus{font-size:14px;font-weight:700}
.shared-invite-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.shared-invite-overlay.open{opacity:1;pointer-events:auto}
.shared-invite-dialog{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);width:300px;padding:20px;box-shadow:var(--shadow-xl)}
.shared-invite-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px}
.shared-invite-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s var(--ease);border:1px solid transparent;margin-bottom:4px}
.shared-invite-user:hover{background:var(--bg3);border-color:var(--border)}
.shared-invite-user.selected{background:var(--accent-bg);border-color:var(--accent)}
.shared-invite-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:var(--font-code)}
.shared-invite-name{font-size:11px;font-weight:600;color:var(--text);flex:1}
.ti-panel{display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden}
.ti-header{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.ti-task-label{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--text);display:block;word-break:break-word}
.ti-cat-badge{display:inline-block;margin-top:6px;font-family:var(--font-code);font-size:9px;padding:2px 8px;border-radius:var(--radius-full);background:var(--accent-bg);letter-spacing:.5px}
.ti-body{flex:1;overflow-y:auto;padding:12px}
.ti-section{margin-bottom:16px}
.ti-section-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textd);margin-bottom:6px;text-transform:uppercase}
.ti-desc{font-size:12px;color:var(--textm);line-height:1.6}
.ti-progress{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.ti-progress-bar{height:100%;background:var(--green);border-radius:2px;transition:width .3s var(--ease)}
.ti-nodes-list{display:flex;flex-direction:column;gap:4px}
.ti-node{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid var(--border);font-size:11px;color:var(--text)}
.ti-node-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ti-node-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-node-status{font-family:var(--font-code);font-size:8px;padding:1px 5px;border-radius:var(--radius-full);letter-spacing:.3px}
.ti-steps{display:flex;align-items:flex-start;padding:12px 14px;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.ti-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative}
.ti-step-dot{width:24px;height:24px;border-radius:50%;background:var(--bg3);color:var(--textd);display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-size:10px;font-weight:700;transition:all .3s var(--ease);z-index:1}
.ti-step.active .ti-step-dot{background:var(--gold);color:#020a06}
.ti-step.done .ti-step-dot{background:var(--green);color:#020a06}
.ti-step-line{position:absolute;top:12px;left:calc(50% + 12px);width:calc(100% - 24px);height:2px;background:var(--border)}
.ti-step:last-child .ti-step-line{display:none}
.ti-step.active .ti-step-line,.ti-step.done .ti-step-line{background:var(--gold)}
.ti-step-label{font-family:var(--font-code);font-size:8px;color:var(--textd);letter-spacing:.5px;white-space:nowrap}
.ti-step.active .ti-step-label{color:var(--gold)}
.ti-step.done .ti-step-label{color:var(--green)}
.ti-submit-area{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
.ti-submit-btn{width:100%;height:36px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#020a06;font-family:var(--font-ui);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s var(--ease);white-space:nowrap}
.ti-submit-btn:hover{filter:brightness(1.08);box-shadow:var(--shadow-md)}

/* ═══ AI CHAT ═══ */
.ai-chat{display:flex;flex-direction:column;height:100%;overflow:hidden}
.ai-msgs{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.msg-av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--font-code);border:2px solid;margin-bottom:2px}
.msg-body{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg-name{font-size:9px;color:var(--textd);padding:0 4px;font-family:var(--font-code)}
.msg.me .msg-name{text-align:right}
.msg-bub{padding:10px 14px;font-size:12px;line-height:1.75;word-break:break-word;white-space:pre-wrap;font-family:var(--font-ui)}
.msg.me .msg-bub{background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent);border-radius:12px 12px 4px 12px}
.msg.ai .msg-bub{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:12px 12px 12px 4px}
.msg-think{display:flex;gap:5px;padding:14px 18px}
.msg-think span{width:6px;height:6px;border-radius:50%;background:var(--textd);animation:dotB 1.2s infinite}
.msg-think span:nth-child(2){animation-delay:.2s}
.msg-think span:nth-child(3){animation-delay:.4s}
@keyframes dotB{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}
.msg-apply{margin-top:8px;padding:10px;background:var(--green-bg);border:1px solid var(--green);border-radius:8px;color:var(--green);cursor:pointer;font-size:12px;font-family:var(--font-code);font-weight:600;text-align:center;width:100%;transition:all .15s var(--ease)}
.msg-apply:hover{background:var(--green-bg)}.msg-apply:disabled{opacity:.4;cursor:not-allowed}
.msg-coding{padding:10px 14px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid var(--border);font-family:var(--font-code);font-size:11px;color:var(--textd);display:flex;align-items:center;gap:8px;margin-top:4px}
.msg-coding .cd-spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg-coding .cd-lines{font-family:var(--font-code);font-size:10px;color:var(--textd)}
.ai-bar{padding:6px 10px;border-top:1px solid var(--border);background:var(--bg2);display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
.ai-input{flex:1;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-ui);font-size:12px;outline:none;resize:none;line-height:1.4;max-height:80px;min-height:32px;transition:border-color .2s var(--ease)}.ai-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-bg)}.ai-input::placeholder{color:var(--textd)}
.ai-btn{height:32px;padding:0 14px;background:var(--accent);border:none;border-radius:6px;color:#020a06;cursor:pointer;font-size:11px;font-weight:700;font-family:var(--font-ui);transition:all .15s var(--ease);flex-shrink:0;white-space:nowrap}
.ai-btn:hover{box-shadow:var(--shadow-sm)}.ai-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* PREVIEW */
.fw-preview iframe{width:100%;height:100%;border:none;display:block}
.pv-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg)}.pv-idle-txt{font-size:10px;color:var(--textd);text-align:center;line-height:1.8;font-family:var(--font-code)}

/* EDITOR — Structured Hybrid Pro */
.fw-editor{display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,var(--bg2),var(--editor-shell))}
.ed-top{display:flex;flex-direction:column;gap:0;border-bottom:1px solid var(--border)}
.ed-breadcrumb{height:28px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--editor-chrome);font-family:var(--font-code);font-size:9px;letter-spacing:1px;color:var(--textd);overflow:hidden}
.ed-breadcrumb strong{color:var(--textm);font-weight:700}
.ed-tabs{height:34px;display:flex;align-items:flex-end;gap:6px;padding:0 10px;background:linear-gradient(180deg,var(--bg3),var(--bg2));overflow:auto;border-top:1px solid var(--editor-chrome)}
.ed-tab{height:28px;display:flex;align-items:center;padding:0 12px;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;background:transparent;color:var(--textd);font-family:var(--font-code);font-size:10px;cursor:pointer;white-space:nowrap;transition:all .15s var(--ease)}
.ed-tab:hover{color:var(--text);background:var(--editor-hover)}
.ed-tab.active{background:var(--editor-bg);border-color:var(--border);color:var(--text);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.ed-tab-close{display:none;margin-left:4px;width:14px;height:14px;border-radius:3px;border:none;background:transparent;color:var(--textd);cursor:pointer;font-size:9px;align-items:center;justify-content:center;transition:all .15s var(--ease);padding:0;line-height:1}
.ed-tab:hover .ed-tab-close{display:inline-flex}
.ed-tab-close:hover{background:rgba(251,113,133,.15);color:var(--pink)}
.fw-ed-body{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}
.ed-side{width:170px;flex-shrink:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--editor-panel-top),var(--editor-panel-bottom));border-right:1px solid var(--border)}
.fw-body.hide-ed-side .ed-side{display:none}
.ed-side-head{height:32px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--editor-chrome);font-family:var(--font-code);font-size:9px;letter-spacing:2px;color:var(--textd)}
.ed-tree{padding:8px;overflow:auto}
.ed-group{margin-bottom:10px}
.ed-group-title{padding:4px 8px;font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textd);text-transform:uppercase}
.ed-file{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:var(--textm);font-family:var(--font-code);font-size:10px;cursor:pointer;transition:all .15s var(--ease)}
.ed-file:hover{background:var(--editor-hover);color:var(--text)}
.ed-file.active{background:linear-gradient(90deg,var(--editor-active-a),var(--editor-active-b));color:var(--text);box-shadow:inset 0 0 0 1px var(--editor-active-ring)}
.ed-file-bullet{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--textd)}
.ed-file.active .ed-file-bullet{background:var(--accent)}
.ed-main{flex:1;display:flex;flex-direction:column;min-width:0}
.ed-main-body{flex:1;display:flex;overflow:hidden;min-height:0}
.ed-code-shell{flex:1;display:flex;overflow:hidden;min-width:0;background:var(--editor-bg)}
.ed-ln{width:52px;padding:12px 0;background:linear-gradient(180deg,var(--editor-ln),var(--editor-ln-fade));border-right:1px solid var(--border);overflow:hidden;flex-shrink:0;user-select:none}
.ln-n{height:20px;line-height:20px;text-align:right;padding-right:12px;font-family:var(--font-code);font-size:var(--font-size-xs);color:var(--textd);opacity:.52;transition:all .1s}
.ln-n.active{color:var(--accent);opacity:1}
.ed-code-stack{position:relative;flex:1;min-width:0;overflow:hidden}
.ed-line-highlight{position:absolute;left:0;right:0;height:20px;background:linear-gradient(90deg,var(--editor-line-a),var(--editor-line-b),transparent);pointer-events:none;z-index:1;border-top:1px solid var(--editor-line-edge);border-bottom:1px solid var(--editor-line-edge)}
.ed-hi,.ed-ta{position:absolute;inset:0;margin:0;padding:12px 16px;font-family:var(--font-code);font-size:var(--font-size-sm);line-height:20px;letter-spacing:.25px;tab-size:2;white-space:pre;overflow:auto}
.ed-hi{background:transparent;color:var(--text);pointer-events:none;z-index:2}
.ed-hi span{font-style:normal}
.ed-ta{background:transparent;border:none;outline:none;resize:none;color:transparent;caret-color:var(--accent);z-index:3;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-shadow:0 0 0 transparent}
.ed-ta::selection{background:var(--accent-bg)}
.ed-hi::-webkit-scrollbar,.ed-ta::-webkit-scrollbar,.ed-tree::-webkit-scrollbar,.ed-tabs::-webkit-scrollbar{width:6px;height:6px}
.ed-hi::-webkit-scrollbar-thumb,.ed-ta::-webkit-scrollbar-thumb,.ed-tree::-webkit-scrollbar-thumb,.ed-tabs::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:999px}
.ed-hi::-webkit-scrollbar-track,.ed-ta::-webkit-scrollbar-track,.ed-tree::-webkit-scrollbar-track,.ed-tabs::-webkit-scrollbar-track{background:transparent}
.ed-hi,.ed-ta,.ed-tree,.ed-tabs{scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
.ed-foot{height:26px;background:var(--bg3);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:12px;flex-shrink:0}
.ed-foot span{font-family:var(--font-code);font-size:9px;color:var(--textd)}
.ed-foot .ed-info{color:var(--textm)}
.tok-tag{color:var(--tok-tag)}
.tok-attr{color:var(--tok-attr)}
.tok-string{color:var(--tok-string)}
.tok-selector{color:var(--tok-selector)}
.tok-prop{color:var(--tok-prop)}
.tok-value{color:var(--tok-value)}
.tok-comment{color:var(--tok-comment)}
.tok-keyword{color:var(--tok-keyword)}
.tok-fn{color:var(--tok-fn)}
.tok-number{color:var(--tok-number)}

/* PLAYER STATS (ps- prefix) */
.ps-panel{display:flex;flex-direction:column;gap:12px;padding:10px;height:100%;overflow-y:auto;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
.ps-panel::-webkit-scrollbar{width:8px}
.ps-panel::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:999px}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ps-card{border-radius:14px;background:var(--bg2);border:1px solid var(--border);padding:14px;text-align:center;transition:all .2s var(--ease)}
.ps-card:hover{border-color:var(--border-h);background:var(--bg3)}
.ps-card-num{font-family:var(--font-code);font-size:28px;font-weight:800;line-height:1.2}
.ps-card-num--flash{animation:ps-flash .45s ease}
@keyframes ps-flash{0%{opacity:1;transform:scale(1)}30%{opacity:.7;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.ps-card-label{font-family:var(--font-code);font-size:10px;color:var(--textd);letter-spacing:1px;margin-top:4px}
.ps-section{display:flex;flex-direction:column;gap:8px}
.ps-section-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textd);text-transform:uppercase;padding:0 4px}
.ps-rank-list{display:flex;flex-direction:column;gap:4px}
.ps-rank-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);transition:background .15s var(--ease)}
.ps-rank-row:hover{background:var(--bg3)}
.ps-rank-num{width:20px;font-family:var(--font-code);font-size:12px;font-weight:800;color:var(--gold);text-align:center;flex-shrink:0}
.ps-rank-name{font-family:var(--font-ui);font-size:11px;color:var(--text);flex-shrink:0;width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-rank-bar{flex:1;height:6px;border-radius:999px;background:var(--bg3);overflow:hidden}
.ps-rank-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .5s var(--ease)}
.ps-rank-val{font-family:var(--font-code);font-size:10px;color:var(--textm);width:40px;text-align:right;flex-shrink:0}
.ps-duration{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--border)}
.ps-duration-bar{flex:1;height:6px;border-radius:999px;background:var(--bg3);overflow:hidden}
.ps-duration-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--green))}
.ps-duration-text{font-family:var(--font-code);font-size:11px;color:var(--accent);font-weight:700;flex-shrink:0}
.ps-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--textd);font-size:11px;text-align:center}

/* ACTIVITY LOG */
.act-list{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.activity-log{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
.activity-log__head{flex-shrink:0;padding:8px 10px;display:grid;gap:6px;border-bottom:1px solid var(--border)}
.activity-log__summary{display:flex;flex-wrap:wrap;gap:6px}
.activity-log__summary span{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--textd);font-size:8px;font-family:var(--font-code);font-weight:700}
.activity-log__body{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
.activity-log__body::-webkit-scrollbar{width:6px}
.activity-log__body::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:999px}
.activity-row{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);transition:border-color .15s var(--ease)}
.activity-row:hover{border-color:var(--border-h)}
.activity-row__dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.activity-row__dot--blue{background:var(--accent)}
.activity-row__dot--green{background:var(--green)}
.activity-row__dot--orange{background:var(--orange)}
.activity-row__dot--pink{background:var(--pink)}
.activity-row__main{display:grid;gap:3px;min-width:0}
.activity-row__meta{display:flex;align-items:center;gap:6px;min-width:0}
.activity-row__name{font-size:10px;font-weight:700;color:var(--text);line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-row__time{font-family:var(--font-code);font-size:8px;color:var(--textd);flex-shrink:0;white-space:nowrap}
.activity-row__detail{font-size:9px;line-height:1.45;color:var(--textd);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-pill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;font-size:8px;font-family:var(--font-code);font-weight:700;letter-spacing:.3px;flex-shrink:0;white-space:nowrap}
.activity-pill--blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent)}
.activity-pill--green{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.activity-pill--orange{background:rgba(234,88,12,.08);color:var(--orange);border:1px solid var(--orange)}
.activity-pill--pink{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink)}
.activity-empty{height:100%;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;border:1px dashed var(--border);border-radius:14px;background:var(--bg2)}
.activity-empty__title{font-size:10px;font-weight:700;color:var(--textm);margin-bottom:4px}
.activity-empty__copy{font-size:9px;line-height:1.6;color:var(--textd);max-width:180px}
@keyframes slip{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
[data-theme="light"] .activity-empty{background:var(--bg)}
.rw-diff,.rw-console{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.rw-diff__toolbar,.rw-console__toolbar{height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.rw-diff__view-switch{display:flex;gap:4px}
.rw-diff__view-btn,.rw-console__clear,.rw-console__filter{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--textm);font-family:var(--font-code);font-size:10px}
.rw-diff__view-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.rw-diff__hint,.rw-console__footer,.rw-diff__footer{font-family:var(--font-code);font-size:10px;color:var(--textd)}
.rw-diff__body,.rw-console__body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.rw-diff__empty,.rw-console__empty{margin:auto;color:var(--textd);font-size:11px;text-align:center}
.rw-diff__file{border:1px solid var(--border);border-radius:12px;background:var(--bg2);overflow:hidden}
.rw-diff__file-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg3);font-size:11px;font-weight:600}
.rw-diff__unified,.rw-diff__split{font-family:var(--font-code);font-size:11px;line-height:18px}
.rw-diff__line,.rw-diff__split-row{display:grid;grid-template-columns:36px 36px 12px 1fr auto;gap:0;align-items:start}
.rw-diff__split-row{grid-template-columns:1fr 1fr}
.rw-diff__split-cell{display:grid;grid-template-columns:36px 1fr auto;gap:0;border-right:1px solid var(--border)}
.rw-diff__split-row .rw-diff__split-cell:last-child{border-right:none}
.rw-diff__line-no,.rw-diff__line-mark{color:var(--textd);text-align:right;padding-right:8px}
.rw-diff__line-mark{text-align:center;padding-right:0}
.rw-diff__line-text{white-space:pre-wrap;word-break:break-word;padding-right:8px}
.rw-diff__line--add,.rw-diff__split-cell--add{background:rgba(74,222,128,.08);box-shadow:inset 3px 0 0 var(--green)}
.rw-diff__line--remove,.rw-diff__split-cell--remove{background:rgba(251,113,133,.08);box-shadow:inset 3px 0 0 var(--pink)}
.rw-diff__line-badge{margin:2px 8px 0 0;padding:1px 6px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:9px}
.rw-diff__footer,.rw-console__footer{height:28px;display:flex;align-items:center;padding:0 10px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.rw-console__row{display:grid;grid-template-columns:60px 36px 1fr auto;gap:8px;padding:6px 10px;border-radius:10px;background:var(--bg2);font-family:var(--font-code);font-size:10px;align-items:start}
.rw-console__row--warn{background:var(--gold-bg)}
.rw-console__row--error{background:var(--pink-bg)}
.rw-console__row--ai{display:flex;flex-direction:column;gap:6px;background:var(--purple-bg);border-left:3px solid var(--purple)}
.rw-console__level{font-weight:700}
.rw-console__message{white-space:pre-wrap;word-break:break-word}
.rw-console__jump,.rw-console__fix{height:22px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--accent);font-size:9px}
.rw-console__fix{border-color:var(--purple);background:rgba(167,139,250,.18);color:var(--text)}

/* CHAT */
/* ═══ TEAM CHAT (copied exactly from plan.html) ═══ */
.chat-panel-app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.chat-panel-app .chat-header{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:6px;flex-shrink:0}
.chat-panel-app .chat-header-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.5s infinite}
.chat-panel-app .chat-header-title{font-family:var(--font-code);font-size:10px;letter-spacing:1.5px;color:var(--textm);font-weight:600}
.chat-panel-app .chat-header-count{font-family:var(--font-code);font-size:9px;color:var(--textd)}
.chat-panel-app .chat-header-sync{font-family:var(--font-code);font-size:9px;color:var(--green);margin-left:auto;display:flex;align-items:center;gap:4px}
.chat-panel-app .chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.chat-panel-app .chat-input-area{padding:10px 12px 12px;border-top:1px solid var(--border);background:var(--bg)}
.chat-panel-app .chat-input-row{display:flex;gap:10px;align-items:flex-end}
.chat-panel-app .chat-input{flex:1;min-height:40px;max-height:108px;resize:none;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:11px;font-family:var(--font-ui);line-height:1.6;outline:none;transition:all .2s var(--ease)}
.chat-panel-app .chat-input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.chat-panel-app .chat-input::placeholder{color:var(--textd)}
.chat-panel-app .chat-send{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--green);background:var(--green-bg);color:var(--green);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--font-code);font-weight:700;transition:all .15s var(--ease);flex-shrink:0;white-space:nowrap}
.chat-panel-app .chat-send:hover{background:var(--green);color:#fff}
.chat-panel-app .chat-send:active{transform:scale(.96)}
.chat-panel-app .chat-send:disabled{opacity:.3;cursor:default;transform:none;filter:none}
.chat-panel-app .chat-toolbar{display:flex;align-items:center;gap:6px;margin-top:8px;position:relative;flex-wrap:wrap;flex-shrink:0}
.chat-panel-app .chat-tool{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--textm);font-size:10px;font-family:var(--font-code);cursor:pointer;transition:all .15s var(--ease);white-space:nowrap}
.chat-panel-app .chat-tool:hover{border-color:var(--green);color:var(--green)}
.chat-panel-app .chat-tool.active{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.chat-panel-app .emoji-popup{position:absolute;bottom:100%;left:0;margin-bottom:6px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:8px;z-index:50;width:280px;max-height:260px;overflow-y:auto;animation:popUp .15s var(--ease-out)}
@keyframes popUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chat-panel-app .emoji-popup-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.chat-panel-app .emoji-popup-btn{display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;border:none;background:transparent;cursor:pointer;text-align:center;transition:all .1s var(--ease)}
.chat-panel-app .emoji-popup-btn:hover{background:var(--bg3);transform:scale(1.15)}
.chat-panel-app .emoji-popup-char{font-size:24px;line-height:1;flex-shrink:0}
.chat-panel-app .emoji-popup-char img{width:28px;height:28px;object-fit:contain}
.chat-panel-app .mention-popup{position:absolute;bottom:100%;left:0;margin-bottom:6px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:4px 0;z-index:50;min-width:180px;animation:popUp .15s var(--ease-out)}
.chat-panel-app .mention-popup-title{padding:6px 12px;font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:1px;text-transform:uppercase}
.chat-panel-app .mention-popup-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:11px;color:var(--text);font-family:var(--font-ui);transition:all .15s var(--ease);border-radius:10px;margin:0 4px}
.chat-panel-app .mention-popup-item:hover{border-color:var(--accent2);background:var(--accent-bg)}
.chat-panel-app .mention-popup-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chat-panel-app .mention-popup-name{font-weight:500}
.chat-panel-app .mention-popup-me{font-size:10px;color:var(--textd);margin-left:2px}
.chat-panel-app .mention-popup-item-ai{color:var(--purple);font-weight:600}
/* Messages */
.chat-panel-app .msg{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:flex-start;animation:msgIn .3s var(--ease-out)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chat-panel-app .msg-av{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--font-code);background:var(--bg2);border:1px solid var(--border);flex-shrink:0;margin-top:2px}
.chat-panel-app .msg-av-ai{background:linear-gradient(135deg,#7c3aed,#6366f1);border-color:transparent;color:#fff;font-size:12px}
.chat-panel-app .msg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chat-panel-app .msg-name{font-size:9px;color:var(--textd);padding:0 4px;font-family:var(--font-code);display:flex;align-items:center;gap:6px}
.chat-panel-app .msg-name-ai{color:var(--purple)}
.chat-panel-app .msg-time{font-size:9px;color:var(--textd);font-weight:400}
.chat-panel-app .msg-bub{display:inline-block;max-width:100%;padding:10px 12px;font-size:11px;line-height:1.65;word-break:break-word;white-space:pre-wrap;font-family:var(--font-ui)}
.chat-panel-app .msg-bub-player{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:12px}
.chat-panel-app .msg-bub-ai{background:var(--purple-bg);border:1px solid rgba(167,139,250,.15);color:var(--text);border-radius:12px}
.chat-panel-app .msg-bub strong{font-weight:600;color:var(--accent)}
/* Typing indicator */
.chat-panel-app .typing-indicator{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:flex-start;animation:msgIn .3s var(--ease-out)}
.chat-panel-app .typing-dots{display:flex;gap:5px;padding:14px 18px;border-radius:12px;background:var(--purple-bg);border:1px solid rgba(167,139,250,.15)}
.chat-panel-app .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:dotB 1.2s infinite}
.chat-panel-app .typing-dot:nth-child(2){animation-delay:.2s}
.chat-panel-app .typing-dot:nth-child(3){animation-delay:.4s}
/* Empty state */
.chat-panel-app .team-chat__empty{padding:20px;text-align:center;color:var(--textd);font-size:11px;font-family:var(--font-code);line-height:1.8}
/* Panel heads (emoji / mention popup titles) */
.chat-panel-app .team-chat__panel-head{padding:6px 12px;font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:1px;text-transform:uppercase}
/* AI Organize primary tool button */
.chat-panel-app .chat-tool-primary{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.chat-panel-app .chat-tool-primary:hover{border-color:var(--purple);color:#fff;background:var(--purple)}
/* Per-message hover action buttons */
.chat-panel-app .msg-actions{display:none;gap:4px;margin-top:4px;flex-wrap:wrap}
.chat-panel-app .msg:hover .msg-actions{display:flex}
.chat-panel-app .msg-action-btn{height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--textd);font-size:9px;font-family:var(--font-code);cursor:pointer;transition:all .15s var(--ease);white-space:nowrap}
.chat-panel-app .msg-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.chat-panel-app .msg-action-btn.danger:hover{border-color:var(--pink);color:var(--pink)}
/* Pinned message highlight */
.chat-panel-app .msg.is-pinned .msg-bub{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)30}

/* TASKS_MARKER */
.task-list{padding:8px;flex:1;overflow-y:auto}
.task-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);margin-bottom:4px;font-size:11px;font-family:var(--font-code);cursor:pointer;transition:all .2s var(--ease)}
.task-item:hover{border-color:var(--gold)}
.task-check{width:14px;height:14px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease);font-size:9px}
.task-check.done{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.task-text{flex:1}.task-text.done{text-decoration:line-through;color:var(--textd)}
.task-add{padding:6px 8px;border-top:1px solid var(--border);flex-shrink:0}
.task-inp{width:100%;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--font-code);font-size:10px;outline:none;transition:border-color .2s var(--ease)}.task-inp:focus{border-color:var(--gold)}

/* DESIGN */
.fw-design{height:100%;min-height:0;background:var(--bg);overflow:hidden}
.design-workbench{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px;overflow:auto}
.design-workbench__toolbar{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg2)}
.design-workbench__summary{display:flex;flex-direction:column;gap:2px}
.design-workbench__summary strong{font-size:12px;font-weight:800;color:var(--text)}
.design-workbench__summary span{font-size:10px;color:var(--textd);line-height:1.5}
.design-workbench__eyebrow{display:inline-flex;align-items:center;align-self:flex-start;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--pink);background:var(--pink-bg);color:var(--pink);font-size:9px;font-family:var(--font-code);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.design-workbench__actions{display:flex;flex-wrap:wrap;gap:8px}
.design-workbench__action{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--textm);font-size:10px;font-family:var(--font-code);font-weight:700;cursor:pointer;transition:all .15s var(--ease)}
.design-workbench__action:hover{border-color:var(--pink);color:var(--pink)}
.design-workbench__action.is-primary{border-color:var(--pink);background:var(--pink-bg);color:var(--pink)}
.design-workbench__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;align-items:start}
.design-workbench__panel{display:flex;flex-direction:column;min-height:180px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);overflow:hidden}
.design-workbench__panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text)}
.design-workbench__panel-head small{font-size:9px;font-family:var(--font-code);font-weight:600;color:var(--textd)}
.design-workbench__panel-body{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.design-workbench__panel-body--tree{max-height:260px;overflow:auto}
.design-workbench__tree-node{display:flex;flex-direction:column;gap:6px}
.design-workbench__tree-children{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:1px solid var(--border)}
.design-workbench__tree-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);text-align:left;cursor:pointer;transition:all .15s var(--ease)}
.design-workbench__tree-btn:hover,.design-workbench__tree-btn.is-active{border-color:var(--pink);background:var(--pink-bg)}
.design-workbench__tree-name{font-size:11px;font-weight:700;color:var(--text)}
.design-workbench__tree-note{font-size:9px;color:var(--textd);line-height:1.5}
.design-workbench__graph-root{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);font-size:10px;font-family:var(--font-code);font-weight:700}
.design-workbench__graph{display:grid;gap:10px}
.design-workbench__graph-group{display:grid;gap:8px;padding-left:10px;border-left:2px solid var(--border)}
.design-workbench__graph-parent,.design-workbench__graph-node{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);text-align:left;cursor:pointer;transition:all .15s var(--ease)}
.design-workbench__graph-parent:hover,.design-workbench__graph-parent.is-active,.design-workbench__graph-node:hover,.design-workbench__graph-node.is-active{border-color:var(--pink);background:var(--pink-bg)}
.design-workbench__graph-parent{font-size:11px;font-weight:800;color:var(--text)}
.design-workbench__graph-node span{font-size:10px;font-weight:700;color:var(--text)}
.design-workbench__graph-node small{font-size:9px;color:var(--textd);line-height:1.5}
.design-workbench__graph-children{display:grid;gap:8px}
.design-workbench__inspector-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;font-family:var(--font-code);color:var(--textd)}
.design-workbench__fields{display:grid;gap:10px}
.design-workbench__field{display:grid;gap:6px}
.design-workbench__field-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.design-workbench__field-label{font-size:10px;font-weight:700;color:var(--text)}
.design-workbench__field-value{font-size:9px;font-family:var(--font-code);color:var(--textd)}
.design-workbench__range,.design-workbench__color,.design-workbench__color-text,.design-workbench__text{width:100%}
.design-workbench__range{accent-color:var(--pink)}
.design-workbench__color-row{display:grid;grid-template-columns:48px 1fr;gap:8px}
.design-workbench__color{height:34px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer}
.design-workbench__color-text,.design-workbench__text{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:10px;font-family:var(--font-code);outline:none}
.design-workbench__color-text:focus,.design-workbench__text:focus{border-color:var(--pink)}
.design-workbench__scope-row{display:flex;flex-wrap:wrap;gap:8px}
.design-workbench__scope-btn{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--textm);font-size:9px;font-family:var(--font-code);font-weight:700;cursor:pointer}
.design-workbench__scope-btn.is-active,.design-workbench__scope-btn:hover{border-color:var(--pink);color:var(--pink);background:var(--pink-bg)}
.design-workbench__vibes{display:grid;gap:8px}
.design-workbench__vibe{display:grid;gap:4px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);text-align:left;cursor:pointer;transition:all .15s var(--ease)}
.design-workbench__vibe strong{font-size:11px;color:var(--text)}
.design-workbench__vibe span{font-size:9px;line-height:1.55;color:var(--textd)}
.design-workbench__vibe small{font-size:8px;font-family:var(--font-code);color:var(--textd)}
.design-workbench__vibe.is-active,.design-workbench__vibe:hover{border-color:var(--pink);background:var(--pink-bg)}
.design-workbench__impact{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
.design-workbench__impact-head{font-size:10px;font-weight:800;color:var(--text);margin-bottom:8px}
.design-workbench__impact-list{margin:0;padding-left:16px;display:grid;gap:6px}
.design-workbench__impact-list li{font-size:10px;line-height:1.55;color:var(--textd)}
.design-workbench__impact-list li span{font-family:var(--font-code);color:var(--text)}
.design-workbench__impact-empty{font-size:10px;line-height:1.6;color:var(--textd)}

.studio-window{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden;background:var(--bg)}
.studio-window__schema-switch,.studio-window__scope,.studio-window__actions,.studio-window__tags,.studio-window__schema-list{display:flex;flex-wrap:wrap;gap:8px}
.studio-window__schema-chip,.studio-window__scope button,.studio-window__actions button,.studio-window__tags span,.studio-window__schema-list span,.studio-window__skill-head span{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--textd);font-size:8px;font-family:var(--font-code);font-weight:700}
.studio-window__schema-chip,.studio-window__scope button,.studio-window__actions button,.studio-window__tree-leaf,.studio-window__graph-node,.studio-window__preset{cursor:pointer;transition:all .15s var(--ease)}
.studio-window__schema-chip.is-active,.studio-window__scope button.is-active,.studio-window__actions button.is-primary,.studio-window__preset.is-active{border-color:var(--pink);background:var(--pink-bg);color:var(--pink)}
.studio-window__hero{display:grid;gap:4px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg2)}
.studio-window__hero strong{font-size:12px;color:var(--text);font-weight:800}
.studio-window__hero span,.studio-window__copy,.studio-window__tree-parent span,.studio-window__tree-leaf span,.studio-window__graph-node span,.studio-window__empty span,.studio-window__preset span,.studio-window__skill p{font-size:10px;line-height:1.6;color:var(--textd)}
.studio-window__tree,.studio-window__field-list,.studio-window__skill-list,.studio-window__preset-list,.studio-window__meter-list{display:grid;gap:8px}
.studio-window__tree-group,.studio-window__graph-grid,.studio-window__empty,.studio-window__skill,.studio-window__preset{border:1px solid var(--border);border-radius:12px;background:var(--bg2)}
.studio-window__tree-group{padding:10px}
.studio-window__tree-parent{display:grid;gap:3px;padding-bottom:8px}
.studio-window__tree-parent strong,.studio-window__tree-leaf strong,.studio-window__graph-node strong,.studio-window__empty strong,.studio-window__skill strong,.studio-window__preset strong{font-size:11px;color:var(--text);font-weight:800}
.studio-window__tree-children{display:grid;gap:8px;padding-left:10px;border-left:1px solid var(--border)}
.studio-window__tree-leaf,.studio-window__graph-node{display:grid;gap:3px;width:100%;text-align:left;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
.studio-window__tree-leaf.is-active,.studio-window__graph-node.is-active,.studio-window__schema-chip:hover,.studio-window__scope button:hover,.studio-window__preset:hover{border-color:var(--pink);background:var(--pink-bg);color:var(--pink)}
.wt-ctx{position:fixed;z-index:9999;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-xl);padding:4px 0;min-width:130px}
.wt-ctx-item{padding:6px 12px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);font-family:var(--font-ui);transition:background .1s}
.wt-ctx-item:hover{background:var(--accent-bg)}
.wt-ctx-item--danger{color:var(--pink)}.wt-ctx-item--danger:hover{background:rgba(225,29,72,.08)}
.studio-window__graph-root{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);font-size:10px;font-family:var(--font-code);font-weight:700}
.studio-window__graph-grid{padding:10px;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.studio-window__graph-col{display:grid;gap:10px}
.studio-window__field{display:grid;gap:6px;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--bg2)}
.studio-window__field-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.studio-window__field-head span{font-size:10px;color:var(--text);font-weight:700}
.studio-window__field-head b{font-size:9px;color:var(--textd);font-family:var(--font-code)}
.studio-window__range{width:100%;accent-color:var(--pink)}
.studio-window__color-row{display:grid;grid-template-columns:46px 1fr;gap:8px}
.studio-window__color,.studio-window__text{width:100%}
.studio-window__color{height:34px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer}
.studio-window__text{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:10px;font-family:var(--font-code);outline:none}
.studio-window__text:focus{border-color:var(--pink)}
.studio-window__meter{display:grid;grid-template-columns:92px 1fr 56px;gap:10px;align-items:center}
.studio-window__meter label{font-size:10px;color:var(--textd)}
.studio-window__meter-rail{position:relative;height:8px;border-radius:999px;background:var(--bg3);overflow:hidden}
