function renderPersonalWSPanel(){
  const list=I('pw-user-list'),count=I('pw-count'),banner=I('pw-cat-banner')
  if(!list)return
  const entries=getAllPersonalWSEntries()
  const onlineIds=new Set()
  onlineIds.add(myId)
  if(yAware){yAware.getStates().forEach(st=>{if(st.user)onlineIds.add(st.user.id)})}
  entries.sort((a,b)=>{
    if(a.userId===myId)return -1;if(b.userId===myId)return 1
    const aOn=onlineIds.has(a.userId),bOn=onlineIds.has(b.userId)
    if(aOn!==bOn)return aOn?-1:1
    return(a.joinedAt||0)-(b.joinedAt||0)
  })
  if(count)count.textContent=entries.length
  const viewingUid=currentMode.startsWith('pw-')?currentMode.slice(3):myId
  const viewingEntry=entries.find(e=>e.userId===viewingUid)
  if(banner&&viewingEntry&&viewingEntry.catLabel){
    banner.style.display='flex'
    banner.innerHTML=`<span class="pw-cat-dot" style="background:${viewingEntry.catColor||'var(--accent)'}"></span>${esc(viewingEntry.catLabel)} — ${esc(viewingEntry.userName)}`
    banner.style.color=viewingEntry.catColor||'var(--accent)'
  }else if(banner){banner.style.display='none'}
  if(entries.length===0){
    list.innerHTML=`<div style="padding:16px;text-align:center;color:var(--textd);font-size:11px">从智慧树进入后，这里会显示所有协作者</div>`
    return
  }
  list.innerHTML=entries.map(e=>{
    const isMe=e.userId===myId
    const online=onlineIds.has(e.userId)
    const ci=(e.color||0)%6
    const color=COLORS[ci],bgColor=COLORBG[ci]
    const modeId='pw-'+e.userId
    const isViewing=currentMode===modeId
    const catColor=e.catColor||'var(--accent)'
    return`<div class="pw-user${isMe?' pw-me':''}${online?' online':''}${isViewing?' pw-viewing':''}" data-uid="${e.userId}" onclick="switchMode('${modeId}')"><div class="pw-user-av" style="background:${bgColor};color:${color}">${e.userName?e.userName[0].toUpperCase():'?'}</div><div class="pw-user-info"><div class="pw-user-name">${esc(e.userName||'???')}${isMe?' (我)':''}</div><div class="pw-user-task"><span style="color:${catColor};font-size:8px">${esc(e.catLabel||'')}</span> ${esc(e.taskLabel||'--')}</div></div><div class="pw-user-status" style="background:${online?'var(--green)':'var(--textd)'}"></div></div>`
  }).join('')
}

function getModeLabel(mode){

}

function getVisibleWindowsForUser(uid){
  const entry=getPersonalWSEntry(uid)
  const modeId='pw-'+uid
  const activeWindows=MODE_WINS[modeId]||(
    entry
      ? [
          ...getCategoryPresetWins(entry.catLabel,entry.catId).filter(type=>isSharedType(type)),
          ...getUserWindowInstances(uid).filter(inst=>inst.visible!==false).map(inst=>inst.instanceId),
        ]
      : []
  )

  return activeWindows
    .map(instanceId=>{
      const def=getWinDef(instanceId)
      const parsed=parseWinInstanceId(instanceId)
      if(!def)return null
      return {
        id:parsed.type||def.id,
        name:def.name,
      }
    })
    .filter(Boolean)
}

function getDashboardSharedSessions(){
  const ySharedWins=ydoc?.getMap?.('shared_windows')
  if(!ySharedWins)return []

  const onlineUsers=getUsers()
  const onlineIds=new Set(onlineUsers.map(user=>user.id))

  const sessions=[]
  ySharedWins.forEach((raw,key)=>{
    try{
      const session=typeof raw==='string'?JSON.parse(raw):raw
      if(!session) return
      const instanceId=session.sourceInstanceId||session.winId||''
      const def=getWinDef(instanceId||session.winType||'')
      const participantIds=(session.participants||[]).filter(Boolean)
      if(!participantIds.length) return
      sessions.push({
        ...session,
        id:session.id||key,
        sourceInstanceId:instanceId,
        winName:def?.name||session.winName||session.winType||'共享窗口',
        participants:participantIds.map(uid=>{
          const onlineUser=onlineUsers.find(user=>user.id===uid)
          const entry=getPersonalWSEntry(uid)
          return {
            id:uid,
            name:onlineUser?.name||entry?.userName||uid.slice(0,6),
            online:onlineIds.has(uid),
          }
        }),
      })
    }catch{}
  })
  return sessions
}

function renderBrief(){
  const emptyEl=I('brief-empty')
  const bodyEl=I('brief-body')
  const tsEl=I('brief-ts')
  if(!emptyEl||!bodyEl)return

  const prompt=yAgentState?.get('lastStructuredPrompt')||''
  const ts=yAgentState?.get('structuredPromptAt')

  if(!prompt.trim()){
    emptyEl.style.display='flex'
    bodyEl.style.display='none'
    if(tsEl)tsEl.textContent=''
    return
  }

  emptyEl.style.display='none'
  bodyEl.style.display='block'

  // Parse sections like【游戏概念】content
  const HIDDEN_SECTIONS=['待确认问题','下一步行动','潜在冲突']
  const sectionRe=/【([^】]+)】\n([\s\S]*?)(?=\n【|$)/g
  let m,html=''
  let lastIndex=0
  while((m=sectionRe.exec(prompt))!==null){
    lastIndex=sectionRe.lastIndex
    const title=m[1]
    if(HIDDEN_SECTIONS.includes(title))continue
    const rawContent=m[2].trim()
    // Render bullet lines as <li>, other lines as plain text
    const contentHtml=rawContent.split('\n').map(line=>{
      const l=line.trim()
      if(l.startsWith('- '))return`<li>${escHtml(l.slice(2))}</li>`
      return`<span>${escHtml(l)}</span><br>`
    }).join('')
    html+=`<div class="brief-section"><div class="brief-section-title">${escHtml(title)}</div><div class="brief-section-content">${contentHtml}</div></div>`
  }
  // Fallback: no sections parsed, show raw text
  if(!html)html=`<div class="brief-section"><div class="brief-section-content">${escHtml(prompt)}</div></div>`

  bodyEl.innerHTML=html
  if(tsEl&&ts){
    const d=new Date(ts)
    tsEl.textContent=`整理于 ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`
  }
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

async function chatAskAI(){
  const lk=localStorage.getItem('codelab_api_key')||API_KEY||''
  const lb=localStorage.getItem('codelab_api_base')||API_BASE||DEFAULT_API_BASE
  const lm=localStorage.getItem('codelab_api_model')||API_MODEL||'kimi-k2.5'
  if(!lk||!yChat)return

  const msgs=getChatMessages()
  const recent=msgs.slice(-30).map(m=>`${m.name}: ${m.text}`).join('\n')
  const lastAtAI=[...msgs].reverse().find(m=>
    m.name!=='主持 AI'&&m.name!=='AI'&&m.name!=='大脑 AI'&&m.name!=='系统'&&/@ai/i.test(m.text)
  )
  const directQuestion=lastAtAI?lastAtAI.text.replace(/@ai/gi,'').trim():''

  const sysPrompt=`你是一个游戏共创规划的 AI 主持人。你的职责是：
1. 回答团队成员的问题，分析讨论内容
2. 帮助团队聚焦核心问题，推动讨论前进

6. 用中文回复
7. 如果有人 @AI 并提出了具体问题，请直接回答那个问题`

  let userMsg
  if(msgs.length===0) userMsg='大家好！请作为主持人开场，提出几个引导性问题来启动讨论。'
  else if(directQuestion) userMsg=`以下是团队的讨论记录：\n\n${recent}\n\n团队成员 ${lastAtAI.name} 刚刚 @你 说："${directQuestion}"\n请直接回答这个问题。`

window.addEventListener('message',event=>{
  const data=event.data
  if(!data||data.type!=='codelab-console')return
  runtimeConsoleEntries.push(normalizeConsoleEntry({
    id:`console-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
    level:data.level,
    args:data.args,
    ts:data.ts||Date.now(),
  }))
  runtimeConsoleEntries=runtimeConsoleEntries.slice(-200)
  updateRuntimePanels()
})

setTimeout(()=>{
  document.addEventListener('click',event=>{
    const diffViewBtn=event.target.closest('#diff-root .rw-diff__view-btn')
    if(diffViewBtn){
      runtimeDiffView=diffViewBtn.dataset.view||'unified'
      updateRuntimePanels()
      return
    }
    const clearBtn=event.target.closest('#console-root [data-action="clear-console"]')
    if(clearBtn){clearConsoleWindow();return}
    const jumpBtn=event.target.closest('#console-root [data-action="jump-to-error"]')
    if(jumpBtn){
      focusEditorLocation(jumpBtn.dataset.file,jumpBtn.dataset.line,jumpBtn.dataset.column)
      if(currentMode!=='dev')switchMode('dev')
      return
    }
    const fixBtn=event.target.closest('#console-root [data-action="apply-ai-fix"]')
    if(fixBtn){
      const entry=runtimeConsoleEntries.find(item=>item.id===fixBtn.dataset.entryId)
      const aiInput=document.getElementById('ai-inp-prompt-editor')
      if(entry&&aiInput){
        aiInput.value=`请根据这个报错给出修复方案，并生成可直接应用的代码：\n${entry.text}`
        aiInput.style.height='auto'
        aiInput.style.height=Math.min(aiInput.scrollHeight,60)+'px'
        if(!MODE_WINS[currentMode]?.includes('prompt-editor'))showWin('prompt-editor')
        switchMode(currentTask?'pw-'+myId:'chat')
        toast('错误日志已送到 AI 助手','success')
      }
    }
  })
  document.addEventListener('change',event=>{
    const filterSelect=event.target.closest('#console-root select[name="console-filter"]')
    if(filterSelect)filterConsoleWindow(filterSelect.value)
  })
},500)

window.runAll=()=>{
  let code=bundleWorkspaceFiles(getWorkspaceFiles()).trim()
  // Fallback: if workspace files are empty, try yText (legacy single-file storage)
  if((!code||code==='<!DOCTYPE html>')&&yText&&yText.length>0){
    code=yText.toString().trim()
  }
  if(!code||code==='<!DOCTYPE html>'){toast('代码为空！','warn');return}
  lastRunFilesSnapshot=getWorkspaceFileSnapshot()
  runtimeConsoleEntries=[]
  updateRuntimePanels()
  const idle=I('pv-idle');if(idle)idle.style.display='none'
  const frame=I('game-frame')
  if(frame){
    const blob=new Blob([buildRuntimePreviewCode(code)],{type:'text/html'})
    frame.src=URL.createObjectURL(blob)
  }
  const btn=I('run-btn')
  btn.innerHTML='<span class="ico ico-sm"><svg><use href="#i-stop"/></svg></span> 停止'
  btn.className='run-btn stop running';btn.onclick=stopAll
  gameRunning=true;totalRuns++;updateStats();act(`${myName} 运行了游戏`,myColor,false,{userId:myId,name:myName})

  syncMockupIframe()
  // set viewing state
  if(yAware){const st=yAware.getLocalState()?.user;if(st)yAware.setLocalStateField('user',{...st,viewing:true})}
  // notify others via toast
  broadcastRunNotification()
  if(I('design-tree-root'))renderDesignStudioWindows()
}
window.stopAll=()=>{
  const frame=I('game-frame');if(frame)frame.src='about:blank'
  const mockFrame=I('mockup-iframe');if(mockFrame)mockFrame.src='about:blank'
  const idle=I('pv-idle');if(idle)idle.style.display='flex'
  const btn=I('run-btn')
  btn.innerHTML='<span class="ico ico-sm"><svg><use href="#i-play"/></svg></span> 运行游戏'

function getAgentTasks(){
  if(!yAgentTasks)return[]
  const tasks=[]
  yAgentTasks.forEach((val,key)=>{try{tasks.push(typeof val==='string'?JSON.parse(val):val)}catch{}})
  tasks.sort((a,b)=>(a.order||0)-(b.order||0))
  return tasks
}

function renderAgentTaskList(){
  const list=I('atl-list'),count=I('atl-count')
  if(!list||!yAgentTasks)return
  const tasks=getAgentTasks()
  if(count)count.textContent=tasks.length
  const statusColors={pending:'var(--textd)',claimed:'var(--orange)','in-progress':'var(--accent)',done:'var(--green)'}
  list.innerHTML=tasks.length===0?'<div class="atl-empty">在规划室讨论后，Brain Agent 会自动拆分任务。</div>':tasks.map(t=>{
    const isActive=t.id===currentTaskId
    return `<div class="atl-item${isActive?' active':''}" onclick="selectTask('${esc(t.id)}')"><div class="atl-dot" style="background:${statusColors[t.status]||'var(--textd)'}"></div><div class="atl-info"><div class="atl-item-title">${esc(t.title)}</div><div class="atl-item-assignee">${t.assignee?esc(t.assignee):'待认领'}</div></div>${!t.assignee?`<button class="atl-claim" onclick="event.stopPropagation();claimAgentTask('${esc(t.id)}')">认领</button>`:''}</div>`
  }).join('')
}

window.claimAgentTask=(taskId)=>{
  if(!yAgentTasks)return
  const raw=yAgentTasks.get(taskId)
  const task=raw?(typeof raw==='string'?JSON.parse(raw):raw):null
  if(!task||task.assignee)return
  yAgentTasks.set(taskId,JSON.stringify({...task,status:'claimed',assignee:myName,assigneeColor:myColor,updatedAt:Date.now()}))
  selectTask(taskId)
  act(`${myName} 认领了任务「${task.title}」`,myColor,false,{userId:myId,name:myName})
  toast('已认领任务','success')
  renderMyDashboard()
}

function selectTask(taskId){
  if(!yAgentTasks)return
  const raw=yAgentTasks.get(taskId)
  const task=raw?(typeof raw==='string'?JSON.parse(raw):raw):null
  if(!task)return
  currentTaskId=taskId
  // Update prompt-editor window with task-level prompt
  syncTaskPromptEditor()
  syncFullPromptEditor()
  syncPromptEditorActionState()
  // Switch to task tab if prompt-editor is open
  const win=document.querySelector('.prompt-editor-win')
  if(win){
    win.querySelectorAll('.pe-tab').forEach(t=>t.classList.remove('is-active'))
    win.querySelectorAll('.pe-panel').forEach(p=>p.classList.remove('is-active'))
    const taskTab=win.querySelector('[data-pe-tab="task"]')
    const taskPanel=win.querySelector('[data-pe-panel="task"]')
    if(taskTab)taskTab.classList.add('is-active')
    if(taskPanel)taskPanel.classList.add('is-active')
  }
  // Load task AI chat
  loadTaskAIChat(taskId)
  // Highlight in list
  renderAgentTaskList()
  // Update task chip
  renderTaskChip()
  // Update status
  if(task.assignee===myName&&task.status==='claimed'){
    yAgentTasks.set(taskId,JSON.stringify({...task,status:'in-progress',updatedAt:Date.now()}))
  }
}
window.selectTask=selectTask


function getPlanTreeCategories(){
  try{
    const yTree=ydoc?.getMap?.('plan_tree')
    if(!yTree)return[]
    const raw=yTree.get('categories')
    if(!raw)return[]
    return JSON.parse(raw)||[]
  }catch{return[]}
}

function getTaskCategoryLabel(task={}){
  if(task.categoryLabel)return task.categoryLabel
  if(currentTaskId===task.id&&currentCatId&&task.category===currentCatId&&currentCatLabel)return currentCatLabel
  const cats=getPlanTreeCategories()
  const cat=cats.find(item=>item.id===task.category)
  return cat?.label||''
}

function collectTaskChecklistCandidates(text=''){
  const lines=String(text||'').split(/\n+/).map(line=>line.trim()).filter(Boolean)
  const items=[]
  const push=(value)=>{
    const cleaned=String(value||'').replace(/^[\-•*]+\s*/, '').replace(/^\d+[.)、]\s*/, '').trim()
    if(!cleaned||cleaned.length<2)return
    if(/^【[^】]+】$/.test(cleaned))return
    if(items.includes(cleaned))return
    items.push(cleaned)
  }
  lines.forEach(line=>{
    if(/^【任务清单】/.test(line))return
    if(/^(?:[\-•*]|\d+[.)、])\s*/.test(line))push(line)
  })
  return items
}

function buildTaskChecklist(task={}, taskPrompt=''){
  const checklist=[]
  const push=(value)=>{
    const cleaned=String(value||'').replace(/^[\-•*]+\s*/, '').replace(/^\d+[.)、]\s*/, '').trim()
    if(!cleaned||cleaned.length<2)return
    if(/^【[^】]+】$/.test(cleaned))return
    if(checklist.includes(cleaned))return
    checklist.push(cleaned)
  }

  ;[task.checklist,task.todo,task.todos,task.steps,task.acceptanceCriteria].forEach(source=>{
    if(Array.isArray(source))source.forEach(push)
    else if(typeof source==='string')collectTaskChecklistCandidates(source).forEach(push)
  })

  collectTaskChecklistCandidates(taskPrompt).forEach(push)

  if(!checklist.length&&task.description){
    task.description
      .split(/[\n；;。]/)
      .map(item=>item.trim())
      .filter(Boolean)
      .forEach(push)
  }

  if(!checklist.length&&task.details){
    task.details
      .split(/[\n；;。]/)
      .map(item=>item.trim())
      .filter(Boolean)
      .forEach(push)
  }

  if(!checklist.length&&task.title)push(`完成「${task.title}」对应模块`)
  const categoryLabel=getTaskCategoryLabel(task)
  if(categoryLabel)push(`与「${categoryLabel}」模块对齐`)
  if(task.priority)push(`优先级：${task.priority}`)
  push('与当前代码合并后保持可运行')
  push('完成后自测交互与预览')

  return checklist.slice(0,6)
}

function composeTaskPromptText(task={}, promptText=''){
  const base=String(promptText||'').trim()
  const checklist=buildTaskChecklist(task,base)
  if(!checklist.length)return base
  if(/【任务清单】/.test(base))return base
  const checklistBlock='【任务清单】\n'+checklist.map((item,index)=>`${index+1}. ${item}`).join('\n')
  return [base,checklistBlock].filter(Boolean).join('\n\n').trim()
}

function renderTaskChecklistPanel(task={}, checklist=[]){
  const panel=document.getElementById('pe-task-checklist')||document.getElementById('pe-task-checklist-prompt-editor')
  if(!panel)return
  if(!checklist.length){

    return
  }
  panel.classList.add('is-visible')
  panel.innerHTML=`<div class="pe-task-checklist-title">任务清单</div><ol class="pe-task-checklist-list">${checklist.map(item=>`<li>${esc(item)}</li>`).join('')}</ol>`
}

function findAgentTaskByContext(taskId=currentTaskId||urlTaskId,taskLabel=currentTask,catId=currentCatId){
  if(!yAgentTasks)return null
  const exact=[]
  const fuzzy=[]
  yAgentTasks.forEach((value,key)=>{
    let task
    try{task=typeof value==='string'?JSON.parse(value):value}catch{return}
    if(!task)return
    if(taskId&&((task.id&&task.id===taskId)||key===taskId))exact.push(task)
    else if(taskLabel&&task.title===taskLabel)exact.push(task)
    else if(taskLabel&&(task.title?.includes?.(taskLabel)||taskLabel.includes(task.title||'')))fuzzy.push(task)
  })
  const pick=(items)=>{
    if(!items.length)return null
    const sameCat=catId?items.find(task=>task.category===catId):null
    return sameCat||items[0]||null
  }
  return pick(exact)||pick(fuzzy)
}

function tryRestoreTaskSelectionFromContext(){
  const matched=findAgentTaskByContext()
  if(!matched)return false
  currentTaskId=matched.id||currentTaskId||urlTaskId||null
  if(matched.title)currentTask=matched.title
  if(matched.category){
    currentCatId=matched.category
    const categoryLabel=getTaskCategoryLabel(matched)
    if(categoryLabel)currentCatLabel=categoryLabel
  }
  selectTask(matched.id)
  return true
}

function syncTaskPromptEditor(){
  if(!currentTaskId||!yAgentTasks)return
  const raw=yAgentTasks.get(currentTaskId)
  if(!raw)return
  let task
  try{task=typeof raw==='string'?JSON.parse(raw):raw}catch{return}
  const promptEl=document.getElementById('pe-prompt')||document.getElementById('pe-prompt-prompt-editor')
  if(!promptEl)return

  let displayText=''
  const sp=yAgentState?.get('lastStructuredPrompt')||''

  if(sp&&task.title){
    const titleEscaped=task.title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')
    // 1) Try exact section match【task title】
    const sectionMatch=sp.match(new RegExp('【'+titleEscaped+'】\\n([\\s\\S]*?)(?=\\n【|$)'))
    if(sectionMatch)displayText=sectionMatch[1].trim()
    // 2) Try fuzzy: find any section whose title contains the task title (or vice versa)
    if(!displayText){
      const sectionRe=/【([^】]+)】\n([\s\S]*?)(?=\n【|$)/g
      let best='',bestScore=0,m
      while((m=sectionRe.exec(sp))!==null){
        const secTitle=m[1],secContent=m[2].trim()
        if(secTitle.includes(task.title)||task.title.includes(secTitle)){
          const score=secContent.length
          if(score>bestScore){best=secContent;bestScore=score}
        }
      }
      if(best)displayText=best
    }
    // 3) Try finding a paragraph block that contains the title
    if(!displayText){
      const paraMatch=sp.match(new RegExp('(?:^|\\n)((?:[^\\n]*'+titleEscaped+'[^\\n]*\\n(?:(?!【)[^\\n]*\\n?)*))'))
      if(paraMatch)displayText=paraMatch[1].trim()
    }
    // 4) If structured prompt exists but no section matched, show the entire structured prompt for this task
    if(!displayText&&sp.trim()){
      displayText=sp.trim()
    }
  }

  // Fallback to task.prompt
  if(!displayText&&task.prompt)displayText=task.prompt.trim()
  // Fallback: compose from task fields
  if(!displayText){
    let parts=[]
    if(task.title)parts.push('【任务】'+task.title)
    if(task.description)parts.push(task.description)
    if(task.details)parts.push(task.details)
    if(task.code)parts.push('【现有代码】\n'+task.code.slice(0,2000))
    if(parts.length)displayText=parts.join('\n\n')
  }
  // Final fallback: show the full structured prompt if it exists
  if(!displayText&&sp&&sp.trim()){
    displayText=sp.trim()
  }

  const checklist=buildTaskChecklist(task,displayText)
  const finalText=composeTaskPromptText(task,displayText)

  promptEl.value=finalText||''
  promptEl.placeholder=finalText?'':'该任务暂无提示词内容，请先在规划台生成智慧树'
  renderTaskChecklistPanel(task,checklist)
  // Update task title header
  const titleEl=document.getElementById('pe-task-title')||document.getElementById('pe-task-title-prompt-editor')
  if(titleEl&&task.title){
    titleEl.textContent=task.title
    titleEl.style.display='block'
  }
}

function syncPromptEditorActionState(iid='prompt-editor'){
  const baseId=(!iid||iid==='prompt-editor')?'':`-${iid}`
  const submitBtn=document.getElementById(`pe-submit-btn${baseId}`)||document.getElementById('pe-submit-btn')
  const mergeBtn=document.getElementById(`pe-merge-btn${baseId}`)||document.getElementById('pe-merge-btn')
  const fullRegenBtn=document.getElementById(`pe-full-regen-btn${baseId}`)||document.getElementById('pe-full-regen-btn')
  const hasTask=Boolean(currentTaskId)

  if(submitBtn){
    submitBtn.disabled=!hasTask
    submitBtn.title=hasTask?'根据当前任务提示词重新编译这个任务':'请先在智慧树里选择一个任务'
  }
  if(mergeBtn){
    mergeBtn.disabled=!hasTask
    mergeBtn.title=hasTask?'把当前任务提示词合并写入完整提示词':'请先在智慧树里选择一个任务'
  }
  if(fullRegenBtn){
    const sp=yAgentState?.get('lastStructuredPrompt')||''
    fullRegenBtn.disabled=!sp.trim()
    fullRegenBtn.title=sp.trim()?'使用完整提示词重新生成整局游戏':'完整提示词为空，请先生成'
  }
}

}

window.mergeTaskToFullPrompt=function(iid){
  if(!currentTaskId)return toast('请先在智慧树里选择一个任务','warn')
  const promptEl=document.getElementById('pe-prompt')||document.getElementById('pe-prompt-prompt-editor')
  const taskPrompt=promptEl?.value?.trim()
  if(!taskPrompt)return toast('当前任务提示词为空','warn')
  const raw=yAgentTasks?.get(currentTaskId)
  let task
  try{task=raw?(typeof raw==='string'?JSON.parse(raw):raw):null}catch{task=null}
  const taskTitle=task?.title||currentTaskId
  let sp=yAgentState?.get('lastStructuredPrompt')||''
  const titleEscaped=taskTitle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')
  const sectionRe=new RegExp('【'+titleEscaped+'】\\n[\\s\\S]*?(?=\\n【|$)')
  if(sectionRe.test(sp)){
    sp=sp.replace(sectionRe,'【'+taskTitle+'】\n'+taskPrompt)
  }else{
    sp=(sp?sp.trim()+'\n\n':'')+`【${taskTitle}】\n${taskPrompt}`
  }
  yAgentState.set('lastStructuredPrompt',sp)
  yAgentState.set('structuredPromptAt',Date.now())
  syncFullPromptEditor(iid)
  toast('已合并到完整提示词','success')
  const win=document.querySelector('.prompt-editor-win')
  if(win){
    win.querySelectorAll('.pe-tab').forEach(t=>t.classList.remove('is-active'))
    win.querySelectorAll('.pe-panel').forEach(p=>p.classList.remove('is-active'))
    const fullTab=win.querySelector('[data-pe-tab="full"]')
    const fullPanel=win.querySelector('[data-pe-panel="full"]')
    if(fullTab)fullTab.classList.add('is-active')
    if(fullPanel)fullPanel.classList.add('is-active')
  }
}

window.regenFromFullPromptEditor=async function(iid){
  if(!yAgentState||!yAssembledHtml)return toast('Yjs 未就绪，请稍后重试','warn')
  if(yAgentState.get('brainBusy'))return toast('Brain Agent 正在生成中，请稍候','warn')
  const baseId=(!iid||iid==='prompt-editor')?'pe-full-prompt':`pe-full-prompt-${iid}`
  const fullEl=document.getElementById(baseId)
  const customPrompt=fullEl?.value?.trim()
  if(!customPrompt)return toast('完整提示词为空，请先填写内容','warn')
  yAgentState.set('lastStructuredPrompt',customPrompt)
  yAgentState.set('structuredPromptAt',Date.now())
  ydoc.transact(()=>{
    yAssembledHtml.set('html','')
    yAssembledHtml.set('updatedAt',Date.now())
  })
  yAgentState.set('brainBusy',false)
  yAgentState.set('brainStatus','idle')
  await autoInitBrainAgent(true)
}

function getTaskChatHistory(taskId){
  if(!yTaskChats)return[]
  const raw=yTaskChats.get(taskId)
  if(!raw)return[]
  try{return typeof raw==='string'?JSON.parse(raw):(Array.isArray(raw)?raw:[])}catch{return[]}
}

function appendTaskChatMessage(taskId,role,name,content){
  if(!yTaskChats)return
  const history=getTaskChatHistory(taskId)
  history.push({role,name,content,ts:Date.now()})
  const trimmed=history.slice(-20)
  yTaskChats.set(taskId,JSON.stringify(trimmed))
}

function loadTaskAIChat(taskId){
  const msgs=document.getElementById('ai-msgs-prompt-editor')||I('ai-msgs')
  if(!msgs)return
  msgs.innerHTML=''
  const history=getTaskChatHistory(taskId)
  if(history.length===0){

// ── Auto Brain Agent: triggered when entering workbench from plan page ──
async function autoInitBrainAgent(force=false){
  if(!force&&(!currentTask||!currentCatId))return  // only when coming from plan (unless forced)
  if(!yAgentState||!yAgentTasks||!yAssembledHtml)return
  if(yAgentState.get('brainBusy'))return  // another user is already generating
  if(yAssembledHtml.get('html'))return  // already has generated HTML — skip
  const structuredPrompt=yAgentState.get('lastStructuredPrompt')
  if(!structuredPrompt||!structuredPrompt.trim())return  // no planning context
  const lk=localStorage.getItem('codelab_api_key')||API_KEY||''
  const lb=localStorage.getItem('codelab_api_base')||API_BASE||DEFAULT_API_BASE
  const lm=localStorage.getItem('codelab_api_model')||API_MODEL||'kimi-k2.5'
  if(!lk){toast('请先配置 API 密钥，然后刷新页面自动生成代码','warn');return}

  yAgentState.set('brainBusy',true)
  yAgentState.set('brainStatus','generating')

  // Show a persistent status bar
  const statusBar=document.createElement('div')
  statusBar.id='brain-init-status'
  statusBar.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--accent2);border-radius:var(--radius-sm);padding:8px 16px;font-family:var(--font-code);font-size:11px;color:var(--accent);z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg)'
  statusBar.innerHTML='<div style="width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1s infinite"></div><span id="brain-init-txt">Brain Agent 正在读取规划，生成游戏代码...</span>'
  document.body.appendChild(statusBar)

  const setStatus=(txt)=>{const el=document.getElementById('brain-init-txt');if(el)el.textContent=txt}

  let fullText=''
  try{
    const userMsg=`你是一个资深 HTML5 游戏开发者。请根据以下规划内容，生成一个完整、可直接运行的 HTML5 游戏。

【输出格式】
只输出一个完整的 HTML 文件，放在 \`\`\`html ... \`\`\` 代码块中，不要任何解释文字。

【代码强制要求】
1. 必须包含 <!DOCTYPE html>，所有 CSS 在 <style> 内，所有 JS 在 <script> 内
2. 游戏必须可以直接在浏览器运行，无任何外部依赖
3. 核心玩法循环必须完整：开始界面 → 游戏进行 → 结束/重新开始
4. 键盘或鼠标/触屏交互必须正常响应
5. 有分数显示或游戏进度反馈
6. 有胜负判定或关卡推进逻辑
7. 禁止出现 TODO、占位符、"待实现"等未完成代码
8. 禁止使用 alert()，用游戏内 UI 提示代替

【质量要求】
- 视觉：深色背景，元素有明确轮廓，字体清晰可读，至少有 1 个 CSS 动画
- 音效：用 Web Audio API 生成简单音效（碰撞/得分/失败），不依赖音频文件
- 手感：游戏循环用 requestAnimationFrame，移动流畅，响应延迟低

【以下是团队规划内容，请完整实现所有功能点】

${structuredPrompt}`
    // Show full prompt in prompt-editor window so user can see/edit it
    const tpEl=document.getElementById('pe-prompt')||document.getElementById('pe-prompt-prompt-editor');if(tpEl)tpEl.value=userMsg
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      apiBase:lb,model:lm,apiKey:lk,temperature:0.7,max_tokens:12000,stream:true,timeout_hint:180000,
      messages:[
        {role:'user',content:userMsg}
      ]
    })})

    if(!res.ok){
      const err=await res.text();let m;try{m=JSON.parse(err)?.error?.message||err}catch{m=err}
      throw new Error(m)
    }

    const reader=res.body?.getReader()
    if(!reader)throw new Error('No stream reader')
    const dec=new TextDecoder();let buf=''
    let titleMatches=0
    while(true){
      const{done,value}=await reader.read();if(done)break
      buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||''
      for(const line of lines){
        if(!line.startsWith('data: '))continue
        const d=line.slice(6).trim();if(d==='[DONE]')continue
        try{
          const j=JSON.parse(d);const delta=j.choices?.[0]?.delta?.content
          if(delta){
            fullText+=delta
            // Show progress hints
            const linesCount=(fullText.match(/\n/g)||[]).length
            if(linesCount>titleMatches*50){
              titleMatches++
              setStatus(`Brain Agent 生成中... ${linesCount} 行`)
            }
          }
        }catch{}
      }
    }

    // Extract HTML from code block
    let html=''
    const htmlMatch=fullText.match(/```html\n?([\s\S]*?)```/)
    if(htmlMatch){html=htmlMatch[1].trim()}
    else if(fullText.includes('<!DOCTYPE')||fullText.includes('<html')){
      // Raw HTML without code fence
      const start=fullText.indexOf('<!DOCTYPE')>=0?fullText.indexOf('<!DOCTYPE'):fullText.indexOf('<html')
      html=fullText.slice(start).trim()
      // Remove trailing ``` if any
      html=html.replace(/```\s*$/,'').trim()
    }
    if(!html||html.length<100)throw new Error('未能提取有效 HTML（返回内容过短）')

    setStatus('写入代码编辑器...')

    // Write to workspace files (splits into index.html / game.css / game.js)
    applyBundledHtmlToWorkspace(html)

    // Also persist as assembled HTML for preview + other users
    ydoc.transact(()=>{
      yAssembledHtml.set('html',html)
      yAssembledHtml.set('updatedAt',Date.now())
      yAssembledHtml.set('version',(yAssembledHtml.get('version')||0)+1)
    })

    // Update preview iframe
    onAssembledHtmlUpdate()

    yAgentState.set('brainBusy',false)
    yAgentState.set('brainStatus','idle')

    statusBar.remove()
    toast('Brain Agent 已生成游戏代码并写入编辑器！点击「运行游戏」体验','success')
    renderMyDashboard()
  }catch(e){
    yAgentState.set('brainBusy',false)
    yAgentState.set('brainStatus','idle')
    statusBar.remove()
    toast('Brain Agent 生成失败：'+e.message,'warn')
    console.error('[Brain autoInit]',e)
  }
}

    const reader=res.body?.getReader()
    if(reader){
      const dec=new TextDecoder();let buf=''
      while(true){
        const{done,value}=await reader.read();if(done)break
        buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||''
        for(const line of lines){
          if(!line.startsWith('data: '))continue;const d=line.slice(6).trim();if(d==='[DONE]')continue
          try{
            const j=JSON.parse(d);const delta=j.choices?.[0]?.delta?.content
            if(!delta)continue
            fullText+=delta
            if(!bubble){
              removeThinking(instanceId)
              bubble=addMsg(instanceId,'ai','AI','')
              if(!bubble)continue
            }
            if(!inCode&&fullText.includes('```')){inCode=true}
            if(inCode)codeLines=(fullText.match(/\n/g)||[]).length+1
            if(inCode){
              if(!codingEl){
                const before=fullText.split('```')[0].trim()
                bubble.innerHTML=before?esc(before).replace(/\n/g,'<br>'):''
                codingEl=document.createElement('div');codingEl.className='msg-coding'
                codingEl.innerHTML='<div class="cd-spinner"></div><span>正在生成代码...</span><span class="cd-lines"></span>'
                bubble.parentElement.appendChild(codingEl)
              }
              const lnEl=codingEl.querySelector('.cd-lines');if(lnEl)lnEl.textContent=codeLines+' 行'
            }else{
              bubble.textContent=fullText
            }
            if(msgsEl)msgsEl.scrollTop=msgsEl.scrollHeight
          }catch{}
        }
      }
      if(codingEl)codingEl.remove()
      if(bubble)bubble.innerHTML=fmtAI(fullText)
    }else{
      removeThinking(instanceId)
      const data=await res.json();fullText=extractAIText(data)
      bubble=addMsg(instanceId,'ai','AI','');if(bubble)bubble.innerHTML=fmtAI(fullText)
    }
    totalRequests++;updateStats()
    // Persist AI content for read-only viewers
    if(yWinContent&&instanceId.includes('@')){
      const store=getAIStore(instanceId)
      store.messages.push({role:'user',name:myName,content:q},{role:'assistant',name:'AI',content:fullText})
      if(store.messages.length>100)store.messages=store.messages.slice(-50)
      yWinContent.set(instanceId,JSON.stringify({type:'ai',messages:store.messages,lastUpdated:Date.now()}))
    }
    // Save AI response to task chat if in task mode
    if(currentTaskId){
      appendTaskChatMessage(currentTaskId,'assistant','AI',fullText)
      // Check for ```prompt blocks — auto-fill task prompt editor
      const promptMatch=fullText.match(/```prompt\n([\s\S]*?)```/)
      if(promptMatch){
        const newPrompt=promptMatch[1].trim()
        const promptEl=document.getElementById('pe-prompt')||document.getElementById('pe-prompt-prompt-editor')
        if(promptEl){promptEl.value=newPrompt;promptEl.readOnly=false}
        if(bubble){
          const applyBtn=document.createElement('button');applyBtn.className='msg-apply'
          applyBtn.textContent='&#10004; 应用修改后的提示词'
          applyBtn.onclick=()=>{
            const pe=document.getElementById('pe-prompt')||document.getElementById('pe-prompt-prompt-editor');if(pe)pe.value=newPrompt
            toast('提示词已更新到编辑框，点「提交给 Brain」生效','success')
            applyBtn.textContent='&#10004; 已应用';applyBtn.disabled=true
          }
          bubble.parentElement.appendChild(applyBtn)
        }
      }
    }else{
      // Original mode: check for html code blocks
      const mc=fullText.match(/```(?:html|HTML)\n([\s\S]*?)```/)
      if(mc&&bubble){
        const nc=mc[1].trim();const btn=document.createElement('button');btn.className='msg-apply'
        btn.textContent='&#10004; 应用到游戏（同步给所有人）'
        btn.onclick=()=>{applyBundledHtmlToWorkspace(nc);act(`${myName} 应用了 AI 代码`,myColor,false,{userId:myId,name:myName});toast('代码已应用！','success');btn.textContent='&#10004; 已应用';btn.disabled=true;updateCodemap()}
        bubble.parentElement.appendChild(btn)
      }
    }
  }catch(e){removeThinking(instanceId);addMsg(instanceId,'ai','AI','&#10060; '+e.message)}
  send.disabled=false;if(msgsEl)msgsEl.scrollTop=msgsEl.scrollHeight
}
function extractAIText(d){if(typeof d?.output_text==='string'&&d.output_text.trim())return d.output_text;if(Array.isArray(d?.choices)&&d.choices[0]?.message){const c=d.choices[0].message.content;if(typeof c==='string')return c;if(Array.isArray(c))return c.map(p=>typeof p==='string'?p:(p?.text||'')).join('\n').trim()}if(Array.isArray(d?.content))return d.content.map(p=>p?.text||'').join('\n').trim();return d?.message||d?.raw||'无法获取回答'}
function fmtAI(text){const parts=[];let last=0;const re=/```(?:\w*)\n([\s\S]*?)```/g;let m;while((m=re.exec(text))!==null){if(m.index>last)parts.push(`<span>${esc(text.slice(last,m.index))}</span>`);parts.push(`<pre style="background:rgba(0,0,0,.4);padding:8px 10px;border-radius:6px;border-left:2px solid var(--accent);margin:5px 0;overflow-x:auto;font-size:10px;line-height:1.6">${esc(m[1])}</pre>`);last=m.index+m[0].length}if(last<text.length)parts.push(`<span>${esc(text.slice(last))}</span>`);return parts.join('').replace(/\n/g,'<br>')}

// ── REMOTE CURSORS + LIVE SPEECH BUBBLES ──
const cursorEls=new Map();let _lcx=0,_lcy=0
const LOCAL_SPEECH_CURSOR_ID='__local_speech__'
function ensurePresenceLayer(){
  if(presenceLayerEl?.isConnected)return presenceLayerEl
  const ws=I('workspace')
  if(!ws)return null
  presenceLayerEl=document.createElement('div')
  presenceLayerEl.id='presence-layer'
  ws.appendChild(presenceLayerEl)
  return presenceLayerEl
}
function ensureSlashComposerInput(){
  if(slashInputEl?.isConnected)return slashInputEl
  slashInputEl=document.createElement('textarea')
  slashInputEl.id='presence-slash-input'
  slashInputEl.rows=1
  slashInputEl.tabIndex=-1
  slashInputEl.setAttribute('aria-hidden','true')
  const syncSlashDraft=()=>{
    if(!slashComposerActive)return
    const nextText=(slashInputEl.value||'').replace(/\s*\n+\s*/g,' ').slice(0,120)
    if(slashInputEl.value!==nextText)slashInputEl.value=nextText
    updateLocalSpeechState(nextText)
  }
  slashInputEl.addEventListener('input',syncSlashDraft)
  slashInputEl.addEventListener('compositionupdate',syncSlashDraft)
  slashInputEl.addEventListener('compositionend',syncSlashDraft)
  slashInputEl.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault()
      return
    }
  })
  slashInputEl.addEventListener('blur',()=>{if(slashComposerActive)scheduleSlashComposerClear()})
  document.body.appendChild(slashInputEl)
  return slashInputEl
}
function isEditableTarget(target){
  if(!(target instanceof Element))return false
  return !!target.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]')
}
function isPresenceLayerMuted(){
  return shouldMutePresenceLayer({
    settingsOpen:I('settings-overlay')?.classList.contains('open'),
    winPanelOpen:I('win-panel')?.classList.contains('open'),
    sharedInviteOpen:I('shared-invite-overlay')?.classList.contains('open'),
    newWorkspaceOpen:I('nws-overlay')?.classList.contains('open'),
  })
}
function getWorkspaceRect(){
  const ws=I('workspace')
  if(!ws)return null
  return ws.getBoundingClientRect()
}
function projectCursorToWorkspace(cursor,rect){
  if(!cursor||!rect||!Number.isFinite(cursor.x)||!Number.isFinite(cursor.y))return null
  const x=cursor.x*window.innerWidth-rect.left
  const y=cursor.y*window.innerHeight-rect.top
  if(x<0||y<0||x>rect.width||y>rect.height)return null
  return{x,y}
}
function getFallbackLocalCursor(){
  const rect=getWorkspaceRect()
  if(!rect||!rect.width||!rect.height)return null
  const vx=_lcx||rect.left+rect.width/2
  const vy=_lcy||rect.top+rect.height/2
  return{x:vx/window.innerWidth,y:vy/window.innerHeight}
}
function scheduleSlashComposerClear(){
  clearTimeout(slashComposerClearTimer)
  slashComposerClearTimer=setTimeout(()=>closeSlashComposer(),SLASH_CLEAR_MS+60)
}
function updateLocalSpeechState(text=''){
  localSpeechState={active:true,text,updatedAt:Date.now()}
  if(yAware)yAware.setLocalStateField('speech',localSpeechState)
  scheduleSlashComposerClear()
  renderRemoteCursors()
}
function openSlashComposer(){
  ensureSlashComposerInput()
  slashComposerActive=true
  clearTimeout(slashComposerClearTimer)
  if(slashInputEl){
    slashInputEl.value=''
    slashInputEl.focus({preventScroll:true})
    slashInputEl.setSelectionRange(0,0)
  }
  updateLocalSpeechState('')
}
function closeSlashComposer(){
  clearTimeout(slashComposerClearTimer)
  slashComposerActive=false
  localSpeechState=null
  if(slashInputEl){
    slashInputEl.value=''
    slashInputEl.blur()
  }
  if(yAware)yAware.setLocalStateField('speech',null)
  renderRemoteCursors()
}
function renderPresenceCursor(uid,{x,y,name,color,bubbleState,local=false}){
  const layer=ensurePresenceLayer()
  if(!layer)return
  let el=cursorEls.get(uid)
  if(!el){
    el=document.createElement('div')
    el.className='remote-cursor'
    el.innerHTML='<div class="rc-arrow"></div><div class="rc-label"></div><div class="rc-bubble"></div>'
    layer.appendChild(el)
    cursorEls.set(uid,el)
  }
  el.classList.toggle('is-local',local)
  el.classList.toggle('has-bubble',!!bubbleState?.bubbleVisible)
  el.classList.toggle('is-fading',!!bubbleState?.fading)
  el.style.transform=`translate(${x}px,${y}px)`
  const arrow=el.querySelector('.rc-arrow')
  const label=el.querySelector('.rc-label')
  const bubble=el.querySelector('.rc-bubble')
  if(arrow)arrow.style.borderBottomColor=color
  if(label){
    label.style.background=color
    label.textContent=name||''
  }
  if(bubble){
    bubble.textContent=bubbleState?.text||''
    bubble.style.opacity=bubbleState?.bubbleVisible?String(bubbleState.opacity??1):'0'
    bubble.classList.toggle('is-placeholder',bubbleState?.text==='Say something')
  }
}
document.addEventListener('mousemove',e=>{
  const x=e.clientX,y=e.clientY
  if(Math.abs(x-_lcx)<2&&Math.abs(y-_lcy)<2)return
  _lcx=x;_lcy=y
  if(yAware&&(showRemoteCursors||slashComposerActive))yAware.setLocalStateField('cursor',{x:x/window.innerWidth,y:y/window.innerHeight})
  if(slashComposerActive||localSpeechState)renderRemoteCursors()
})
document.addEventListener('mouseleave',()=>{
  if(yAware&&(showRemoteCursors||slashComposerActive))yAware.setLocalStateField('cursor',null)
  renderRemoteCursors()
})
function renderRemoteCursors(){
  const layer=ensurePresenceLayer()
  const rect=getWorkspaceRect()
  if(!layer||!rect||isPresenceLayerMuted()){clearRemoteCursors();return}
  const now=Date.now()
  const seen=new Set()
  const localBubbleState=getSpeechBubbleVisualState(localSpeechState,now)
  if(localBubbleState.bubbleVisible){
    const localCursor=projectCursorToWorkspace(yAware?.getLocalState?.()?.cursor||getFallbackLocalCursor(),rect)
    if(localCursor){
      seen.add(LOCAL_SPEECH_CURSOR_ID)
      renderPresenceCursor(LOCAL_SPEECH_CURSOR_ID,{x:localCursor.x,y:localCursor.y,name:myName,color:COLORS[myColor%6]||COLORS[0],bubbleState:localBubbleState,local:true})
    }
  }
  if(yAware&&showRemoteCursors){
    yAware.getStates().forEach(st=>{
      if(!st.user)return
      const uid=st.user.id
      const projected=projectCursorToWorkspace(st.cursor,rect)
      if(!shouldRenderPresenceForUser({currentMode,remoteMode:st.user.mode,myUserId:myId,remoteUserId:uid,hasCursor:!!projected}))return
      seen.add(uid)
      renderPresenceCursor(uid,{
        x:projected.x,
        y:projected.y,
        name:st.user.name,
        color:COLORS[(st.user.color||0)%6]||COLORS[0],
        bubbleState:getSpeechBubbleVisualState(st.speech,now),
      })
    })
  }
  cursorEls.forEach((el,uid)=>{if(!seen.has(uid)){el.remove();cursorEls.delete(uid)}})
}
function clearRemoteCursors(){cursorEls.forEach(el=>el.remove());cursorEls.clear()}
setInterval(()=>{
  const hasRemoteSpeech=yAware&&[...yAware.getStates().values()].some(st=>st.user?.id!==myId&&st.speech?.active)
  if(localSpeechState||hasRemoteSpeech)renderRemoteCursors()
},120)

})
