<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从传统职能协作到 Vibe Coding 协同</title>
  <desc id="desc">对比传统按职能分工的协作模式，与围绕共同体验、任务和意图协同的 Vibe Coding 模式。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfefd"/>
      <stop offset="1" stop-color="#eefaf5"/>
    </linearGradient>
    <linearGradient id="future" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfbf4"/>
      <stop offset="1" stop-color="#d9f4ea"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#98d9bf"/>
      <stop offset="1" stop-color="#35a981"/>
    </linearGradient>
    <radialGradient id="vibe" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#f8ecaa"/>
      <stop offset=".25" stop-color="#f4ae91"/>
      <stop offset=".49" stop-color="#9c84e8"/>
      <stop offset=".73" stop-color="#4c9ff1"/>
      <stop offset="1" stop-color="#67c49a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2d705c" flood-opacity=".12"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #26343b; letter-spacing: -.4px; }
      .future-title { font-size: 30px; font-weight: 700; fill: #267b62; letter-spacing: -.4px; }
      .kicker { font-size: 15px; font-weight: 700; fill: #87979c; letter-spacing: 1.6px; }
      .role { font-size: 19px; font-weight: 700; fill: #fff; }
      .label { font-size: 18px; font-weight: 700; fill: #477363; }
      .left-head { font-size: 24px; font-weight: 700; fill: #34434a; }
      .right-head { font-size: 24px; font-weight: 700; fill: #23916d; }
      .body { font-size: 16px; fill: #708087; }
      .right-body { font-size: 16px; fill: #4f7869; }
      .chip { font-size: 15px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect x="800" width="800" height="900" fill="url(#future)"/>
  <line x1="800" y1="64" x2="800" y2="836" stroke="#cde8dc" stroke-width="1.5" stroke-dasharray="5 10"/>

  <g class="ui">
    <text x="90" y="88" class="kicker">THE LEGACY</text>
    <text x="90" y="132" class="title">传统协作模式</text>
    <text x="1510" y="88" text-anchor="end" class="kicker" fill="#56ae8b">THE FUTURE</text>
    <text x="1510" y="132" text-anchor="end" class="future-title">Vibe Coding 协同</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="174" width="592" height="280" rx="24" fill="#fff"/>
    <rect x="918" y="174" width="592" height="280" rx="24" fill="#fff"/>
  </g>

  <g class="ui">
    <g transform="translate(382 329)">
      <circle r="42" fill="#f4f7f6" stroke="#dce9e3" stroke-width="2"/>
      <circle r="7" fill="#8ca099"/>
      <path d="M-40-24 L-136-92 M40-24 L136-92 M-42 28 L-136 92 M42 28 L136 92" stroke="#d6e4de" stroke-width="4" stroke-linecap="round"/>
      <g transform="translate(-184 -132)"><rect width="104" height="78" rx="14" fill="#ffb568"/><text x="52" y="47" text-anchor="middle" class="role">Dev</text></g>
      <g transform="translate(80 -132)"><rect width="104" height="78" rx="14" fill="#a78bec"/><text x="52" y="47" text-anchor="middle" class="role">UI</text></g>
      <g transform="translate(-184 54)"><rect width="104" height="78" rx="14" fill="#6fc6ad"/><text x="52" y="47" text-anchor="middle" class="role">PM</text></g>
      <g transform="translate(80 54)"><rect width="104" height="78" rx="14" fill="#5a9ff0"/><text x="52" y="47" text-anchor="middle" class="role">Dev</text></g>
    </g>
  </g>

  <g class="ui">
    <g transform="translate(1214 332)">
      <circle cx="-62" cy="-22" r="72" fill="#b19aef" opacity=".8" filter="url(#blur)"/>
      <circle cx="54" cy="-16" r="80" fill="#69aefa" opacity=".8" filter="url(#blur)"/>
      <circle cx="-10" cy="70" r="76" fill="#69c89c" opacity=".86" filter="url(#blur)"/>
      <circle cx="-86" cy="34" r="58" fill="#ffbf86" opacity=".78" filter="url(#blur)"/>
      <circle r="104" fill="url(#vibe)" opacity=".92"/>
      <circle r="105" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="2"/>
      <text y="10" text-anchor="middle" class="role" font-size="28">Vibe</text>
    </g>
  </g>

  <g class="ui">
    <path d="M715 312 H846" stroke="url(#arrow)" stroke-width="18" stroke-linecap="round"/>
    <path d="M830 268 L880 321 L830 374" fill="none" stroke="#35a981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="ui">
    <g transform="translate(726 507)"><rect width="148" height="42" rx="21" fill="#50b491"/><text x="74" y="27" text-anchor="middle" class="chip">协作方式</text></g>
    <g transform="translate(726 641)"><rect width="148" height="42" rx="21" fill="#50b491"/><text x="74" y="27" text-anchor="middle" class="chip">表达语言</text></g>
    <g transform="translate(726 775)"><rect width="148" height="42" rx="21" fill="#50b491"/><text x="74" y="27" text-anchor="middle" class="chip">用户角色</text></g>

    <g transform="translate(90 500)">
      <text class="left-head">技能导向 <tspan fill="#7d8b91" font-size="17">Skill-based</tspan></text>
      <text y="34" class="body">解耦的职能划分：前端、后端、美术</text>
    </g>
    <g transform="translate(1510 500)">
      <text text-anchor="end" class="right-head">任务导向 <tspan fill="#58ac8d" font-size="17">Task-based</tspan></text>
      <text y="34" text-anchor="end" class="right-body">耦合的体验塑造：逻辑、情感、叙事</text>
    </g>

    <g transform="translate(90 634)">
      <text class="left-head">语法实现 <tspan fill="#7d8b91" font-size="17">Implementation</tspan></text>
      <text y="34" class="body">严谨的代码逻辑与语法约束</text>
    </g>
    <g transform="translate(1510 634)">
      <text text-anchor="end" class="right-head">意图表达 <tspan fill="#58ac8d" font-size="17">Intent Expression</tspan></text>
      <text y="34" text-anchor="end" class="right-body">模糊的自然语言与氛围描述</text>
    </g>

    <g transform="translate(90 768)">
      <text class="left-head">功能执行者 <tspan fill="#7d8b91" font-size="17">Functional Executor</tspan></text>
      <text y="34" class="body">负责完成预设的静态模块</text>
    </g>
    <g transform="translate(1510 768)">
      <text text-anchor="end" class="right-head">体验共创者 <tspan fill="#58ac8d" font-size="17">Experience Co-creator</tspan></text>
      <text y="34" text-anchor="end" class="right-body">共同编织动态的交互灵魂</text>
    </g>
  </g>
</svg>
