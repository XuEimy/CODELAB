/* === SUMMARY PANEL === */
function SummaryPanel({ summary, flashKey, isRefreshing, activeTab, refreshingBy, onDiscuss, discussedItems, onMarkDone, onRefresh }) {
  const tab = activeTab || 'consensus';

  if (!summary) {
    return (
      <div className="summary-panel" style={{display:'flex',flexDirection:'column',height:'100%'}}>
        <div className="summary-inner" style={{flex:1}}>
          <div className="summary-empty">
            {tab === 'consensus' ? '发送消息后，在标题栏点击「刷新」让 AI 分析讨论内容。' : '暂无待确认问题或冲突。'}
          </div>
        </div>
      </div>
    );
  }

  const consensusCount = summary.consensus?.length || 0;
  const questionsCount = summary.openQuestions?.length || 0;
  const conflictsCount = summary.conflicts?.length || 0;
  const nextCount = summary.nextSteps?.length || 0;
  // Count only unresolved items (not marked done)
  const activeQuestionsCount = (summary.openQuestions || []).filter((_, i) => discussedItems?.[`question-${i}`]?.status !== 'done').length;
  const activeConflictsCount = (summary.conflicts || []).filter((_, i) => discussedItems?.[`conflict-${i}`]?.status !== 'done').length;

  return (
    <div className="summary-panel" style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div className="summary-tab-body">
        <div className="summary-inner">
          {(isRefreshing || refreshingBy) && (
            <div className="summary-loading">
              <div style={{display:'flex',gap:'4px'}}>
                <div className="typing-dot"></div><div className="typing-dot"></div><div className="typing-dot"></div>
              </div>
              {refreshingBy ? `${refreshingBy} 正在整理...` : '正在整理...'}
            </div>
          )}

          {tab === 'consensus' && (
            <>
              {summary.concept && (
                <div className={`summary-card sc-concept ${flashKey ? "flash" : ""}`} key={"concept-" + flashKey} style={{marginBottom:8}}>
                  <div className="summary-card-label"><span className="sc-icon" style={{color:"var(--accent)"}}>&#9672;</span> 游戏概念</div>
                  <div className="summary-card-value">{summary.concept}</div>
                </div>
              )}
              {summary.coreMechanics && (
                <div className={`summary-card sc-core ${flashKey ? "flash" : ""}`} key={"core-" + flashKey} style={{marginBottom:8}}>
                  <div className="summary-card-label"><span className="sc-icon" style={{color:"var(--green)"}}>&#8635;</span> 核心玩法</div>
                  <div className="summary-card-value">{summary.coreMechanics}</div>
                </div>
              )}
              {summary.consensus?.length > 0 && (
                <div className={`summary-card sc-consensus ${flashKey ? "flash" : ""}`} key={"consensus-" + flashKey} style={{marginBottom:8}}>
                  <div className="summary-card-label"><span className="sc-icon" style={{color:"var(--green)"}}>&#10003;</span> 已达成共识</div>
                  <ul className="summary-list sl-green">
                    {summary.consensus.map((c, i) => <li key={i}>{c}</li>)}
                  </ul>
                </div>
              )}
              {summary.nextSteps?.length > 0 && (
                <div className={`summary-card sc-next ${flashKey ? "flash" : ""}`} key={"next-" + flashKey} style={{marginBottom:8}}>
                  <div className="summary-card-label"><span className="sc-icon" style={{color:"var(--accent)"}}>&#10148;</span> 下一步</div>
                  <ul className="summary-list sl-accent">
                    {summary.nextSteps.map((s, i) => <li key={i}>{s}</li>)}
                  </ul>
                </div>
              )}
              {consensusCount === 0 && nextCount === 0 && !summary.concept && (
                <div className="summary-empty">暂无共识或下一步行动。继续讨论并刷新整理。</div>
              )}
            </>
          )}

          {tab === 'issues' && (
            <>
              {summary.targetExperience && (
                <div className={`summary-card sc-target ${flashKey ? "flash" : ""}`} key={"target-" + flashKey} style={{marginBottom:8}}>
                  <div className="summary-card-label"><span className="sc-icon" style={{color:"var(--pink)"}}>&#9829;</span> 目标体验</div>
                  <div className="summary-card-value">{summary.targetExperience}</div>
                </div>
              )}
              {summary.openQuestions?.length > 0 && (
                <div style={{marginBottom:12}}>
                  <div style={{fontFamily:'var(--font-code)',fontSize:'9px',color:'var(--orange)',letterSpacing:'1px',textTransform:'uppercase',marginBottom:6,fontWeight:600}}>
                    &#63; 待确认问题 ({activeQuestionsCount})
                  </div>
                  {summary.openQuestions.map((q, i) => {
                    const dKey = `question-${i}`;
                    const dState = discussedItems?.[dKey];
                    if (dState?.status === 'done') return null;
                    return (
                      <div key={i} className="conflict-card">
                        <div className="conflict-card-title">
                          <span style={{color:'var(--orange)'}}>&#9679;</span> {q}
                        </div>
                        <div className="conflict-card-actions">
                          {dState?.status === 'discussing' ? (
                            <>
                              <button className="conflict-resolve-btn conflict-resolve-btn-done" onClick={() => { onMarkDone && onMarkDone(dKey); onRefresh && onRefresh(); }}>已讨论完成</button>
                              <button className="conflict-resolve-btn conflict-resolve-btn-discuss" onClick={() => onRefresh && onRefresh()}>重新整理</button>
                              <span style={{fontSize:'9px',color:'var(--textd)',fontFamily:'var(--font-code)'}}>{dState.by} 发起了讨论</span>
                            </>
                          ) : (
                            <button className="conflict-resolve-btn conflict-resolve-btn-discuss" onClick={() => {
                              if (onDiscuss) onDiscuss({ text: q, type: 'question', index: i });
                            }}>在讨论室讨论</button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
              {summary.conflicts?.length > 0 && (
                <div>
                  <div style={{fontFamily:'var(--font-code)',fontSize:'9px',color:'var(--pink)',letterSpacing:'1px',textTransform:'uppercase',marginBottom:6,fontWeight:600}}>
                    &#9888; 潜在冲突 ({activeConflictsCount})
                  </div>
                  {summary.conflicts.map((c, i) => {
                    const dKey = `conflict-${i}`;
                    const dState = discussedItems?.[dKey];
                    if (dState?.status === 'done') return null;
                    return (
                      <div key={i} className="conflict-card">
                        <div className="conflict-card-title">
                          <span style={{color:'var(--pink)'}}>&#9650;</span> {c}
                        </div>
                        <div className="conflict-card-actions">
                          {dState?.status === 'discussing' ? (
                            <>
                              <button className="conflict-resolve-btn conflict-resolve-btn-done" onClick={() => { onMarkDone && onMarkDone(dKey); onRefresh && onRefresh(); }}>已讨论完成</button>
                              <button className="conflict-resolve-btn conflict-resolve-btn-discuss" onClick={() => onRefresh && onRefresh()}>重新整理</button>
                              <span style={{fontSize:'9px',color:'var(--textd)',fontFamily:'var(--font-code)'}}>{dState.by} 发起了讨论</span>
                            </>
                          ) : (
                            <>
                              <button className="conflict-resolve-btn conflict-resolve-btn-discuss" onClick={() => {
                                if (onDiscuss) onDiscuss({ text: c, type: 'conflict', index: i });
                              }}>讨论</button>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
              {activeQuestionsCount === 0 && activeConflictsCount === 0 && (
                <div className="summary-empty">
                  {questionsCount > 0 || conflictsCount > 0
                    ? '所有问题和冲突都已讨论完成。'
                    : '暂无待确认问题或冲突。'}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* === WISDOM TREE (horizontal flow mind-map) === */
function WisdomTree({ nodes, edges, categories, selectedNode, onSelectNode, users, saveTree,
  agentTasks, onClaim, brainBusy, brainStatus, onBrainSplit, onLocalSplit, isLocalSplitting, isBrainSplitting, splittingBy,
  onGenerateWisdomTree, isGeneratingTree, generatingTreeBy, canGenerateWisdomTree,
  yjsRef, userName, myColor, onBeforeEnter }) {
  const panelRef = useRef(null);
  const [contextMenu, setContextMenu] = useState(null);
  const [editingNode, setEditingNode] = useState(null);
  const [addingTo, setAddingTo] = useState(null);
  const [newLabel, setNewLabel] = useState('');
  const [addingLane, setAddingLane] = useState(false);
  const [newLaneName, setNewLaneName] = useState('');
  const dragRef = useRef(null);
  const [dragOverCat, setDragOverCat] = useState(null);
  const chipRefs = useRef({});
  const [tick, setTick] = useState(0);
  const svgRef = useRef(null);
  const [editingLane, setEditingLane] = useState(null);
  const [editingLaneName, setEditingLaneName] = useState('');
  const [laneContextMenu, setLaneContextMenu] = useState(null);
  const [claimPopup, setClaimPopup] = useState(null); // { catId, label, color } or 'all'

  // Always append "其他"
  const allCats = useMemo(() => {
    const c = categories.length > 0 ? [...categories] : [];
    if (!c.some(x => x.id === 'other')) c.push({ id:'other', label:'其他', color:'#94a3b8' });
    return c;
  }, [categories]);

  // Group nodes by category
  const groups = useMemo(() => {
    const g = {};
    allCats.forEach(c => g[c.id] = []);
    nodes.forEach(n => {
      const cid = n.category && g[n.category] ? n.category : 'other';
      if (!g[cid]) g[cid] = [];
      g[cid].push(n);
    });
    Object.values(g).forEach(a => a.sort((x, y) => (x.row||0) - (y.row||0)));
    return g;
  }, [nodes, allCats]);

  const nodeMap = useMemo(() => { const m = {}; nodes.forEach(n => m[n.id] = n); return m; }, [nodes]);

  // Node users
  const nodeUsers = useMemo(() => {
    const m = {};
    (users || []).forEach(u => { if (u.activeTask) nodes.forEach(n => { if (n.label === u.activeTask) { (m[n.id] = m[n.id] || []).push(u); } }); });
    return m;
  }, [users, nodes]);

  // Close context
  useEffect(() => { if (!contextMenu && !laneContextMenu) return; const h = () => { setContextMenu(null); setLaneContextMenu(null); }; document.addEventListener('click', h); return () => document.removeEventListener('click', h); }, [contextMenu, laneContextMenu]);

  // Tick for line redraw
  useEffect(() => { setTick(t => t + 1); }, [nodes, edges, allCats]);
  useEffect(() => { const el = panelRef.current; if (!el) return; const ro = new ResizeObserver(() => setTick(t => t + 1)); ro.observe(el); return () => ro.disconnect(); }, []);
  // Also redraw on scroll
  const handleScroll = useCallback(() => setTick(t => t + 1), []);

  // --- Drag ---
  const onDragStart = useCallback((e, id) => { dragRef.current = id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); requestAnimationFrame(() => { const el = chipRefs.current[id]; if (el) el.classList.add('dragging'); }); }, []);
  const onDragEnd = useCallback(() => { const id = dragRef.current; dragRef.current = null; setDragOverCat(null); if (id) { const el = chipRefs.current[id]; if (el) el.classList.remove('dragging'); } }, []);
  const onDragOver = useCallback((e, catId) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOverCat(catId); }, []);
  const onDragLeave = useCallback((e, catId) => { if (dragOverCat === catId) setDragOverCat(null); }, [dragOverCat]);
  const onDrop = useCallback((e, toCat) => {
    e.preventDefault(); setDragOverCat(null);
    const id = dragRef.current || e.dataTransfer.getData('text/plain'); dragRef.current = null;
    if (!id) return;
    const el = chipRefs.current[id]; if (el) el.classList.remove('dragging');
    const catN = nodes.filter(n => n.category === toCat && n.id !== id);
    const up = nodes.map(n => n.id === id ? { ...n, category: toCat, row: catN.length } : n);
    const old = nodeMap[id]; if (old && old.category !== toCat) { up.filter(n => n.category === old.category).sort((a,b)=>(a.row||0)-(b.row||0)).forEach((n,i) => n.row = i); }
    saveTree(up, edges);
  }, [nodes, edges, nodeMap, saveTree]);

  // --- Edit / Add / Delete ---
  const submitEdit = useCallback((id, v) => { if (!v.trim()) { setEditingNode(null); return; } saveTree(nodes.map(n => n.id === id ? { ...n, label: v.trim() } : n), edges); setEditingNode(null); }, [nodes, edges, saveTree]);
  const addNode = useCallback((catId) => {
    if (!newLabel.trim()) return;
    const n = { id: 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), label: newLabel.trim(), category: catId, row: (groups[catId]||[]).length, status:'open', priority:'medium', desc: newLabel.trim() };
    saveTree([...nodes, n], edges); setNewLabel(''); setAddingTo(null);
  }, [nodes, edges, groups, saveTree, newLabel]);
  const deleteNode = useCallback((id) => {
    const up = nodes.filter(n => n.id !== id); const ue = edges.filter(e => e.from !== id && e.to !== id);
    const nd = nodeMap[id]; if (nd) up.filter(n => n.category === nd.category).sort((a,b)=>(a.row||0)-(b.row||0)).forEach((n,i) => n.row = i);
    saveTree(up, ue); setContextMenu(null); if (selectedNode === id) onSelectNode(null);
  }, [nodes, edges, nodeMap, saveTree, selectedNode, onSelectNode]);
  const claimNode = useCallback((id) => {
    const node = nodeMap[id];
    if (!node) return;
    if (node.assignee) { showToast('该节点已被认领', 'warn'); return; }
    const up = nodes.map(n => n.id === id ? { ...n, assignee: userName, assigneeColor: myColor, assigneeAvatar: myAvatar, assigneeAvatarUrl: myAvatarUrl, status: 'in-progress' } : n);
    saveTree(up, edges);
    showToast(`已认领: ${node.label}`, 'success');
  }, [nodes, edges, nodeMap, saveTree]);
  const unclaimNode = useCallback((id) => {
    const node = nodeMap[id];
    if (!node) return;
    const up = nodes.map(n => n.id === id ? { ...n, assignee: null, assigneeColor: null, assigneeAvatar: null, assigneeAvatarUrl: null, status: 'open' } : n);
    saveTree(up, edges);
    showToast(`已取消认领: ${node.label}`, 'success');
  }, [nodes, edges, nodeMap, saveTree]);
  const setNodeStatus = useCallback((id, status) => {
    const up = nodes.map(n => n.id === id ? { ...n, status } : n);
    saveTree(up, edges);
  }, [nodes, edges, saveTree]);
  const claimLane = useCallback((catId) => {
    const unclaimed = nodes.filter(n => n.category === catId && !n.assignee);
    if (unclaimed.length === 0) { showToast('该分类下所有节点已被认领', 'warn'); return; }
    const up = nodes.map(n => n.category === catId && !n.assignee ? { ...n, assignee: userName, assigneeColor: myColor, assigneeAvatar: myAvatar, assigneeAvatarUrl: myAvatarUrl, status: 'in-progress' } : n);
    saveTree(up, edges);
    showToast(`已认领 ${unclaimed.length} 个节点`, 'success');
  }, [nodes, edges, saveTree]);
  const moveCat = useCallback((id, toCat) => {
    const catN = nodes.filter(n => n.category === toCat && n.id !== id);
    saveTree(nodes.map(n => n.id === id ? { ...n, category: toCat, row: catN.length } : n), edges); setContextMenu(null);
  }, [nodes, edges, saveTree]);

  // --- Add lane (category row) ---
  const addLane = useCallback(() => {
    if (!newLaneName.trim()) return;
    const id = 'cat-' + Date.now().toString(36) + Math.random().toString(36).slice(2,4);
    const ci = categories.length;
    const color = CATEGORY_COLORS[ci % CATEGORY_COLORS.length];
    const newCats = [...categories, { id, label: newLaneName.trim(), color }];
    saveTree(nodes, edges, newCats);
    setNewLaneName(''); setAddingLane(false);
  }, [categories, nodes, edges, saveTree, newLaneName]);

  // --- Edit lane (category) ---
  const submitLaneEdit = useCallback((catId, newName) => {
    if (!newName.trim()) { setEditingLane(null); return; }
    const newCats = categories.map(c => c.id === catId ? { ...c, label: newName.trim() } : c);
    saveTree(nodes, edges, newCats);
    setEditingLane(null); setEditingLaneName('');
  }, [categories, nodes, edges, saveTree]);

  // --- Delete lane (category) ---
  const deleteLane = useCallback((catId) => {
    if (catId === 'other') return; // Can't delete "其他"
    // Move nodes in this lane to "other"
    const updatedNodes = nodes.map(n => n.category === catId ? { ...n, category: 'other' } : n);
    const newCats = categories.filter(c => c.id !== catId);
    saveTree(updatedNodes, edges, newCats);
    setLaneContextMenu(null);
  }, [categories, nodes, edges, saveTree]);

  // --- SVG lines ---
  const renderLines = useCallback(() => {
    if (!edges.length || !svgRef.current || !panelRef.current) return null;
    const canvas = panelRef.current.querySelector('.tree-canvas');
    if (!canvas) return null;
    const cr = canvas.getBoundingClientRect();
    const sx = canvas.scrollLeft, sy = canvas.scrollTop;
    return edges.map((edge, i) => {
      const a = chipRefs.current[edge.from], b = chipRefs.current[edge.to];
      if (!a || !b) return null;
      const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
      const fx = ar.right - cr.left + sx, fy = ar.top + ar.height/2 - cr.top + sy;
      const tx = br.left - cr.left + sx, ty = br.top + br.height/2 - cr.top + sy;
      const cp = Math.abs(fx - tx) * 0.4;
      const d = `M${fx},${fy} C${fx+cp},${fy} ${tx-cp},${ty} ${tx},${ty}`;
      const nd = nodeMap[edge.from]; const cat = allCats.find(c => c.id === nd?.category);
      return <path key={i} d={d} fill="none" stroke={cat?.color || 'var(--border-h)'} strokeWidth="1.5" opacity="0.35" strokeLinecap="round"/>;
    });
  }, [edges, nodeMap, allCats, tick]);

  // SVG size — match scroll content, not inflate it
  const svgSize = useMemo(() => {
    const flow = panelRef.current?.querySelector('.tree-flow');
    if (!flow) return { w: 0, h: 0 };
    return { w: flow.offsetWidth + 32, h: flow.offsetHeight + 32 };
  }, [tick]);

  return (
    <div className="tree-panel" ref={panelRef} onClick={() => onSelectNode(null)}>
      <div className="tree-header">
        <span className="tree-header-sub">拖拽分类 · 双击编辑 · 右键更多</span>
        <div style={{display:'flex',gap:4,marginLeft:8,alignItems:'center'}}>
          <button className="agent-action-btn" onClick={() => setClaimPopup('all')}
            disabled={!nodes.some(n => !n.assignee)}
            style={{height:22,fontSize:'9px',padding:'0 8px',display:'inline-flex',alignItems:'center',gap:3,whiteSpace:'nowrap',borderColor:'var(--orange)',color:'var(--orange)'}}>
            认领
          </button>
          <button
            className="agent-action-btn"
            onClick={onGenerateWisdomTree}
            disabled={!canGenerateWisdomTree || isGeneratingTree || !!generatingTreeBy}
            style={{
              height:22,
              fontSize:'9px',
              padding:'0 8px',
              display:'inline-flex',
              alignItems:'center',
              gap:4,
              whiteSpace:'nowrap',
              borderColor:'var(--purple)',
              color:'var(--purple)',
            }}
          >
            {(isGeneratingTree || generatingTreeBy) && renderMiniUserAvatar(isGeneratingTree ? userName : generatingTreeBy, users, 14)}
            {isGeneratingTree ? `${userName} 生成中...` : generatingTreeBy ? `${generatingTreeBy} 生成中...` : '生成智慧树'}
          </button>
        </div>
        <div className="tree-legend">
          {Object.entries(STATUS_CONFIG).map(([k, v]) => (
            <div key={k} className="legend-item"><div className="legend-dot" style={{background:v.color}}></div>{v.label}</div>
          ))}
        </div>
      </div>

      <div className="tree-canvas" onScroll={handleScroll}>
        {/* SVG lines */}
        <svg ref={svgRef} className="tree-lines-svg" width={svgSize.w} height={svgSize.h}>{renderLines()}</svg>

        {nodes.length === 0 && allCats.length <= 1 ? (
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--textd)',fontSize:'12px',fontFamily:'var(--font-code)',textAlign:'center',padding:'40px',lineHeight:'2.2',minHeight:'100%'}}>
            先在讨论室点击「AI 整理」生成摘要<br/>再点击「生成智慧树」创建分类和节点
          </div>
        ) : (
          <div className="tree-flow">
            {allCats.map((cat, ci) => {
              const color = cat.color || CATEGORY_COLORS[ci % CATEGORY_COLORS.length];
              const catNodes = groups[cat.id] || [];
              return (
                <div key={cat.id} className="tree-lane">
                  <div className="tree-lane-hdr"
                    onContextMenu={e => { e.preventDefault(); e.stopPropagation(); if (cat.id !== 'other') setLaneContextMenu({x:e.clientX,y:e.clientY,catId:cat.id}); }}
                    onDoubleClick={e => { e.stopPropagation(); if (cat.id !== 'other') { setEditingLane(cat.id); setEditingLaneName(cat.label); } }}
                  >
                    {editingLane === cat.id ? (
                      <div className="tree-add-row" style={{width:'100%'}}>
                        <input className="tree-chip-edit" autoFocus value={editingLaneName}
                          onChange={e => setEditingLaneName(e.target.value)}
                          onClick={e => e.stopPropagation()}
                          onBlur={() => submitLaneEdit(cat.id, editingLaneName)}
                          onKeyDown={e => { if (e.key==='Enter') submitLaneEdit(cat.id, editingLaneName); if (e.key==='Escape') { setEditingLane(null); setEditingLaneName(''); } }}
                          style={{width:'80px'}}
                        />
                      </div>
                    ) : (
                    <span className="tree-lane-pill" style={{ background: color+'15', color, border: `1.5px solid ${color}35` }}
                      onClick={e => { e.stopPropagation(); setClaimPopup({ catId: cat.id, label: cat.label, color }); }}>
                      <span style={{width:6,height:6,borderRadius:'50%',background:color,flexShrink:0,marginTop:3}}></span>
                      <span className="tree-lane-pill-text">{cat.label}</span>
                      {catNodes.length > 0 && <span className="tree-lane-count">{catNodes.length}</span>}
                    </span>
                    )}
                  </div>
                  <div className={`tree-lane-nodes${dragOverCat===cat.id?' drop-over':''}`}
                    onDragOver={e => onDragOver(e, cat.id)} onDragLeave={e => onDragLeave(e, cat.id)} onDrop={e => onDrop(e, cat.id)}>
                    {catNodes.map(node => {
                      const st = STATUS_CONFIG[node.status] || STATUS_CONFIG["open"];
                      const pr = PRIORITY_CONFIG[node.priority] || PRIORITY_CONFIG["medium"];
                      const sel = selectedNode === node.id;
                      const editing = editingNode === node.id;
                      const uOnNode = nodeUsers[node.id] || [];
                      return (
                        <div key={node.id} ref={el => { if (el) chipRefs.current[node.id] = el; }}
                          className={`tree-chip${sel?' selected':''}`}
                          style={{'--chip-color': color}}
                          draggable={!editing}
                          onDragStart={e => onDragStart(e, node.id)} onDragEnd={onDragEnd}
                          onClick={e => { e.stopPropagation(); onSelectNode(node.id); }}
                          onDoubleClick={e => { e.stopPropagation(); setEditingNode(node.id); }}
                          onContextMenu={e => { e.preventDefault(); e.stopPropagation(); setContextMenu({x:e.clientX,y:e.clientY,nodeId:node.id}); }}
                        >
                          <style>{`.tree-chip[style*="--chip-color: ${color}"]::before{background:${color}}`}</style>
                          <div className="tree-chip-dot" style={{background:st.color}}></div>
                          {editing ? (
                            <input className="tree-chip-edit" autoFocus defaultValue={node.label}
                              onClick={e => e.stopPropagation()}
                              onBlur={e => submitEdit(node.id, e.target.value)}
                              onKeyDown={e => { if (e.key==='Enter') submitEdit(node.id, e.target.value); if (e.key==='Escape') setEditingNode(null); }}
                            />
                          ) : (
                            <span className="tree-chip-label">{node.label}</span>
                          )}
                          {node.priority && node.priority !== 'medium' && (
                            <span className="tree-chip-badge" style={{color:pr.color,background:pr.color+'15'}}>{pr.label}</span>
                          )}
                          {node.assignee ? (
                            <div className="tree-chip-avatars" title={node.assignee + ' 已认领'}>
                              {(() => {
                                const u = (users || []).find(u => u.name === node.assignee);
                                const av = (u?.emoji || node.assigneeAvatar) && AVATARS_MAP[u?.emoji || node.assigneeAvatar];
                                const url = u?.avatarUrl || node.assigneeAvatarUrl;
                                return <div className="tree-chip-av">
                                  {url ? <img src={url} alt={node.assignee}/> : av ? <span dangerouslySetInnerHTML={{__html:av}}/> : <div style={{width:'100%',height:'100%',background:COLORS[(u?.color ?? node.assigneeColor ?? 0)%6],borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'7px',color:'#fff',fontWeight:700}}>{(node.assignee||'?')[0]}</div>}
                                </div>;
                              })()}
                            </div>
                          ) : null}
                        </div>
                      );
                    })}
                    {addingTo === cat.id ? (
                      <div className="tree-add-row">
                        <input className="tree-chip-edit" autoFocus value={newLabel} onChange={e => setNewLabel(e.target.value)}
                          placeholder="名称..."
                          onKeyDown={e => { if (e.key==='Enter') addNode(cat.id); if (e.key==='Escape'){setAddingTo(null);setNewLabel('');} }}
                        />
                        <button className="tree-confirm-btn" onClick={e => { e.stopPropagation(); addNode(cat.id); }}>确认</button>
                        <button className="tree-cancel-btn" onClick={e => { e.stopPropagation(); setAddingTo(null); setNewLabel(''); }}>取消</button>
                      </div>
                    ) : (
                      <button className="tree-add-chip" onClick={e => { e.stopPropagation(); setAddingTo(cat.id); setNewLabel(''); }}>+</button>
                    )}
                  </div>
                </div>
              );
            })}
            {/* Add lane button */}
            {addingLane ? (
              <div className="tree-add-row" style={{marginTop:'6px',paddingLeft:'4px'}}>
                <input className="tree-chip-edit" autoFocus value={newLaneName} onChange={e => setNewLaneName(e.target.value)}
                  placeholder="分类名称..."
                  onKeyDown={e => { if (e.key==='Enter') addLane(); if (e.key==='Escape'){setAddingLane(false);setNewLaneName('');} }}
                />
                <button className="tree-confirm-btn" onClick={e => { e.stopPropagation(); addLane(); }}>确认</button>
                <button className="tree-cancel-btn" onClick={e => { e.stopPropagation(); setAddingLane(false); setNewLaneName(''); }}>取消</button>
              </div>
            ) : (
              <button className="tree-add-lane" onClick={e => { e.stopPropagation(); setAddingLane(true); setNewLaneName(''); }}>+ 添加分类</button>
            )}
          </div>
        )}
      </div>

      {/* Lane context menu */}
      {laneContextMenu && (
        <div className="tree-ctx" style={{left:laneContextMenu.x,top:laneContextMenu.y}} onClick={e => e.stopPropagation()}>
          <div className="tree-ctx-item" onClick={() => { setEditingLane(laneContextMenu.catId); const c = allCats.find(x=>x.id===laneContextMenu.catId); setEditingLaneName(c?.label||''); setLaneContextMenu(null); }}>&#9998; 编辑分类名</div>
          <div className="tree-ctx-sep"></div>
          <div className="tree-ctx-item" style={{color:'var(--pink)'}} onClick={() => deleteLane(laneContextMenu.catId)}>&#128465; 删除分类</div>
        </div>
      )}

      {/* Context menu */}
      {contextMenu && (() => {
        const ctxNode = nodeMap[contextMenu.nodeId];
        return (
        <div className="tree-ctx" style={{left:contextMenu.x,top:contextMenu.y}} onClick={e => e.stopPropagation()}>
          <div className="tree-ctx-item" onClick={() => { setEditingNode(contextMenu.nodeId); setContextMenu(null); }}>&#9998; 编辑</div>
          <div className="tree-ctx-item" onClick={() => { onSelectNode(contextMenu.nodeId); setContextMenu(null); }}>&#128065; 详情</div>
          {!ctxNode?.assignee ? (
            <div className="tree-ctx-item" style={{color:'var(--orange)'}} onClick={() => { claimNode(contextMenu.nodeId); setContextMenu(null); }}>&#9997; 认领</div>
          ) : (
            <div className="tree-ctx-item" style={{color:'var(--textd)'}} onClick={() => { unclaimNode(contextMenu.nodeId); setContextMenu(null); }}>&#8634; 取消认领</div>
          )}
          <div className="tree-ctx-sep"></div>
          <div style={{padding:'3px 12px',fontSize:'9px',color:'var(--textd)',fontFamily:'var(--font-code)'}}>状态</div>
          {Object.entries(STATUS_CONFIG).map(([k, v]) => (
            <div key={k} className="tree-ctx-item" onClick={() => { setNodeStatus(contextMenu.nodeId, k); setContextMenu(null); }}
              style={ctxNode?.status === k ? {color:v.color,fontWeight:600} : {}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:v.color}}></span>{v.label}
            </div>
          ))}
          <div className="tree-ctx-sep"></div>
          <div style={{padding:'3px 12px',fontSize:'9px',color:'var(--textd)',fontFamily:'var(--font-code)'}}>移至</div>
          {allCats.map((cat,ci) => (
            <div key={cat.id} className="tree-ctx-item" onClick={() => moveCat(contextMenu.nodeId, cat.id)}>
              <span style={{width:7,height:7,borderRadius:'50%',background:cat.color||CATEGORY_COLORS[ci%CATEGORY_COLORS.length]}}></span>{cat.label}
            </div>
          ))}
          <div className="tree-ctx-sep"></div>
          <div className="tree-ctx-item" style={{color:'var(--pink)'}} onClick={() => deleteNode(contextMenu.nodeId)}>&#128465; 删除</div>
        </div>
        );
      })()}

      {selectedNode && nodeMap[selectedNode] && (
        <NodeDetailSidebar node={nodeMap[selectedNode]} categories={allCats} onClose={() => onSelectNode(null)} onClaim={claimNode} onUnclaim={unclaimNode} onSetStatus={setNodeStatus} users={users} yjsRef={yjsRef} userName={userName} myColor={myColor} onBeforeEnter={onBeforeEnter} />
      )}

      {/* Claim Popup */}
      {claimPopup && (() => {
        const isAll = claimPopup === 'all';
        const targetCats = isAll ? allCats.filter(c => (groups[c.id]||[]).some(n => !n.assignee)) : [allCats.find(c => c.id === claimPopup.catId)].filter(Boolean);
        const allUnclaimed = isAll ? nodes.filter(n => !n.assignee) : nodes.filter(n => n.category === claimPopup.catId && !n.assignee);
        if (allUnclaimed.length === 0) {
          setTimeout(() => { showToast('没有可认领的节点', 'warn'); setClaimPopup(null); }, 0);
          return null;
        }
        return (
          <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn .2s var(--ease)'}}
            onClick={() => setClaimPopup(null)}>
            <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'20px 24px',width:380,maxWidth:'92vw',maxHeight:'70vh',boxShadow:'var(--shadow-xl)',display:'flex',flexDirection:'column',gap:14}}
              onClick={e => e.stopPropagation()}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontFamily:'var(--font-head)',fontSize:14,fontWeight:700,color:'var(--text)'}}>
                  {isAll ? '认领节点' : `认领「${claimPopup.label}」`}
                </span>
                <button style={{width:24,height:24,borderRadius:'var(--radius-xs)',border:'1px solid var(--border)',background:'var(--bg3)',color:'var(--textd)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}
                  onClick={() => setClaimPopup(null)}>&times;</button>
              </div>

              {/* Claim all in this category / all categories */}
              <button style={{width:'100%',padding:'10px 14px',borderRadius:'var(--radius-sm)',border:'1px solid var(--orange)',background:'rgba(251,191,36,.08)',color:'var(--orange)',cursor:'pointer',fontFamily:'var(--font-code)',fontSize:12,fontWeight:700,transition:'all .15s var(--ease)',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}
                onMouseEnter={e => { e.currentTarget.style.background='var(--orange)'; e.currentTarget.style.color='#fff'; }}
                onMouseLeave={e => { e.currentTarget.style.background='rgba(251,191,36,.08)'; e.currentTarget.style.color='var(--orange)'; }}
                onClick={() => {
                  if (isAll) {
                    const unclaimed = nodes.filter(n => !n.assignee);
                    if (unclaimed.length === 0) { showToast('没有可认领的节点', 'warn'); setClaimPopup(null); return; }
                    saveTree(nodes.map(n => !n.assignee ? { ...n, assignee: userName, assigneeColor: myColor, assigneeAvatar: myAvatar, assigneeAvatarUrl: myAvatarUrl, status: 'in-progress' } : n), edges);
                    showToast(`已认领全部 ${unclaimed.length} 个节点`, 'success');

/* === PLAN WORKSPACE (fixed windows layout) === */
function PlanWorkspace(props) {
  const containerRef = useRef(null);
  const [size, setSize] = useState({ w: 1200, h: 600 });

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const ro = new ResizeObserver(entries => {
      for (const e of entries) setSize({ w: e.contentRect.width, h: e.contentRect.height });
    });
    ro.observe(el);
    setSize({ w: el.offsetWidth, h: el.offsetHeight });
    return () => ro.disconnect();
  }, []);

  const g = 8; // gutter (bleed line)
  const w = size.w, h = size.h;
  // Layout: left = chat (28%), right = top row (3 panels) + bottom (tree)
  const leftW = Math.floor(w * 0.28);
  const rightW = w - leftW - g * 3;
  // Right top row: 3 panels evenly split
  const topH = Math.floor((h - g * 3) * 0.42);
  const bottomH = h - topH - g * 3;
  const panelW = Math.floor((rightW - g * 2) / 3);
  const lastPanelW = rightW - panelW * 2 - g * 2; // account for rounding
  const rightX = leftW + g * 2;

  const wins = [
    { id: 'chat', title: '讨论室', color: 'var(--green)', x: g, y: g, pw: leftW, ph: h - g * 2 },
    { id: 'summary', title: '共识与下一步', color: 'var(--green)', x: rightX, y: g, pw: panelW, ph: topH },
    { id: 'issues', title: '待确认与冲突', color: 'var(--orange)', x: rightX + panelW + g, y: g, pw: panelW, ph: topH },
    { id: 'demo', title: '提示词预览', color: 'var(--purple)', x: rightX + panelW * 2 + g * 2, y: g, pw: lastPanelW, ph: topH },
    { id: 'tree', title: '智慧树', color: 'var(--green)', x: rightX, y: topH + g * 2, pw: rightW, ph: bottomH },
  ];

  const renderPanelContent = (id) => {
    switch (id) {
      case 'chat':
        return (
          <ChatPanel
            chatMessages={props.chatMessages} pushChat={props.pushChat}
            isTyping={props.isTyping} streamText={props.streamText}
            onAskAI={props.onAskAI}
            onRefresh={props.onRefresh} isRefreshing={props.isRefreshing} refreshingBy={props.refreshingBy}
            connected={props.connected} users={props.users}
            discussionTopic={props.discussionTopic} onDiscussionSent={props.onDiscussionSent}
          />
        );
      case 'summary':
        return (
          <SummaryPanel
            summary={props.summary} flashKey={props.flashKey}
            isRefreshing={props.isRefreshing} refreshingBy={props.refreshingBy}
            activeTab="consensus"
          />
        );
      case 'issues':
        return (
          <SummaryPanel
            summary={props.summary} flashKey={props.flashKey}
            isRefreshing={props.isRefreshing} refreshingBy={props.refreshingBy}
            activeTab="issues"
            onDiscuss={props.onDiscuss} discussedItems={props.discussedItems}
            onMarkDone={props.onMarkDone} onRefresh={props.onRefresh}
          />
        );
      case 'demo':
        return (
          <PromptPreviewPanel
            prompt={props.lastStructuredPrompt}
            promptAt={props.structuredPromptAt}
            previewData={props.generatedTreePreview}
            summaryReady={props.summaryReady}
            isGeneratingTree={props.isGeneratingTree}
            generatingTreeBy={props.generatingTreeBy}
            generatedTreeAt={props.generatedTreeAt}
            generatedTreeBy={props.generatedTreeBy}
            users={props.users}
            currentUserName={props.userName}
          />
        );
      case 'tree':
        return (
          <WisdomTree
            nodes={props.nodes} edges={props.edges} categories={props.categories}
            selectedNode={props.selectedNode} onSelectNode={props.onSelectNode}
            users={props.users} saveTree={props.saveTree}
            agentTasks={props.agentTasks} onClaim={props.onClaim}

            onBrainSplit={props.onBrainSplit} onLocalSplit={props.onLocalSplit}
            isLocalSplitting={props.isLocalSplitting} isBrainSplitting={props.isBrainSplitting} splittingBy={props.splittingBy}
            onGenerateWisdomTree={props.onGenerateWisdomTree}
            isGeneratingTree={props.isGeneratingTree}

    <div className="plan-main" ref={containerRef}>

        <div key={win.id} className="pfw"

    </div>
  );
}

/* === LIGHTWEIGHT TOKEN ESTIMATOR === */
function estimateTokens(text) {
  if (!text) return 0;
  let count = 0;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if ((code >= 0x4E00 && code <= 0x9FFF) ||
        (code >= 0x3000 && code <= 0x30FF) ||
        (code >= 0xFF00 && code <= 0xFFEF)) {
      count += 0.7;  // CJK characters
    } else if (code === 0x20) {
      count += 0.25; // spaces (word boundaries)
    } else {
      count += 0.3;  // ASCII / other
    }
  }
  return Math.ceil(count);
}

/* === BUILD CHAT CONTEXT FOR AI (token-aware) === */
function buildChatContext(chatMessages, maxTokenBudget = 3000) {
  const formatted = [];
  let usedTokens = 0;

  // Work backwards from most recent messages
  for (let i = chatMessages.length - 1; i >= 0; i--) {
    const m = chatMessages[i];
    const line = `${m.name}: ${m.text}`;
    const lineTokens = estimateTokens(line);

    if (usedTokens + lineTokens > maxTokenBudget && formatted.length > 0) {
      const omitted = i + 1;
      formatted.unshift(`[...此前还有 ${omitted} 条讨论已省略...]`);
      break;
    }
    usedTokens += lineTokens;
    formatted.unshift(line);
  }
  return formatted.join('\n');
}

/* === STRUCTURED PROMPT BUILDER ===
   Converts AI-extracted summary + nodes + categories into a rich,
   complete prompt for Brain Agent to generate game code from.
   Stored in Yjs so both pages share it without truncation. */
function buildStructuredPrompt(data, nodes, cats) {
  const lines = [];

  // ── Core concept ──
  if (data.concept) lines.push(`【游戏概念】\n${data.concept}`);
  if (data.coreMechanics) lines.push(`【核心玩法】\n${data.coreMechanics}`);
  if (data.targetExperience) lines.push(`【目标体验】\n${data.targetExperience}`);

  // ── Consensus (what the team agreed on) ──
  if (data.consensus?.length) {
    lines.push(`【团队共识】\n${data.consensus.map(s => `- ${s}`).join('\n')}`);
  }

  // ── Feature modules from tree (full labels + descriptions) ──
  if (nodes?.length > 0 && cats?.length > 0) {
    const catMap = {};
    cats.forEach(c => catMap[c.id] = c.label);
    const byCat = {};
    nodes.forEach(n => {
      const cat = catMap[n.category] || '其他';
      if (!byCat[cat]) byCat[cat] = [];
      byCat[cat].push(n.desc && n.desc !== n.label ? `${n.label}（${n.desc}）` : n.label);
    });
    const moduleLines = Object.entries(byCat)
      .map(([cat, items]) => `  ${cat}：${items.join('、')}`)
      .join('\n');
    lines.push(`【功能模块】\n${moduleLines}`);
  }

  // ── Open questions (things to decide) ──
  if (data.openQuestions?.length) {
    lines.push(`【待确认问题】\n${data.openQuestions.map(s => `- ${s}`).join('\n')}`);
  }

  // ── Conflicts & resolutions ──
  if (data.conflicts?.length) {
    lines.push(`【冲突与取舍】\n${data.conflicts.map(s => `- ${s}`).join('\n')}`);
  }

  // ── Next steps ──
  if (data.nextSteps?.length) {
    lines.push(`【下一步计划】\n${data.nextSteps.map(s => `- ${s}`).join('\n')}`);
  }

  return lines.join('\n\n');
}

function hasSummaryContent(summary) {
  if (!summary) return false;
  return Boolean(
    summary.concept ||
    summary.coreMechanics ||
    summary.targetExperience ||
    summary.consensus?.length ||
    summary.openQuestions?.length ||
    summary.conflicts?.length ||
    summary.nextSteps?.length
  );
}

function normalizeSummaryData(data = {}) {
  const toText = value => (typeof value === 'string' ? value.trim() : '');
  const toList = value => Array.isArray(value)
    ? value.map(item => String(item || '').trim()).filter(Boolean)
    : [];

  return {
    concept: toText(data.concept),
    coreMechanics: toText(data.coreMechanics),
    targetExperience: toText(data.targetExperience),
    consensus: toList(data.consensus),
    openQuestions: toList(data.openQuestions),
    conflicts: toList(data.conflicts),
    nextSteps: toList(data.nextSteps),
  };
}

function extractJsonObject(text) {
  if (!text) return null;
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const candidate = fenced?.[1] || text;
  const jsonMatch = candidate.match(/\{[\s\S]*\}/);
  return jsonMatch ? jsonMatch[0] : null;
}

function normalizeTreeGeneration(payload = {}) {
  const rawCategories = Array.isArray(payload.categories) ? payload.categories.slice(0, 5) : [];
  const usedIds = new Set();
  const categories = rawCategories.map((category, index) => {
    const baseId = String(category?.id || `cat-${index + 1}`)
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9_-]+/g, '-')
      .replace(/^-+|-+$/g, '') || `cat-${index + 1}`;
    let id = baseId;
    let suffix = 1;
    while (usedIds.has(id)) {
      suffix += 1;
      id = `${baseId}-${suffix}`;
    }
    usedIds.add(id);
    return {
      id,
      label: String(category?.label || `分类${index + 1}`).trim() || `分类${index + 1}`,
      color: /^#[0-9a-f]{6}$/i.test(String(category?.color || '').trim())
        ? String(category.color).trim()
        : CATEGORY_COLORS[index % CATEGORY_COLORS.length],
    };
  });

  const categoryIds = new Set(categories.map(category => category.id));
  const rowCounters = Object.fromEntries(categories.map(category => [category.id, 0]));
  const nodes = (Array.isArray(payload.nodes) ? payload.nodes : [])
    .slice(0, 14)
    .map((node, index) => {
      const label = String(node?.label || '').trim();
      if (!label) return null;
      const fallbackCategoryId = categories[index % Math.max(categories.length, 1)]?.id || 'other';
      const categoryId = categoryIds.has(node?.category) ? node.category : fallbackCategoryId;
      const row = rowCounters[categoryId] || 0;
      rowCounters[categoryId] = row + 1;
      return {
        id: `tree-${Date.now().toString(36)}-${index}`,
        label,
        category: categoryId,
        row,
        status: ['open', 'in-progress', 'dev', 'done'].includes(node?.status) ? node.status : 'open',
        priority: ['critical', 'high', 'medium', 'low'].includes(node?.priority) ? node.priority : 'medium',
        desc: String(node?.desc || label).trim() || label,
      };
    })
    .filter(Boolean);

  return { categories, nodes };
}

function buildGeneratedTreePreview(summary, nodes, categories) {
  return {
    summary: normalizeSummaryData(summary),
    categories: (categories || []).map(category => ({
      id: category.id,
      label: category.label,
      color: category.color,
    })),
    nodes: (nodes || []).map(node => ({
      id: node.id,
      label: node.label,
      category: node.category,
      priority: node.priority || 'medium',
    })),
  };
}

function clearGeneratedTreeArtifacts(yAgentState) {
  if (!yAgentState) return;
  yAgentState.set('lastStructuredPrompt', '');
  yAgentState.set('structuredPromptAt', 0);
  yAgentState.set('generatedTreePreview', '');
  yAgentState.set('generatedTreeAt', 0);
  yAgentState.set('generatedTreeBy', '');
}

function saveGeneratedTreeArtifacts(yAgentState, { summary, nodes, categories, prompt, by }) {
  if (!yAgentState) return;
  yAgentState.set('lastStructuredPrompt', prompt);
  yAgentState.set('structuredPromptAt', Date.now());
  yAgentState.set('generatedTreePreview', JSON.stringify(buildGeneratedTreePreview(summary, nodes, categories)));
  yAgentState.set('generatedTreeAt', Date.now());
  yAgentState.set('generatedTreeBy', by || '');
}

      });
    });

    pushChat({ name: '系统', text: `[本地快速拆分] 共生成 ${tasks.length} 个任务模块。\n\n${tasks.map((t,i)=>`${i+1}. ${t.title}`).join('\n')}`, color: 4, kind: 'text' });
    setIsLocalSplitting(false);
  }, [yjsRef, pushChat, nodes, categories]);

  const handleBrainSplit = useCallback(() => {
    const yAgentState = yjsRef.current?.yAgentState;
    const yAgentTasks = yjsRef.current?.yAgentTasks;
    const yAssembledHtml = yjsRef.current?.yAssembledHtml;
    if (!yAgentState || !yAgentTasks || !yAssembledHtml) return;

    let structuredPrompt = yAgentState.get('lastStructuredPrompt') || '';
    if (!structuredPrompt.trim()) {
      // Build from available context
      const parts = [];
      if (summary?.concept) parts.push('游戏概念：' + summary.concept);
      if (summary?.coreMechanics) parts.push('核心玩法：' + summary.coreMechanics);
      if (nodes?.length > 0) parts.push('功能模块：' + nodes.slice(0,10).map(n=>n.label).join('、'));
      if (parts.length === 0) { showToast('请先在讨论室讨论，或点击 AI 整理生成摘要', 'warn'); return; }
      structuredPrompt = parts.join('\n');
    }
    if (yAgentState.get('brainBusy')) return;
    if (!getApiKey()) { setShowSettings(true); return; }

    yAgentState.set('brainBusy', true);
    yAgentState.set('brainStatus', 'splitting');
    setIsBrainSplitting(true);

    const sysPrompt = `你是一个HTML5游戏/网页架构师（Brain Agent）。你收到了一个结构化的开发需求，你需要：

1. 将需求拆分成 3-6 个独立的任务模块
2. 每个任务对应一个可独立工作的代码片段
3. 最终所有片段会被组装成一个完整的HTML文件

你必须以JSON格式返回，格式如下：
{
  "tasks": [
    {
      "id": "task-xxx",
      "title": "任务标题",
      "prompt": "这个任务的详细开发说明",
      "code": "这个任务的代码片段（用 <!-- FRAGMENT:task-xxx START --> 和 <!-- FRAGMENT:task-xxx END --> 包裹）",
      "order": 0
    }
  ],
  "assembledHtml": "完整的HTML文件，包含所有片段"
}

代码规则：
- 第一个任务(order:0)必须是"基础框架"，包含<!DOCTYPE html>、<html>、<head>、基础<style>和<body>骨架
- 每个代码片段用HTML注释标记：<!-- FRAGMENT:task-id START --> ... <!-- FRAGMENT:task-id END -->
- CSS部分用 /* FRAGMENT:task-id START */ ... /* FRAGMENT:task-id END */ 标记
- JS部分用 /* FRAGMENT:task-id START */ ... /* FRAGMENT:task-id END */ 标记
- assembledHtml是所有片段按顺序组装的完整可运行HTML
- 只返回JSON，不要其他文字。用中文写title和prompt`;

    setLocalIsTyping(true);
    setLocalStreamText("[大脑 AI] 正在拆分任务...");

    callAI(
      [
        { role: 'system', content: sysPrompt },
        { role: 'user', content: `开发需求：\n\n${structuredPrompt}\n\n请拆分任务并生成代码片段：` },
      ],
      (partial) => {
        yAgentState.set('brainStatus', 'generating');
        // Show progress in chat — extract task titles as they appear
        const titleMatches = [...partial.matchAll(/"title"\s*:\s*"([^"]+)"/g)];
        if (titleMatches.length > 0) {
          const titles = titleMatches.map((m, i) => `${i+1}. ${m[1]}`).join('\n');
          setLocalStreamText(`[大脑 AI] 正在生成任务...\n\n${titles}\n\n生成中...`);
        }
      },
      (full, meta) => {
        setLocalIsTyping(false);
        setLocalStreamText("");
        yAgentState.set('brainStatus', 'assembling');
        if (meta?.truncated) {
          pushChat({ name: '大脑 AI', text: '[⚠ 输出被截断] 代码可能不完整，正在尝试修复...', color: 4, kind: 'text' });
        }
        try {
          // Extract JSON — handle markdown code fences some models wrap around JSON
          let cleaned = '';
          const fenceMatch = full.match(/```(?:json)?\s*([\s\S]*?)```/);
          if (fenceMatch) {
            const innerMatch = fenceMatch[1].match(/\{[\s\S]*\}/);
            if (innerMatch) cleaned = innerMatch[0];
          }
          if (!cleaned) {
            const jsonMatch = full.match(/\{[\s\S]*\}/);
            cleaned = jsonMatch ? jsonMatch[0] : '';
          }
          if (!cleaned) throw new Error('未找到 JSON 内容');

          // Auto-repair truncated JSON — close unclosed brackets
          let data;
          try {
            data = JSON.parse(cleaned);
          } catch (parseErr) {
            // Strategy 1: Try extracting just the tasks array (skip assembledHtml which often has unescaped code)
            let fallbackData = null;
            try {
              const tasksMatch = cleaned.match(/"tasks"\s*:\s*\[([\s\S]*?)\]\s*[,}]/);
              if (tasksMatch) {
                let tasksJson = '[' + tasksMatch[1] + ']';
                // Close any unclosed brackets
                const ob = (tasksJson.match(/\{/g)||[]).length;
                const cb = (tasksJson.match(/\}/g)||[]).length;
                if (ob > cb) tasksJson = tasksJson.replace(/,?\s*"[^"]*$/, '') + '}'.repeat(ob-cb) + ']';
                const tasks = JSON.parse(tasksJson);
                fallbackData = { tasks, assembledHtml: '' };
              }
            } catch {}

            if (!fallbackData) {
              // Strategy 2: Simple truncation repair
              let repaired = cleaned;
              // Remove trailing incomplete string values
              repaired = repaired.replace(/,\s*"[^"]*$/, '');
              repaired = repaired.replace(/:\s*"[^"]*$/, ': ""');
              const openBraces = (repaired.match(/\{/g) || []).length;
              const closeBraces = (repaired.match(/\}/g) || []).length;
              const openBrackets = (repaired.match(/\[/g) || []).length;
              const closeBrackets = (repaired.match(/\]/g) || []).length;
              if (openBrackets > closeBrackets) repaired += ']'.repeat(openBrackets - closeBrackets);
              if (openBraces > closeBraces) repaired += '}'.repeat(openBraces - closeBraces);
              try {
                fallbackData = JSON.parse(repaired);
              } catch {
                // Strategy 3: Extract individual task objects with regex
                const taskRegex = /\{\s*"id"\s*:\s*"([^"]+)"\s*,\s*"title"\s*:\s*"([^"]+)"/g;
                const extracted = [];
                let m;
                while ((m = taskRegex.exec(cleaned)) !== null) {
                  extracted.push({ id: m[1], title: m[2], prompt: '', code: '', order: extracted.length });
                }
                if (extracted.length > 0) {
                  fallbackData = { tasks: extracted, assembledHtml: '' };
                }
              }
            }

            if (fallbackData) {
              data = fallbackData;
              pushChat({ name: '大脑 AI', text: `[已自动修复 JSON 格式问题，提取到 ${data.tasks?.length || 0} 个任务]`, color: 4, kind: 'text' });
            } else {
              throw new Error(parseErr.message);
            }
          }

          const ydoc = yjsRef.current.ydoc;
          ydoc.transact(() => {
            // Clear all existing agent tasks first to prevent duplicates
            const existingKeys = [];
            yAgentTasks.forEach((val, key) => existingKeys.push(key));
            existingKeys.forEach(key => yAgentTasks.delete(key));
            // Add new tasks
            (data.tasks || []).forEach((t, i) => {
              yAgentTasks.set(t.id, JSON.stringify({
                id: t.id, title: t.title, prompt: t.prompt, code: t.code,
                status: 'pending', assignee: null, assigneeColor: 0,
                order: t.order ?? i, createdAt: Date.now(), updatedAt: Date.now(),
              }));
            });
            yAssembledHtml.set('html', data.assembledHtml || '');
            yAssembledHtml.set('updatedAt', Date.now());
            yAssembledHtml.set('version', (yAssembledHtml.get('version') || 0) + 1);
          });
          pushChat({ name: '大脑 AI', text: `[任务拆分完成] 共生成 ${data.tasks?.length || 0} 个任务模块，代码已就绪。\n\n任务列表：\n${(data.tasks||[]).map((t,i)=>`${i+1}. ${t.title}`).join('\n')}`, color: 4, kind: 'text' });
        } catch (e) {
          pushChat({ name: '大脑 AI', text: `[拆分失败] Brain Agent 返回格式错误: ${e.message}\n\n建议：简化需求后重试，或换用上下文更大的模型。`, color: 4 });
        }
        yAgentState.set('brainBusy', false);
        yAgentState.set('brainStatus', 'idle');
        setIsBrainSplitting(false);
      },
      (err) => {
        setLocalIsTyping(false);
        setLocalStreamText("");
        yAgentState.set('brainBusy', false);
        yAgentState.set('brainStatus', 'idle');
        setIsBrainSplitting(false);
        if (err === 'no-key') setShowSettings(true);
        else pushChat({ name: '大脑 AI', text: `[拆分错误] ${err}`, color: 4 });
      },
      { max_tokens: 16384, timeoutMs: 480000 }
    );
  }, [yjsRef, pushChat, summary, nodes]);

  /* --- Claim handler --- */
  const handleClaim = useCallback((taskId) => {
    claimTask(taskId, userName, myColor);
  }, [claimTask]);

  /* --- Discussion tracking handlers --- */
  const handleDiscuss = useCallback((topic) => {
    setDiscussionTopic(topic);
    // Don't mark as 'discussing' yet — wait until the user actually sends the message
  }, []);

  const handleDiscussionSent = useCallback(() => {
    if (discussionTopic) {
      setDiscussedItem(`${discussionTopic.type}-${discussionTopic.index}`, {
        status: 'discussing', by: userName, at: Date.now()
      });
    }
    setDiscussionTopic(null);
  }, [discussionTopic, setDiscussedItem]);

  const handleMarkDone = useCallback((key) => {
    setDiscussedItem(key, { status: 'done', by: userName, at: Date.now() });
  }, [setDiscussedItem]);

  // Called before navigating to workbench — writes all planning context into Yjs
  const handleBeforeEnterWorkspace = useCallback(() => {
    // Prompt is built during "生成智慧树" and stored in Yjs for the workbench.
    // Just clear the assembled HTML so app.html knows to regenerate.
    const yAssembledHtml = yjsRef.current?.yAssembledHtml;
    if (yAssembledHtml) yAssembledHtml.set('html', '');
  }, [yjsRef]);

  const summaryReady = hasSummaryContent(summary);

  return (
    <React.Fragment>
      <Header theme={theme} setTheme={setTheme} connected={connected} onSettings={() => setShowSettings(true)} users={onlineUsers}
        pendingIssuesCount={
          ((summary?.openQuestions || []).filter((_, i) => discussedItems?.[`question-${i}`]?.status !== 'done').length) +
          ((summary?.conflicts || []).filter((_, i) => discussedItems?.[`conflict-${i}`]?.status !== 'done').length)
        }
        onRefresh={handleRefreshSummary}
        nodes={nodes} categories={categories}
        onBeforeEnter={handleBeforeEnterWorkspace}
      />
      <PlanWorkspace
        chatMessages={chatMessages} pushChat={pushChat} isTyping={isTyping} streamText={streamText}
        onAskAI={handleAskAI} connected={connected}
        summary={summary} flashKey={flashKey} onRefresh={handleRefreshSummary} isRefreshing={isRefreshing} refreshingBy={refreshingBy}
        agentTasks={agentTasks} onClaim={handleClaim}
        brainBusy={agentState.brainBusy || isBrainSplitting} brainStatus={agentState.brainStatus}
        onBrainSplit={handleBrainSplit} onLocalSplit={handleLocalSplit}
        isLocalSplitting={isLocalSplitting} isBrainSplitting={isBrainSplitting} splittingBy={splittingBy}
        onGenerateWisdomTree={handleGenerateWisdomTree}
        isGeneratingTree={isGeneratingTree}
        generatingTreeBy={generatingTreeBy}
        nodes={nodes} edges={edges} categories={categories} selectedNode={selectedNode} onSelectNode={setSelectedNode}
        users={onlineUsers} saveTree={saveTree}
        summaryReady={summaryReady}
        lastStructuredPrompt={agentState.lastStructuredPrompt} structuredPromptAt={agentState.structuredPromptAt}
        generatedTreePreview={agentState.generatedTreePreview}
        generatedTreeAt={agentState.generatedTreeAt}
        generatedTreeBy={agentState.generatedTreeBy}
        discussionTopic={discussionTopic} onDiscuss={handleDiscuss} onDiscussionSent={handleDiscussionSent}
        discussedItems={discussedItems} onMarkDone={handleMarkDone}
        yjsRef={yjsRef} userName={userName} myColor={myColor}
        onBeforeEnter={handleBeforeEnterWorkspace}
      />
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} theme={theme} setTheme={setTheme} yjsRef={yjsRef} />}
      <RemoteCursors users={onlineUsers} />
    </React.Fragment>
  );
}

/* === MOUNT === */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
