<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODELAB X1 — 共创规划</title>
<meta name="description" content="CODELAB X1 多人协作游戏共创规划室 — 讨论、汇总、可视化你们的游戏创意">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* === FONT SYSTEM === */
:root{
  --font-head:'Space Grotesk','Noto Sans SC',system-ui,sans-serif;
  --font-ui:'Inter','Noto Sans SC',system-ui,sans-serif;
  --font-code:'JetBrains Mono','SF Mono','Fira Code',monospace;
  --font-size-xs:9px;--font-size-sm:11px;--font-size-base:13px;--font-size-lg:16px;--font-size-xl:22px;
  --hdr1:48px;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(0,0,.2,1);
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;--radius-full:999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.03);
  --shadow-xl:0 16px 48px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
}

[data-theme="dark"]{
  --bg:#0f1117;--bg2:#161920;--bg3:#1c2029;--bg4:#252932;
  --text:#e2e8f0;--textd:#64748b;--textm:#94a3b8;
  --accent:#60a5fa;--accent2:#818cf8;
  --green:#4ade80;--pink:#fb7185;--gold:#fbbf24;
  --orange:#fb923c;--purple:#a78bfa;
  --accent-bg:rgba(96,165,250,.08);--green-bg:rgba(74,222,128,.08);
  --pink-bg:rgba(251,113,133,.08);--gold-bg:rgba(251,191,36,.08);--purple-bg:rgba(167,139,250,.08);
  --border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.14);
  --shadow:0 1px 3px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.15);
  --nav-bg:rgba(15,17,23,.82);
  --scrollbar:rgba(255,255,255,.1);
  color-scheme:dark;
}

[data-theme="light"]{
  --bg:#f8fafb;--bg2:#ffffff;--bg3:#f1f3f7;--bg4:#e8ebf0;
  --text:#1a1d24;--textd:#9ca5b4;--textm:#5f6b7a;
  --accent:#2563eb;--accent2:#6366f1;
  --green:#16a34a;--pink:#e11d48;--gold:#d97706;
  --orange:#ea580c;--purple:#7c3aed;
  --accent-bg:rgba(37,99,235,.06);--green-bg:rgba(22,163,74,.06);
  --pink-bg:rgba(225,29,72,.06);--gold-bg:rgba(217,119,6,.06);--purple-bg:rgba(124,58,237,.06);
  --border:#e5e8ed;--border-h:#d0d5dd;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --nav-bg:rgba(255,255,255,.82);
  --scrollbar:#d1d5db;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
#root{display:flex;flex-direction:column;height:100%}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::selection{background:var(--accent-bg);color:var(--accent)}

/* === HEADER === */
.plan-header{
  height:var(--hdr1);background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;z-index:200;flex-shrink:0;
}
.logo{font-family:var(--font-head);font-size:14px;font-weight:900;letter-spacing:4px;color:var(--accent);white-space:nowrap;flex-shrink:0;cursor:pointer;text-decoration:none}.logo em{color:var(--green);font-style:normal}
.vsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.room-chip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0}.room-chip:hover{border-color:var(--accent2);background:var(--accent-bg)}
.room-lbl{font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:2px}.room-val{font-family:var(--font-code);font-size:12px;color:var(--accent);font-weight:700;letter-spacing:3px}
.hdr-sp{flex:1}
.hdr-center{font-family:var(--font-head);font-size:13px;font-weight:600;color:var(--textm);letter-spacing:.5px;white-space:nowrap}
.conn-status{display:flex;align-items:center;gap:5px;font-family:var(--font-code);font-size:9px;color:var(--textd);flex-shrink:0}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--textd);transition:background .3s}
.conn-dot.on{background:var(--green)}.conn-dot.wait{background:var(--orange);animation:pulse 1.5s infinite}
.hdr-btn{height:30px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s var(--ease);flex-shrink:0;font-family:var(--font-code);font-size:10px;letter-spacing:.5px;text-decoration:none}
.hdr-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.hdr-btn-skip{border-color:var(--accent2);color:var(--accent)}
.hdr-btn-skip:hover{background:var(--accent);color:#fff}

/* === MAIN LAYOUT === */
.plan-main{position:relative;flex:1;overflow:hidden;background:var(--bg);display:flex}

/* === PLAN FIXED WINDOWS (matching app.html .fw style) === */
.pfw{position:absolute;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.pfw-bar{height:34px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;user-select:none;border-radius:var(--radius-md) var(--radius-md) 0 0}
.pfw-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pfw-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfw-body{flex:1;overflow:hidden;position:relative;min-height:0}

/* === CHAT PANEL (inside pfw) === */
.chat-panel{
  display:flex;flex-direction:column;height:100%;background:var(--bg);
}
.chat-header{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:6px;flex-shrink:0}
.chat-header-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chat-header-title{font-family:var(--font-code);font-size:10px;letter-spacing:1.5px;color:var(--textm);font-weight:600}
.chat-header-count{font-family:var(--font-code);font-size:9px;color:var(--textd)}
.chat-header-sync{font-family:var(--font-code);font-size:9px;color:var(--green);margin-left:auto;display:flex;align-items:center;gap:4px}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.chat-input-area{padding:10px 12px 12px;border-top:1px solid var(--border);background:var(--bg)}
.chat-input-row{display:flex;gap:10px;align-items:flex-end}
.chat-input{
  flex:1;min-height:40px;max-height:108px;resize:none;
  padding:10px 12px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:11px;font-family:var(--font-ui);
  line-height:1.6;outline:none;transition:all .2s var(--ease);
}
.chat-input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.chat-input::placeholder{color:var(--textd)}
.chat-send{
  height:40px;padding:0 16px;border-radius:10px;
  border:1px solid var(--green);background:var(--green-bg);color:var(--green);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-family:var(--font-code);font-weight:700;
  transition:all .15s var(--ease);flex-shrink:0;
}
.chat-send:hover{background:var(--green);color:#fff}
.chat-send:active{transform:scale(.96)}
.chat-send:disabled{opacity:.3;cursor:default;transform:none;filter:none}
.chat-toolbar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chat-tool{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--textm);font-size:10px;font-family:var(--font-code);cursor:pointer;transition:all .15s var(--ease);white-space:nowrap;flex-shrink:0}
.chat-tool:hover{border-color:var(--green);color:var(--green)}
.chat-tool.active{border-color:var(--green);color:var(--green);background:var(--green-bg)}

/* === EMOJI PICKER POPUP === */
.emoji-popup{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);padding:8px;width:280px;max-height:260px;overflow-y:auto;
  animation:popUp .15s var(--ease-out);
}
@keyframes popUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.emoji-popup-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.emoji-popup-btn{
  display:flex;align-items:center;justify-content:center;
  padding:6px;border-radius:8px;border:none;background:transparent;cursor:pointer;
  text-align:center;transition:all .1s var(--ease);
}
.emoji-popup-btn:hover{background:var(--bg3);transform:scale(1.15)}
.emoji-popup-char{font-size:24px;line-height:1;flex-shrink:0}
.emoji-popup-char img{width:28px;height:28px;object-fit:contain}

/* === MENTION PICKER POPUP === */
.mention-popup{
  position:absolute;bottom:100%;left:0;margin-bottom:6px;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);padding:4px 0;z-index:50;min-width:180px;
  animation:popUp .15s var(--ease-out);
}
.mention-popup-title{padding:6px 12px;font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:1px;text-transform:uppercase}
.mention-popup-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  font-size:11px;color:var(--text);font-family:var(--font-ui);transition:all .15s var(--ease);
  border-radius:10px;margin:0 4px;
}
.mention-popup-item:hover{border-color:var(--accent2);background:var(--accent-bg)}
.mention-popup-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mention-popup-name{font-weight:500}
.mention-popup-me{font-size:10px;color:var(--textd);margin-left:2px}
.mention-popup-item-ai{color:var(--purple);font-weight:600}

/* === MESSAGE BUBBLES === */
.msg{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:flex-start;animation:msgIn .3s var(--ease-out)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-av{
  width:28px;height:28px;min-width:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-family:var(--font-code);
  background:var(--bg2);border:1px solid var(--border);color:var(--textm);
  flex-shrink:0;padding-top:2px;
}
.msg-av-ai{
  background:linear-gradient(135deg,#7c3aed,#6366f1);
  border-color:transparent;color:#fff;font-size:12px;
}
.msg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.msg-name{font-size:9px;color:var(--textd);padding:0 4px;font-family:var(--font-code);display:flex;align-items:center;gap:6px}
.msg-name-ai{color:var(--purple)}
.msg-time{font-size:9px;color:var(--textd);font-weight:400}
.msg-bub{
  display:inline-block;max-width:100%;padding:10px 12px;font-size:11px;line-height:1.65;
  word-break:break-word;white-space:pre-wrap;font-family:var(--font-ui);
}
.msg-bub-player{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:12px}
.msg-bub-ai{background:var(--purple-bg);border:1px solid rgba(167,139,250,.15);color:var(--text);border-radius:12px}
.msg-bub strong{font-weight:600;color:var(--accent)}

/* === TYPING INDICATOR === */
.typing-indicator{display:flex;gap:8px;animation:msgIn .3s var(--ease-out)}
.typing-dots{display:flex;gap:5px;padding:14px 18px;border-radius:var(--radius-md);background:var(--purple-bg);border:1px solid rgba(167,139,250,.15)}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:dotB 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes dotB{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}

/* === RIGHT AREA (no longer needed — using absolute positioning) === */

/* === TOP PANELS === */

/* === SUMMARY DASHBOARD === */
.summary-panel{
  height:100%;overflow-y:auto;background:var(--bg);
}
.summary-inner{padding:14px 16px}
.summary-hdr{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.summary-hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:pulse 2.5s infinite}
.summary-hdr-title{font-family:var(--font-code);font-size:10px;letter-spacing:1.5px;color:var(--textm);font-weight:600;text-transform:uppercase}
.summary-hdr-tag{font-family:var(--font-code);font-size:9px;color:var(--textd);margin-left:auto}
.summary-hdr-btn{
  margin-left:6px;height:22px;padding:0 8px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg3);color:var(--textd);
  cursor:pointer;font-family:var(--font-code);font-size:9px;transition:all .15s var(--ease);
}
.summary-hdr-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.summary-hdr-btn:disabled{opacity:.4;cursor:default}
/* STATS ROW */
.summary-stats{display:flex;gap:8px;margin-bottom:12px}
.summary-stat{flex:1;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);text-align:center}
.summary-stat-num{font-family:var(--font-code);font-size:18px;font-weight:800;line-height:1.2}
.summary-stat-label{font-family:var(--font-code);font-size:8px;letter-spacing:1.5px;color:var(--textd);text-transform:uppercase;margin-top:2px}
/* PROGRESS BAR */
.summary-progress{height:4px;border-radius:2px;background:var(--bg4);margin-bottom:12px;overflow:hidden}
.summary-progress-fill{height:100%;border-radius:2px;transition:width .6s var(--ease)}
/* GRID */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary-card{
  padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg2);
  transition:all .2s var(--ease);position:relative;overflow:hidden;
}
.summary-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:2px 0 0 2px}
.summary-card:hover{border-color:var(--border-h);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.summary-card-full{grid-column:1/-1}
.summary-card-label{font-family:var(--font-code);font-size:9px;font-weight:600;color:var(--textd);margin-bottom:4px;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:1px}
.sc-icon{font-size:11px;line-height:1}
.summary-card-value{font-size:11px;color:var(--text);line-height:1.65;font-family:var(--font-ui)}
.summary-list{list-style:none;padding:0}
.summary-list li{font-size:10px;color:var(--text);padding:3px 0;position:relative;padding-left:12px;line-height:1.5;font-family:var(--font-ui)}
.summary-list li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%}
.sl-green li::before{background:var(--green)}
.sl-orange li::before{background:var(--orange)}
.sl-pink li::before{background:var(--pink)}
.sl-accent li::before{background:var(--accent)}
/* card accent bars */
.sc-concept::before{background:var(--accent)}
.sc-core::before{background:var(--green)}
.sc-target::before{background:var(--pink)}
.sc-consensus::before{background:var(--green)}
.sc-questions::before{background:var(--orange)}
.sc-conflict::before{background:var(--pink)}
.sc-next::before{background:var(--accent)}

@keyframes summaryFlash{0%{border-color:var(--accent2);box-shadow:0 0 12px var(--accent-bg)}100%{border-color:var(--border);box-shadow:none}}
.summary-card.flash{animation:summaryFlash .8s var(--ease)}

.summary-loading{display:flex;align-items:center;gap:8px;padding:20px;color:var(--textd);font-size:11px;font-family:var(--font-code)}
.summary-loading .typing-dot{width:5px;height:5px}
.summary-empty{padding:30px 20px;text-align:center;color:var(--textd);font-size:11px;font-family:var(--font-code);line-height:1.8}

/* === TASK PANEL === */
.task-panel{
  height:100%;overflow-y:auto;background:var(--bg2);
}
.task-inner{padding:16px 20px}
.task-hdr{display:flex;align-items:center;gap:6px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.task-hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.task-hdr-title{font-family:var(--font-code);font-size:10px;letter-spacing:1.5px;color:var(--textm);font-weight:600;text-transform:uppercase}
.task-hdr-count{font-family:var(--font-code);font-size:9px;color:var(--textd);margin-left:auto}
.task-hdr-btn{
  margin-left:6px;height:22px;padding:0 8px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg3);color:var(--textd);
  cursor:pointer;font-family:var(--font-code);font-size:9px;transition:all .15s var(--ease);
}
.task-hdr-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.task-hdr-btn:disabled{opacity:.4;cursor:default}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{
  display:flex;align-items:flex-start;gap:8px;padding:8px 10px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg3);cursor:pointer;transition:all .15s var(--ease);
  animation:msgIn .3s var(--ease-out);
}
.task-item:hover{border-color:var(--border-h)}
.task-check{
  width:18px;height:18px;min-width:18px;border-radius:4px;
  border:2px solid var(--border);display:flex;align-items:center;
  justify-content:center;margin-top:1px;transition:all .15s var(--ease);
  font-size:10px;color:transparent;
}
.task-check.done{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.task-text{font-size:11px;line-height:1.5;color:var(--text);font-family:var(--font-ui);flex:1}
.task-text.done{text-decoration:line-through;color:var(--textd)}
.task-priority{
  font-family:var(--font-code);font-size:8px;padding:1px 5px;
  border-radius:var(--radius-full);font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:2px;
}
.task-input-row{display:flex;gap:6px;margin-top:10px}
.task-input{
  flex:1;height:30px;padding:0 10px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:11px;font-family:var(--font-ui);outline:none;
  transition:all .2s var(--ease);
}
.task-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.task-input::placeholder{color:var(--textd)}
.task-add-btn{
  height:30px;padding:0 10px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);background:var(--accent-bg);
  color:var(--accent);cursor:pointer;font-family:var(--font-code);
  font-size:10px;font-weight:600;transition:all .15s var(--ease);
}
.task-add-btn:hover{background:var(--accent);color:#fff}
.task-empty{padding:16px;text-align:center;color:var(--textd);font-size:11px;font-family:var(--font-code);line-height:1.8}

/* === AGENT TASK PANEL === */
.agent-task-panel .task-hdr-dot{background:var(--purple)}
.agent-task-actions{display:flex;gap:6px;margin-bottom:10px}
.agent-action-btn{
  flex:1;height:28px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg3);color:var(--textd);
  cursor:pointer;font-family:var(--font-code);font-size:9px;font-weight:600;
  transition:all .15s var(--ease);
}
.agent-action-btn:hover:not(:disabled){border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.agent-action-btn:disabled{opacity:.4;cursor:default}
.agent-action-btn-primary{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.agent-action-btn-primary:hover:not(:disabled){background:var(--purple);color:#fff}
.agent-task-item{align-items:center}
.agent-task-dot{width:8px;height:8px;min-width:8px;border-radius:50%;flex-shrink:0}
.agent-task-info{flex:1;min-width:0}
.agent-task-title{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-task-prompt-preview{font-family:var(--font-code);font-size:9px;color:var(--textd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.agent-task-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.agent-task-assignee{font-family:var(--font-code);font-size:9px;color:var(--orange);font-weight:600}
.agent-task-claim-btn{
  height:22px;padding:0 8px;border:1px solid var(--orange);border-radius:var(--radius-xs);
  background:rgba(251,191,36,.08);color:var(--orange);cursor:pointer;
  font-family:var(--font-code);font-size:9px;font-weight:600;transition:all .15s;
}
.agent-task-claim-btn:hover{background:var(--orange);color:#fff}
.agent-task-goto{
  font-family:var(--font-code);font-size:9px;color:var(--accent);text-decoration:none;
  padding:2px 6px;border:1px solid var(--accent);border-radius:var(--radius-xs);
  transition:all .15s;white-space:nowrap;
}
.agent-task-goto:hover{background:var(--accent);color:#fff}
.chat-tool-primary{border-color:var(--purple)!important;color:var(--purple)!important;font-weight:700}
.chat-tool-primary:hover{background:var(--purple-bg)!important}
.chat-tool-primary:disabled{opacity:.4}

/* === WISDOM TREE === */
.tree-panel{height:100%;overflow:hidden;position:relative;background:var(--bg)}
.tree-header{
  position:absolute;top:0;left:0;right:0;
  height:36px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:6px;z-index:10;
}
.tree-header-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.tree-header-title{font-family:var(--font-code);font-size:10px;letter-spacing:1.5px;color:var(--textm);font-weight:600;text-transform:uppercase}
.tree-header-sub{font-family:var(--font-code);font-size:9px;color:var(--textd)}
.tree-legend{display:flex;gap:8px;align-items:center;margin-left:auto}
.legend-item{display:flex;align-items:center;gap:3px;font-family:var(--font-code);font-size:9px;color:var(--textd)}
.legend-dot{width:6px;height:6px;border-radius:50%}


/* === NODE DETAIL SIDEBAR (right side) === */
.node-sidebar{
  position:absolute;top:36px;right:0;bottom:0;width:320px;
  background:var(--bg2);border-left:1px solid var(--border);
  box-shadow:-4px 0 20px rgba(0,0,0,.08);z-index:20;
  display:flex;flex-direction:column;
  animation:sidebarIn .25s var(--ease-out);
}
@keyframes sidebarIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.node-sidebar-header{
  height:38px;display:flex;align-items:center;padding:0 14px;gap:8px;
  border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0;
}
.node-sidebar-header-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--textm);font-weight:600;text-transform:uppercase;flex:1}
.node-sidebar-close{
  width:24px;height:24px;border-radius:var(--radius-xs);border:1px solid var(--border);
  background:var(--bg3);color:var(--textd);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:12px;transition:all .15s var(--ease);flex-shrink:0;
}
.node-sidebar-close:hover{border-color:var(--pink);color:var(--pink);background:var(--pink-bg)}
.node-sidebar-body{flex:0 0 auto;overflow-y:auto;padding:16px;max-height:45%}
.node-sidebar-title{font-family:var(--font-head);font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;line-height:1.4}
.node-sidebar-desc{font-size:11px;color:var(--textm);line-height:1.7;margin-bottom:14px;font-family:var(--font-ui)}
.node-sidebar-section{font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
.node-sidebar-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.node-sidebar-tag{font-family:var(--font-code);font-size:9px;padding:3px 10px;border-radius:var(--radius-full);font-weight:600;border:1px solid}
.node-sidebar-actions{padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:8px}

/* === TASK CHAT (inside node sidebar) === */
.node-task-chat{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--border)}
.ntc-header{height:30px;background:var(--bg3);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.ntc-header-title{font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;color:var(--purple);font-weight:600;text-transform:uppercase;flex:1}
.ntc-busy-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite;flex-shrink:0}
.ntc-msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.ntc-msg{display:flex;gap:6px;align-items:flex-start}
.ntc-msg-me{flex-direction:row-reverse}
.ntc-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;border:1px solid}
.ntc-bub{max-width:85%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font-size:11px;line-height:1.55;color:var(--text);font-family:var(--font-ui);white-space:pre-wrap;word-break:break-word}
.ntc-msg-me .ntc-bub{background:var(--accent-bg);border-color:var(--accent);color:var(--text)}
.ntc-empty{font-family:var(--font-code);font-size:9px;color:var(--textd);text-align:center;padding:16px 8px;line-height:1.7}
.ntc-bar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.ntc-inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text);font-size:11px;font-family:var(--font-ui);resize:none;line-height:1.4;max-height:60px;min-height:28px}
.ntc-inp:focus{outline:none;border-color:var(--purple)}
.ntc-send{height:28px;padding:0 10px;border-radius:var(--radius-sm);border:1px solid var(--purple);background:var(--purple-bg);color:var(--purple);cursor:pointer;font-family:var(--font-code);font-size:9px;font-weight:600;letter-spacing:.5px;transition:all .15s var(--ease);flex-shrink:0;white-space:nowrap}
.ntc-send:hover:not(:disabled){background:var(--purple);color:#fff}
.ntc-send:disabled{opacity:.4;cursor:not-allowed}
.node-sidebar-btn{
  flex:1;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg3);
  font-size:11px;font-weight:500;cursor:pointer;
  font-family:var(--font-code);color:var(--textd);transition:all .15s var(--ease);
}
.node-sidebar-btn:hover{border-color:var(--textm);color:var(--text)}
.node-sidebar-btn-go{background:var(--green);color:#020a06;border-color:var(--green);font-weight:700}
.node-sidebar-btn-go:hover{filter:brightness(1.08);box-shadow:var(--shadow-md)}

/* === SUMMARY SUB-PANELS (tabbed inside summary area) === */
.summary-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0}
.summary-tab{
  flex:1;padding:8px 6px;text-align:center;
  font-family:var(--font-code);font-size:9px;letter-spacing:.5px;font-weight:600;
  color:var(--textd);cursor:pointer;transition:all .15s var(--ease);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.summary-tab:hover{color:var(--textm);background:var(--accent-bg)}
.summary-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-bg)}
.summary-tab-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:14px;padding:0 4px;border-radius:7px;
  font-size:8px;font-weight:700;margin-left:4px;
}
.summary-tab-body{flex:1;overflow-y:auto}

/* === PROMPT PREVIEW PANEL === */
.prompt-preview{height:100%;display:flex;flex-direction:column;background:var(--bg2)}
.prompt-preview__body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;min-height:0}
.prompt-preview__body--center{justify-content:center}
.prompt-preview__shell{
  display:flex;flex-direction:column;gap:10px;min-height:100%;
}
.prompt-preview__shell--guide{
  min-height:auto;
}
.prompt-preview__eyebrow{
  font-family:var(--font-code);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--textd);padding-bottom:6px;border-bottom:1px solid var(--border);
}
.prompt-preview__title-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.prompt-preview__title-main{
  display:flex;align-items:center;gap:8px;min-width:0;
}
.prompt-preview__title{
  font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text);line-height:1.2;
}
.prompt-preview__title-dot{
  width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0;
}
.prompt-preview__badge{
  flex-shrink:0;font-family:var(--font-code);font-size:9px;font-weight:600;letter-spacing:.5px;
  color:var(--textd);
}
.prompt-preview__copy{
  font-size:11px;color:var(--textm);line-height:1.7;
}
.prompt-preview__guide{
  display:flex;flex-direction:column;gap:0;margin-top:2px;border-top:1px solid var(--border);
}
.prompt-preview__guide-line{
  display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border);
}
.prompt-preview__guide-line:first-child{border-top:none;padding-top:0}
.prompt-preview__guide-index{
  width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:var(--font-code);font-size:10px;font-weight:700;background:transparent;color:var(--textd);
  border:1px solid var(--border);
}
.prompt-preview__guide-line.is-active .prompt-preview__guide-index{
  background:transparent;color:var(--accent);border-color:var(--accent);
}
.prompt-preview__guide-text{
  font-size:11px;line-height:1.8;color:var(--text);
}
.prompt-preview__guide-note{
  display:block;font-size:10px;color:var(--textd);
}
.prompt-preview__loading-dots{display:flex;gap:5px;margin-bottom:10px}
.prompt-preview__loading-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--purple);animation:pulse 1.1s infinite;
}
.prompt-preview__loading-dots span:nth-child(2){animation-delay:.15s}
.prompt-preview__loading-dots span:nth-child(3){animation-delay:.3s}
.prompt-preview__meta-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:2px;border-top:1px solid var(--border);
}
.prompt-preview__meta{
  font-family:var(--font-code);font-size:9px;color:var(--textd);letter-spacing:.4px;
}
.prompt-preview__prompt{
  flex:1;min-height:0;overflow:auto;padding-top:10px;border-top:1px solid var(--border);
}
.prompt-preview__pre{
  margin:0;padding:0;font-family:var(--font-code);font-size:10px;line-height:1.85;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
}

/* Conflict resolution card */
.conflict-card{padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);margin-bottom:8px}
.conflict-card-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.conflict-card-desc{font-size:10px;color:var(--textm);line-height:1.5;margin-bottom:8px}
.conflict-card-actions{display:flex;gap:6px}
.conflict-resolve-btn{
  height:24px;padding:0 10px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg3);
  color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:9px;
  transition:all .15s var(--ease);
}
.conflict-resolve-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.conflict-resolve-btn-discuss{border-color:var(--orange);color:var(--orange)}
.conflict-resolve-btn-discuss:hover{background:var(--gold-bg)}
.conflict-resolve-btn-done{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.conflict-resolve-btn-done:hover{background:var(--green);color:#020a06}

/* === API SETTINGS TOAST === */
.settings-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s var(--ease);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settings-modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;width:500px;max-width:92vw;box-shadow:var(--shadow-xl);max-height:85vh;overflow-y:auto;
}
.settings-title{font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px}
.settings-group{margin-bottom:12px}
.settings-label{font-family:var(--font-code);font-size:10px;color:var(--textd);margin-bottom:4px;letter-spacing:.5px}
.settings-input{
  width:100%;height:34px;padding:0 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:12px;font-family:var(--font-code);outline:none;
  transition:all .2s var(--ease);
}
.settings-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.settings-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.settings-btn{
  height:32px;padding:0 16px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg3);
  font-size:11px;font-weight:600;cursor:pointer;
  font-family:var(--font-code);color:var(--textd);transition:all .15s var(--ease);
}
.settings-btn:hover{border-color:var(--textm);color:var(--text)}
.settings-btn-save{background:var(--accent);color:#fff;border-color:var(--accent)}
.settings-btn-save:hover{filter:brightness(1.08)}
.settings-section{font-family:var(--font-code);font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--border);margin-top:8px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.settings-section::after{content:'▾';font-size:10px;transition:transform .2s var(--ease);transform:rotate(-90deg)}
.settings-section.open::after{transform:rotate(0deg)}
.settings-divider{height:1px;background:var(--border);margin:8px 0}
.theme-btn-row{display:flex;gap:6px;margin-bottom:6px}
.theme-btn{flex:1;padding:8px 6px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--textm);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;transition:all .15s var(--ease);text-align:center}
.theme-btn:hover{border-color:var(--accent2);color:var(--text)}
.theme-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.ai-preset-btn{padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;transition:all .15s var(--ease)}
.ai-preset-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.ai-preset-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
/* PLAYER BALL */
.hdr-players-ball{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s var(--ease);position:relative;overflow:hidden}
.hdr-players-ball:hover{filter:brightness(1.15);box-shadow:0 0 0 3px var(--accent-bg)}
.hdr-players-ball.has-avatar{background:none;overflow:visible}
.hdr-players-ball.has-avatar svg{width:28px;height:28px;border-radius:50%}
.ball-count{position:absolute;bottom:-3px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px;font-family:var(--font-code)}
.players-popover{position:absolute;top:calc(var(--hdr1) - 4px);right:auto;min-width:180px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:8px 0;z-index:200;display:none}
.players-popover.open{display:block}
.players-popover-item{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:var(--font-size-base);color:var(--text);white-space:nowrap}
.players-popover-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.players-popover-av{width:24px;height:24px;border-radius:50%;flex-shrink:0;overflow:hidden}
.players-popover-av svg{width:100%;height:100%;display:block}
.players-popover-name{font-weight:500}
.players-popover-me{color:var(--textd);font-size:var(--font-size-sm);margin-left:4px}
/* NAV PILL */
.nav-pill{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-full);padding:2px;gap:2px;flex-shrink:0}
.nav-pill-item{padding:4px 14px;border-radius:var(--radius-full);font-family:var(--font-code);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--textd);cursor:pointer;transition:all .2s var(--ease);text-decoration:none;white-space:nowrap}
.nav-pill-item:hover{color:var(--textm)}
.nav-pill-item.active{background:var(--accent);color:#fff}
/* SKIP BTN */
.skip-btn{height:30px;padding:0 16px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#020a06;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.5px;transition:all .15s var(--ease);flex-shrink:0;text-decoration:none}
.skip-btn:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(0,0,0,.06)}
/* === SETTINGS EXTRAS === */
.settings-desc{font-size:10px;color:var(--textd);line-height:1.5;font-family:var(--font-code)}
.color-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s var(--ease)}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.emoji-pick{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;transition:all .15s var(--ease)}
.emoji-pick svg{width:100%;height:100%;border-radius:50%}
.emoji-pick:hover{border-color:var(--accent2);transform:scale(1.1)}
.emoji-pick.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.cursor-style-btn{flex:1;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;text-align:center;transition:all .15s var(--ease)}
.cursor-style-btn:hover{border-color:var(--accent2);color:var(--accent)}
.cursor-style-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.settings-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.settings-toggle input{display:none}
.toggle-track{width:36px;height:20px;background:var(--bg4);border:1px solid var(--border);border-radius:10px;position:relative;transition:all .2s var(--ease);flex-shrink:0}
.toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--textd);transition:all .2s var(--ease)}
.settings-toggle input:checked+.toggle-track{background:var(--accent-bg);border-color:var(--accent2)}

.shortcuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}

.rc-label{position:absolute;left:12px;top:8px;padding:2px 6px;border-radius:3px;font-family:var(--font-code);font-size:9px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}

.hdr-players-stack{display:flex;align-items:center;cursor:pointer;flex-shrink:0;padding:2px 4px;border-radius:var(--radius-full);transition:all .2s var(--ease)}

.av-bubble{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-family:var(--font-code);font-size:10px;font-weight:700}

.av-bubble svg{width:100%;height:100%;display:block;border-radius:50%}

.av-bubble-letter{background:var(--bg4);color:var(--textm)}
.av-bubble-custom img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-upload-area{display:flex;align-items:center;gap:8px;margin-top:6px}
.avatar-upload-btn{padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--textd);cursor:pointer;font-family:var(--font-code);font-size:10px;transition:all .15s var(--ease)}
.avatar-upload-btn:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-bg)}
.avatar-preview{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid var(--accent)}

.tree-lane{display:flex;align-items:flex-start;gap:0;min-height:44px}
.tree-lane-hdr{
  width:120px;min-width:120px;flex-shrink:0;
  padding:4px 6px 4px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;

.tree-lane-count{font-size:9px;opacity:.5;font-weight:400}
.tree-lane-nodes{

.tree-chip.dragging{opacity:.35;pointer-events:none}

/* === LAN NETWORK INFO === */
let lanEntryBase = '';
const networkInfoPromise = fetch('/api/network', {cache:'no-store'}).then(r=>r.json()).then(data=>{
  if(Array.isArray(data?.lanAddresses)&&data.lanAddresses.length>0&&data?.port){
    lanEntryBase=`${location.protocol}//${data.lanAddresses[0]}:${data.port}`;
  }else if(data?.preferredBase){
    lanEntryBase=data.preferredBase;
  }
}).catch(()=>{});

async function copyLanLink(){
  await networkInfoPromise;
  const base=lanEntryBase||location.origin;
  const url=`${base}/plan?room=${roomId}&name=`;
  navigator.clipboard.writeText(url).catch(()=>{});
  return true;
}

/* === TOAST UTILITY === */
function showToast(msg, type) {
  const el = document.createElement('div');
  const colors = { warn: 'var(--orange)', error: 'var(--pink)', success: 'var(--green)' };
  const color = colors[type] || 'var(--accent)';
  Object.assign(el.style, {
    position:'fixed', bottom:'24px', left:'50%', transform:'translateX(-50%) translateY(10px)',
    padding:'8px 18px', borderRadius:'8px', fontSize:'12px', fontFamily:'var(--font-ui)',
    background:'var(--bg3)', color:color, border:'1px solid ' + color,
    boxShadow:'0 4px 16px rgba(0,0,0,.18)', zIndex:'99999', opacity:'0',
    transition:'opacity .25s, transform .25s', pointerEvents:'none', whiteSpace:'nowrap'
  });
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)'; });
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(10px)'; setTimeout(() => el.remove(), 300); }, 2200);
}

/* === THEME === */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const saved = localStorage.getItem("codelab_theme");
    return saved === "light" ? "light" : saved === "auto" ? "auto" : "dark";
  });
  useEffect(() => {
    let actual = theme;
    if (theme === 'auto') actual = window.matchMedia?.('(prefers-color-scheme:light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute("data-theme", actual);
    localStorage.setItem("codelab_theme", theme);
  }, [theme]);
  const setT = useCallback((t) => setTheme(t), []);
  return [theme, setT];
}

/* === Yjs HOOK === */
function useYjs(roomId) {
  const [connected, setConnected] = useState(false);
  const yjsRef = useRef({ ydoc: null, provider: null, yChat: null, yTasks: null, yAgentTasks: null, yTaskChats: null, yAssembledHtml: null, yAgentState: null, ySummary: null, yTree: null });

  useEffect(() => {
    const Y = window.__Y;
    const WebsocketProvider = window.__WebsocketProvider;
    if (!Y || !WebsocketProvider) return;

    const ydoc = new Y.Doc();
    const yChat = ydoc.getArray('chat');
    const yTasks = ydoc.getArray('tasks');
    const yAgentTasks = ydoc.getMap('agent_tasks');
    const yTaskChats = ydoc.getMap('task_chats');
    const yAssembledHtml = ydoc.getMap('assembled_html');
    const yAgentState = ydoc.getMap('agent_state');
    const ySummary = ydoc.getMap('plan_summary');
    const yTree = ydoc.getMap('plan_tree');

    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const provider = new WebsocketProvider(`${wsProto}//${location.host}`, `codelab3-${roomId}`, ydoc);

    provider.on('status', ({ status }) => {
      setConnected(status === 'connected');
    });

    yjsRef.current = { ydoc, provider, yChat, yTasks, yAgentTasks, yTaskChats, yAssembledHtml, yAgentState, ySummary, yTree };

    return () => {
      provider.disconnect();
      ydoc.destroy();
    };
  }, [roomId]);

  return { yjsRef, connected };
}

/* === Yjs awareness hook === */
function useAwareness(yjsRef, connected) {
  const [users, setUsers] = useState([]);

  useEffect(() => {
    const provider = yjsRef.current?.provider;
    if (!provider || !connected) return;

    const awareness = provider.awareness;
    // Set local user info
    awareness.setLocalStateField('user', {
      name: userName,
      color: myColor,
      id: myUid,
      emoji: myAvatar,
      cursorStyle: myCursorStyle,
      avatarUrl: myAvatarUrl,
    });

    // Mouse tracking for remote cursors
    let _lcx = 0, _lcy = 0;
    const onMouseMove = (e) => {
      if (!showRemoteCursors) return;
      const x = e.clientX, y = e.clientY;
      if (Math.abs(x - _lcx) < 2 && Math.abs(y - _lcy) < 2) return;
      _lcx = x; _lcy = y;
      awareness.setLocalStateField('cursor', { x: x / window.innerWidth, y: y / window.innerHeight });
    };
    const onMouseLeave = () => {
      awareness.setLocalStateField('cursor', null);
    };
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseleave', onMouseLeave);

    const update = () => {
      const list = [];
      const seen = new Map(); // dedup by name
      const localId = awareness.clientID;
      awareness.getStates().forEach((state, clientId) => {
        if (state.user) {
          const entry = { ...state.user, cursor: state.cursor || null, isMe: clientId === localId };
          const key = (entry.name || '').toLowerCase();
          const existing = seen.get(key);
          // Keep workbench entry (has mode) over plan.html entry (no mode)
          if (!existing || (entry.mode && !existing.mode)) { seen.set(key, entry); }
        }
      });
      seen.forEach(u => list.push(u));
      setUsers(list);
    };

    awareness.on('change', update);
    update();

    return () => {
      awareness.off('change', update);
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseleave', onMouseLeave);
    };
  }, [yjsRef, connected]);

  return users;
}

/* === Yjs chat messages sync hook === */
function useYjsChat(yjsRef) {
  const [chatMessages, setChatMessages] = useState([]);

  useEffect(() => {
    const check = () => {
      const yChat = yjsRef.current?.yChat;
      if (!yChat) return false;
      const update = () => setChatMessages(yChat.toArray().map(m => ({
        id: m.id || Math.random().toString(36).slice(2),
        name: m.name || 'unknown',
        text: m.text || '',
        color: m.color ?? 0,
        createdAt: m.createdAt || Date.now(),
        kind: m.kind || 'text',
        emoji: m.emoji || '',
        avatarUrl: m.avatarUrl || '',
      })));
      yChat.observe(update);
      update();
      return true;
    };
    if (check()) return;
    const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200);
    return () => clearInterval(iv);
  }, [yjsRef]);

  const pushChat = useCallback((msg) => {
    const yChat = yjsRef.current?.yChat;
    if (!yChat) return;
    yChat.push([{
      id: 'chat-' + Math.random().toString(36).slice(2, 10),
      name: msg.name || userName,
      text: msg.text || '',
      color: msg.color ?? myColor,
      kind: msg.kind || 'text',
      emoji: msg.emoji ?? myAvatar,
      avatarUrl: msg.avatarUrl ?? myAvatarUrl,
      createdAt: Date.now(),
    }]);
  }, [yjsRef]);

  return { chatMessages, pushChat };
}

/* === Yjs tasks sync hook === */
function useYjsTasks(yjsRef) {
  const [tasks, setTasks] = useState([]);

  useEffect(() => {
    const check = () => {
      const yTasks = yjsRef.current?.yTasks;
      if (!yTasks) return false;
      const update = () => setTasks(yTasks.toArray().map((t, i) => ({ ...t, _idx: i })));
      yTasks.observe(update);
      update();
      return true;
    };
    if (check()) return;
    const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200);
    return () => clearInterval(iv);
  }, [yjsRef]);

  const pushTask = useCallback((text, priority) => {
    const yTasks = yjsRef.current?.yTasks;
    if (!yTasks) return;
    yTasks.push([{ text, done: false, priority: priority || 'medium', createdAt: Date.now() }]);
  }, [yjsRef]);

  const toggleTask = useCallback((idx) => {
    const yTasks = yjsRef.current?.yTasks;
    if (!yTasks) return;
    const t = yTasks.get(idx);
    if (!t) return;
    const ydoc = yjsRef.current.ydoc;
    ydoc.transact(() => {
      yTasks.delete(idx, 1);
      yTasks.insert(idx, [{ ...t, done: !t.done }]);
    });
  }, [yjsRef]);

  return { tasks, pushTask, toggleTask };
}

/* === Yjs agent tasks sync hook === */
function useAgentTasks(yjsRef) {
  const [agentTasks, setAgentTasks] = useState([]);

  useEffect(() => {
    const check = () => {
      const yAgentTasks = yjsRef.current?.yAgentTasks;
      if (!yAgentTasks) return false;
      const update = () => {
        const tasks = [];
        yAgentTasks.forEach((val, key) => {
          try { tasks.push(typeof val === 'string' ? JSON.parse(val) : val); } catch {}
        });
        tasks.sort((a, b) => (a.order || 0) - (b.order || 0));
        setAgentTasks(tasks);
      };
      yAgentTasks.observe(update);
      update();
      return true;
    };
    if (check()) return;
    const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200);
    return () => clearInterval(iv);
  }, [yjsRef]);

  const claimTask = useCallback((taskId, uName, uColor) => {
    const yAgentTasks = yjsRef.current?.yAgentTasks;
    if (!yAgentTasks) return;
    const raw = yAgentTasks.get(taskId);
    const task = raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null;
    if (!task) return;
    if (task.assignee) {
      showToast('该任务已被认领', 'warn');
      return;
    }
    yAgentTasks.set(taskId, JSON.stringify({
      ...task, status: 'claimed', assignee: uName, assigneeColor: uColor, updatedAt: Date.now(),
    }));
  }, [yjsRef]);

  return { agentTasks, claimTask };
}

/* === Yjs agent state sync hook === */
function useAgentState(yjsRef) {
  const [agentState, setAgentState] = useState({
    brainBusy: false,
    brainStatus: 'idle',
    lastStructuredPrompt: '',
    structuredPromptAt: 0,
    generatedTreePreview: null,
    generatedTreeAt: 0,
    generatedTreeBy: '',
  });

  useEffect(() => {
    const check = () => {
      const yAgentState = yjsRef.current?.yAgentState;
      if (!yAgentState) return false;
      const update = () => {
        const rawPreview = yAgentState.get('generatedTreePreview');
        let generatedTreePreview = null;
        if (rawPreview) {
          try {
            generatedTreePreview = typeof rawPreview === 'string' ? JSON.parse(rawPreview) : rawPreview;
          } catch {
            generatedTreePreview = null;
          }
        }
        setAgentState({
          brainBusy: yAgentState.get('brainBusy') || false,
          brainStatus: yAgentState.get('brainStatus') || 'idle',
          lastStructuredPrompt: yAgentState.get('lastStructuredPrompt') || '',
          structuredPromptAt: yAgentState.get('structuredPromptAt') || 0,
          generatedTreePreview,
          generatedTreeAt: yAgentState.get('generatedTreeAt') || 0,
          generatedTreeBy: yAgentState.get('generatedTreeBy') || '',
        });
      };
      yAgentState.observe(update);
      update();
      return true;
    };
    if (check()) return;
    const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200);
    return () => clearInterval(iv);
  }, [yjsRef]);

  return agentState;
}

/* === Yjs summary sync hook === */
function useYjsSummary(yjsRef) {
  const [summary, setSummary] = useState(null);
  const [flashKey, setFlashKey] = useState(0);
  const [discussedItems, setDiscussedItems] = useState({});

  useEffect(() => {
    const check = () => {
      const ySummary = yjsRef.current?.ySummary;
      if (!ySummary) return false;
      const update = () => {
        const raw = ySummary.get('data');
        if (raw) {
          try { setSummary(typeof raw === 'string' ? JSON.parse(raw) : raw); } catch {}
        }
        const fk = ySummary.get('flashKey');
        if (fk) setFlashKey(fk);
        const rawDiscussed = ySummary.get('discussedItems');
        if (rawDiscussed) {
          try { setDiscussedItems(typeof rawDiscussed === 'string' ? JSON.parse(rawDiscussed) : rawDiscussed); } catch {}
        }
      };
      ySummary.observe(update);
      update();
      return true;
    };
    if (check()) return;
    const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200);
    return () => clearInterval(iv);
  }, [yjsRef]);

  const saveSummary = useCallback((data) => {
    const ySummary = yjsRef.current?.ySummary;
    if (!ySummary) return;
    ySummary.set('data', JSON.stringify(data));
    ySummary.set('flashKey', (ySummary.get('flashKey') || 0) + 1);
    setSummary(data);
  }, [yjsRef]);

  const setDiscussedItem = useCallback((key, value) => {
    const ySummary = yjsRef.current?.ySummary;
    if (!ySummary) return;
    const current = (() => { try { const r = ySummary.get('discussedItems'); return typeof r === 'string' ? JSON.parse(r) : (r || {}); } catch { return {}; } })();
    current[key] = value;
    ySummary.set('discussedItems', JSON.stringify(current));
    setDiscussedItems({...current});
  }, [yjsRef]);

  return { summary, flashKey, saveSummary, discussedItems, setDiscussedItem };
}

/* === Yjs tree sync hook === */
function useYjsTree(yjsRef) {
  const [nodes, setNodes] = useState(INITIAL_NODES);
  const [edges, setEdges] = useState(INITIAL_EDGES);
  const [categories, setCategories] = useState([]);

  useEffect(() => {
    const check = () => {
      const yTree = yjsRef.current?.yTree;
      if (!yTree) return false;
      const update = () => {
        const rawNodes = yTree.get('nodes');
        const rawEdges = yTree.get('edges');
        const rawCats = yTree.get('categories');
        let parsedNodes = [];
        if (rawNodes) {
          try { parsedNodes = typeof rawNodes === 'string' ? JSON.parse(rawNodes) : rawNodes; } catch {}
        }
        // Migrate old nodes that lack 'category' field
        const needsMigration = parsedNodes.length > 0 && parsedNodes.some(n => !n.category);
        if (needsMigration) {
          let cats = [];
          if (rawCats) { try { cats = typeof rawCats === 'string' ? JSON.parse(rawCats) : rawCats; } catch {} }
          if (cats.length === 0) cats = [{ id: 'general', label: '通用', color: '#60a5fa' }];
          const rowCounters = {};
          parsedNodes = parsedNodes.filter(n => n.id !== 'root').map(n => {
            if (n.category) return n;
            const catId = cats[0]?.id || 'general';
            rowCounters[catId] = (rowCounters[catId] || 0);
            const row = rowCounters[catId]++;
            return { ...n, category: catId, row, tier: undefined, x: undefined, y: undefined };
          });
          // Save migrated data back
          yTree.set('nodes', JSON.stringify(parsedNodes));
          if (!rawCats) yTree.set('categories', JSON.stringify(cats));
        }
        setNodes(parsedNodes);
        if (rawEdges) {
          try { setEdges(typeof rawEdges === 'string' ? JSON.parse(rawEdges) : rawEdges); } catch {}
        }
        if (rawCats) {
          try { setCategories(typeof rawCats === 'string' ? JSON.parse(rawCats) : rawCats); } catch {}
        }
      };
      yTree.observe(update);
      update();
      return true;
    };
    if (check()) return;
    const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200);
    return () => clearInterval(iv);
  }, [yjsRef]);

  const saveTree = useCallback((newNodes, newEdges, newCategories) => {
    const yTree = yjsRef.current?.yTree;
    if (!yTree) return;
    const ydoc = yjsRef.current.ydoc;
    ydoc.transact(() => {
      yTree.set('nodes', JSON.stringify(newNodes));
      yTree.set('edges', JSON.stringify(newEdges));
      if (newCategories !== undefined) {
        yTree.set('categories', JSON.stringify(newCategories));
      }
    });
  }, [yjsRef]);

  return { nodes, edges, categories, saveTree };
}

/* === API CALL (streaming) === */
async function callAI(messages, onChunk, onDone, onError, options = {}) {
  const apiKey = getApiKey();
  const apiBase = getApiBase();
  const model = getApiModel();

  if (!apiKey) {
    onError('no-key');
    return;
  }

  const timeoutMs = options.timeoutMs || 180000;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  let fullText = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal,
      body: JSON.stringify({
        apiBase, model, apiKey,
        ...(options.temperature !== undefined ? { temperature: options.temperature } : {}),
        max_tokens: options.max_tokens ?? 4096,
        timeout_hint: timeoutMs,
        stream: true,
        messages,
      }),
    });

    if (!res.ok) {
      clearTimeout(timer);
      const err = await res.text();
      let msg;
      try { msg = JSON.parse(err)?.error?.message || err; } catch { msg = err; }
      onError(msg);
      return;
    }

    const reader = res.body?.getReader();
    if (!reader) { clearTimeout(timer); onError('No stream reader'); return; }

    const dec = new TextDecoder();
    let buf = '', truncatedByLength = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          const delta = j.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            onChunk(fullText);
          }
          const finishReason = j.choices?.[0]?.finish_reason;
          if (finishReason === 'length') truncatedByLength = true;
        } catch {}
      }
    }
    clearTimeout(timer);
    onDone(fullText, { truncated: truncatedByLength });
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') {
      if (fullText.length > 0) {
        onDone(fullText, { truncated: true, error: '请求超时，已返回部分结果' });
      } else {
        onError('请求超时，请稍后重试或检查网络连接');
      }
    } else {
      onError(e.message || '网络连接中断');
    }
  }
}

/* === RENDER MARKDOWN BOLD === */
function renderText(text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={i}>{part.slice(2, -2)}</strong>;
    }
    return part;
  });
}

function formatTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

    const reader = new FileReader();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 80; canvas.height = 80;
        const ctx = canvas.getContext('2d');
        const size = Math.min(img.width, img.height);
        const sx = (img.width - size) / 2, sy = (img.height - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, 80, 80);
        const dataUrl = canvas.toDataURL('image/png');
        setLocalAvatarUrl(dataUrl);

      img.src = ev.target.result;

/* === REMOTE CURSORS COMPONENT === */
function RemoteCursors({ users }) {
  const containerRef = useRef(null);
  const elMapRef = useRef(new Map());

  useEffect(() => {
    if (!showRemoteCursors) {
      elMapRef.current.forEach(el => el.remove());
      elMapRef.current.clear();
      return;
    }
    const container = containerRef.current;
    if (!container) return;
    const seen = new Set();
    users.forEach(u => {
      if (u.isMe || !u.cursor) return;
      const uid = u.id;
      seen.add(uid);
      const cx = u.cursor.x * window.innerWidth;
      const cy = u.cursor.y * window.innerHeight;
      let el = elMapRef.current.get(uid);
      if (!el) {
        el = document.createElement('div');
        el.className = 'remote-cursor';
        const color = COLORS[u.color % 6] || COLORS[0];
        el.innerHTML = '<div class="rc-arrow" style="border-bottom-color:' + color + '"></div><div class="rc-label" style="background:' + color + '">' + (u.name || '?') + '</div>';
        container.appendChild(el);
        elMapRef.current.set(uid, el);
      }
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
    });
    elMapRef.current.forEach((el, uid) => {
      if (!seen.has(uid)) { el.remove(); elMapRef.current.delete(uid); }
    });
  }, [users]);

  useEffect(() => {
    return () => {
      elMapRef.current.forEach(el => el.remove());
      elMapRef.current.clear();
    };
  }, []);

  return React.createElement('div', { ref: containerRef });
}

function Message({ msg, isAI, users }) {
  // Try to find current user data from awareness for live avatar sync
  const liveUser = !isAI && users ? users.find(u => u.name === msg.name) : null;
  const avatarUrl = liveUser?.avatarUrl || msg.avatarUrl || '';
  const emoji = liveUser?.emoji || msg.emoji || '';
  const color = liveUser ? liveUser.color : msg.color;

  const renderAvatar = () => {
    if (isAI) return <div className="msg-av msg-av-ai">{"\u2726"}</div>;
    if (avatarUrl) {
      return <div className="msg-av" style={{padding:0,overflow:'hidden',border:'none'}}>
        <img src={avatarUrl} alt={msg.name} style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}} />
      </div>;
    }
    if (emoji && AVATARS_MAP[emoji]) {
      return <div className="msg-av" style={{padding:0,overflow:'hidden',border:'none'}}
        dangerouslySetInnerHTML={{__html:AVATARS_MAP[emoji]}} />;
    }
    return <div className="msg-av"
      style={{ background: COLORS[color % 6] + "22", borderColor: COLORS[color % 6] + "66", color: COLORS[color % 6] }}>
      {(msg.name || '?').charAt(0).toUpperCase()}
    </div>;
  };

  return (
    <div className="msg">
      {renderAvatar()}
      <div className="msg-body">
        <div className={`msg-name ${isAI ? "msg-name-ai" : ""}`}>
          {isAI ? "主持 AI" : msg.name}
          <span className="msg-time">{formatTime(msg.createdAt)}</span>
        </div>
        <div className={`msg-bub ${isAI ? "msg-bub-ai" : "msg-bub-player"}`}>
          {msg.text.split("\n").map((line, i, arr) => (
            <span key={i}>{renderText(line)}{i < arr.length - 1 && <br/>}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

  useEffect(() => {

      const prefix = discussionTopic.type === 'conflict' ? '关于冲突: ' : '关于问题: ';
      setText(prefix + '"' + discussionTopic.text + '"\n我的看法是：');
      if (textareaRef.current) {
        textareaRef.current.focus();
        textareaRef.current.scrollIntoView({ behavior: 'smooth' });
        requestAnimationFrame(() => {
          const el = textareaRef.current;
          if (el) { el.style.height = '34px'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
        });
      }
    }
  }, [discussionTopic]);

  // Close popups on outside click
  useEffect(() => {
    if (!showEmoji && !showMention) return;
    const handler = (e) => {
      const portalPopup = document.getElementById('emoji-portal-popup');
      if (portalPopup && portalPopup.contains(e.target)) return;
      if (toolbarRef.current && !toolbarRef.current.contains(e.target)) {
        setShowEmoji(false);
        setShowMention(false);
      }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showEmoji, showMention]);

  const handleSend = useCallback(() => {
    const trimmed = text.trim();
    if (!trimmed) return;
    pushChat({ name: userName, text: trimmed, color: myColor });
    if (/@ai/i.test(trimmed)) {
      pendingAIRef.current = true;
    }
    if (discussionTopic && onDiscussionSent) {
      onDiscussionSent();
    }
    setText("");
    setShowEmoji(false);
    setShowMention(false);
    if (textareaRef.current) textareaRef.current.style.height = "34px";
  }, [text, pushChat, discussionTopic, onDiscussionSent]);

  const handleKeyDown = useCallback((e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  }, [handleSend]);

  const handleInput = useCallback((e) => {
    setText(e.target.value);
    const el = e.target;
    el.style.height = "34px";
    el.style.height = Math.min(el.scrollHeight, 100) + "px";
  }, []);

  const insertEmoji = useCallback((emoji) => {
    setText(t => t + emoji.char);
    setShowEmoji(false);
    textareaRef.current?.focus();
  }, []);

  const insertMention = useCallback((name) => {
    setText(t => t + `@${name} `);
    setShowMention(false);
    textareaRef.current?.focus();
  }, []);

  const toggleEmoji = useCallback(() => {
    setShowEmoji(v => {
      if (!v && emojiBtnRef.current) {
        const r = emojiBtnRef.current.getBoundingClientRect();
        setEmojiPos({left: r.left, bottom: window.innerHeight - r.top + 6});
      }
      return !v;
    });
    setShowMention(false);
  }, []);

  const toggleMention = useCallback(() => {
    setShowMention(v => !v);
    setShowEmoji(false);
  }, []);

  const onlineUsers = users || [];

  return (
    <div className="chat-panel">
      <div className="chat-header">
        <div className="chat-header-dot"></div>
        <span className="chat-header-count">#{chatMessages.length} 条消息</span>
        <span className="chat-header-sync">
          {connected ? (<><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M4 12l6 6L20 6"/></svg> 同步中</>) : '离线'}
        </span>
      </div>
      <div className="chat-messages">
        {chatMessages.length === 0 && (
          <div style={{padding:'20px',textAlign:'center',color:'var(--textd)',fontSize:'11px',fontFamily:'var(--font-code)',lineHeight:'1.8'}}>
            还没有消息。发送第一条消息开始讨论。<br/>
            消息会同步到工作台的聊天频道。
          </div>
        )}
        {chatMessages.map(msg => (
          <Message key={msg.id} msg={msg} isAI={msg.name === '主持 AI' || msg.name === 'AI'} users={onlineUsers} />
        ))}
        {isTyping && !streamText && <TypingIndicator />}
        {streamText && <StreamingMessage text={streamText} />}
        <div ref={messagesEndRef} />
      </div>
      <div className="chat-input-area">
        <div className="chat-input-row">
          <textarea
            ref={textareaRef}
            className="chat-input"
            value={text}
            onChange={handleInput}
            onKeyDown={handleKeyDown}
            placeholder="发消息，Shift + Enter 换行"
            rows={1}
          />
          <button
            className="chat-send"
            onClick={handleSend}
            disabled={!text.trim() || isTyping}
          >发送</button>
        </div>
        <div className="chat-toolbar" ref={toolbarRef} style={{position:'relative'}}>
          {/* Emoji Picker — portal to body to escape overflow:hidden */}
          {showEmoji && ReactDOM.createPortal(
            <div id="emoji-portal-popup" className="emoji-popup" style={{position:'fixed',left:emojiPos.left,bottom:emojiPos.bottom,top:'auto',marginBottom:0,zIndex:9999}}>
              <div className="emoji-popup-grid">
                {CHAT_EMOJIS_PLAN.map((e, i) => (
                  <button key={e.id} className="emoji-popup-btn" onClick={() => insertEmoji(e)} title={e.label}>
                    <span className="emoji-popup-char">{e.src ? <img src={e.src} alt={e.label} width="28" height="28" /> : e.char}</span>
                  </button>
                ))}
              </div>
            </div>,
            document.body
          )}
          {/* Mention Picker */}
          {showMention && (
            <div className="mention-popup">
              <div className="mention-popup-title">选择成员</div>
              <div className="mention-popup-item mention-popup-item-ai" onClick={() => insertMention('AI')}>
                <div className="mention-popup-dot" style={{background:'var(--purple)'}}></div>
                <span className="mention-popup-name">AI 主持人</span>
              </div>
              {onlineUsers.map((u, i) => (
                <div key={i} className="mention-popup-item" onClick={() => insertMention(u.name)}>
                  {u.avatarUrl
                    ? <div style={{width:20,height:20,borderRadius:'50%',overflow:'hidden',flexShrink:0}}><img src={u.avatarUrl} alt={u.name} style={{width:'100%',height:'100%',objectFit:'cover'}} /></div>
                    : u.emoji && AVATARS_MAP[u.emoji]
                      ? <div style={{width:20,height:20,borderRadius:'50%',overflow:'hidden',flexShrink:0}} dangerouslySetInnerHTML={{__html:AVATARS_MAP[u.emoji]}} />
                      : <div className="mention-popup-dot" style={{background: COLORS[u.color % 6]}}></div>
                  }
                  <span className="mention-popup-name">{u.name}</span>
                  {u.isMe && <span className="mention-popup-me">(我)</span>}
                </div>
              ))}
              {onlineUsers.length === 0 && (
                <div className="mention-popup-item" style={{color:'var(--textd)',fontSize:'11px'}}>暂无在线成员</div>
              )}
            </div>
          )}
          <button ref={emojiBtnRef} className={`chat-tool${showEmoji?' active':''}`} onClick={toggleEmoji}>表情</button>
          <button className={`chat-tool${showMention?' active':''}`} onClick={toggleMention}>@ 成员</button>
          <button className="chat-tool" onClick={() => { insertMention('AI'); }}>
            @AI
          </button>
          <button className="chat-tool chat-tool-primary" onClick={onRefresh} disabled={isTyping || isRefreshing || !!refreshingBy}
            style={isRefreshing || refreshingBy ? {display:'inline-flex',alignItems:'center',gap:4} : {}}>
            {(isRefreshing || refreshingBy) && (() => {
              const who = isRefreshing ? userName : refreshingBy;
              const u = (users || []).find(u => u.name === who);
              return u?.avatarUrl
                ? <img src={u.avatarUrl} alt={who} style={{width:16,height:16,borderRadius:'50%',objectFit:'cover'}} />
                : u?.emoji && AVATARS_MAP[u.emoji]
                  ? <span style={{width:16,height:16,borderRadius:'50%',overflow:'hidden',display:'inline-block'}} dangerouslySetInnerHTML={{__html:AVATARS_MAP[u.emoji]}} />
                  : <span style={{width:16,height:16,borderRadius:'50%',background:COLORS[(u?.color||0)%6],display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'8px',color:'#fff',fontWeight:700}}>{(who||'?')[0]}</span>;
            })()}
            {isRefreshing ? `${userName} 整理中...` : refreshingBy ? `${refreshingBy} 整理中...` : 'AI 整理'}

      </div>
    </div>
  );
}
